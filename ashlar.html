      waiting for a rival...`);
    const b=document.getElementById("copy-code");
    if(b) b.onclick=async()=>{
      try{ await navigator.clipboard.writeText(code); b.textContent="Copied!"; }
      catch(e){ b.textContent=code; }
      setTimeout(()=>{ b.textContent="Copy"; },1400);
    };
  });
  NET.peer.on("error",err=>setLobbyStatus("Connection trouble ("+err.type+") — try hosting again."));
  NET.peer.on("connection",conn=>{
    wireConn(conn);
    conn.on("open",()=>{
      const seed=(Math.random()*2**31)|0;
      setSeed(seed);
      NET.onLobby=(msg)=>{
        if(msg.l==="deck"){
          NET.onLobby=null;
          beginMP("host",0,myDeckCounts(),msg.deck);
        }
      };
      netSend({l:"hello", seed, deck:myDeckCounts()});
    });
  });
}
async function joinGame(code){
  code=(code||"").trim().toUpperCase();
  if(code.length<3){ setLobbyStatus("Enter the room code your rival gave you."); return; }
  try{ await loadPeerJS(); }catch(e){ setLobbyStatus(e.message); return; }
  NET.peer=new Peer();
  setLobbyStatus("Riding to the host's keep...");
  NET.peer.on("error",err=>setLobbyStatus("Could not reach that room ("+err.type+")."));
  NET.peer.on("open",()=>{
    const conn=NET.peer.connect("ashlar-"+code,{reliable:true});
    wireConn(conn);
    NET.onLobby=(msg)=>{
      if(msg.l==="hello"){
        NET.onLobby=null;
        setSeed(msg.seed);
        netSend({l:"deck", deck:myDeckCounts()});
        beginMP("join",1,msg.deck,myDeckCounts());
      }
    };
  });
}
function beginMP(mode, seat, counts0, counts1){
  NET.mode=mode;
  MYSEAT=seat;
  beginGame(counts0, counts1, null,
    "A living rival faces you across the valley. May the warmer hearth prevail.");
}

/* deck selection: choose the two architects */
const SEL={you:"longwall", rival:"random"};
function showDeckSelect(){
  const panel=document.getElementById("overlay-panel");
  panel.classList.add("wide");
  const DECK_ICON={longwall:"trebuchet",warren:"serpent",cloister:"courtyard",
                   ashes:"pyre",siegecamp:"bombard",veil:"ward"};
  const opt=(side,idKey,name,tag,ic)=>`
    <div class="deck-opt${SEL[side]===idKey?" chosen":""}" data-side="${side}" data-deck="${idKey}">
      <span class="deck-opt-ic">${icon(ic)}</span>
      <div>
        <div class="deck-opt-name">${name}</div>
        <div class="deck-opt-tag">${tag}</div>
      </div>
    </div>`;
  const row=side=>{
    let out=Object.entries(DECKS).map(([k,d])=>opt(side,k,d.name,d.tag,DECK_ICON[k])).join("");
    if(side==="you") out+=opt("you","custom","Custom","Build both decks yourself.","guild");
    else out+=opt("rival","random","Random","Surprise me.","veil");
    return out;
  };
  panel.innerHTML=`<h2>Choose the Architects</h2>
    <div class="deck-cols">
      <div><h3 class="deck-col-h">Your deck</h3><div id="deck-row-you">${row("you")}</div></div>
      <div><h3 class="deck-col-h">Rival's deck</h3><div id="deck-row-rival">${row("rival")}</div></div>
    </div>
    <div style="margin-top:14px; display:flex; gap:14px; justify-content:center; align-items:center;">
      <button class="btn ghost" id="ds-library">Open the Library</button>
      <button class="btn" id="ds-begin">Begin vs Rival AI</button>
    </div>
    <div style="margin-top:12px; display:flex; gap:10px; justify-content:center; align-items:center;">
      <span style="font-size:11px; color:#7a5a30; letter-spacing:2px; text-transform:uppercase;" title="Each architect brings the deck selected under 'Your deck'. The rival's column is ignored online.">Play online</span>
      <button class="btn ghost" id="ds-host">Host</button>
      <input id="ds-code" class="lobby-input" maxlength="4" placeholder="CODE" autocomplete="off">
      <button class="btn ghost" id="ds-join">Join</button>
    </div>
    <div id="lobby-status" style="margin-top:8px; font-size:12.5px; color:#5c4a2e; min-height:18px;"></div>`;
  const refresh=()=>{
    panel.querySelectorAll(".deck-opt").forEach(el=>{
      el.classList.toggle("chosen", SEL[el.dataset.side]===el.dataset.deck);
    });
    const rivalRow=panel.querySelector("#deck-row-rival");
    if(rivalRow) rivalRow.style.opacity = SEL.you==="custom" ? .35 : 1;
  };
  panel.querySelectorAll(".deck-opt").forEach(el=>{
    el.onclick=()=>{ SEL[el.dataset.side]=el.dataset.deck; refresh(); };
  });
  panel.querySelector("#ds-library").onclick=showSetup;
  panel.querySelector("#ds-host").onclick=hostGame;
  panel.querySelector("#ds-join").onclick=()=>joinGame(panel.querySelector("#ds-code").value);
  panel.querySelector("#ds-begin").onclick=()=>{
    if(SEL.you==="custom"){ showSetup(); return; } // custom begins from the library
    const rivalKey = SEL.rival==="random"
      ? Object.keys(DECKS)[Math.floor(Math.random()*Object.keys(DECKS).length)]
      : SEL.rival;
    beginGame(DECKS[SEL.you].counts, DECKS[rivalKey].counts, DECKS[rivalKey].bias,
      `You raise ${DECKS[SEL.you].name}; the rival raises ${DECKS[rivalKey].name}.`);
  };
  refresh();
  document.getElementById("overlay").classList.add("show");
}
function libTotal(){ return Object.values(LIB_COUNTS).reduce((a,b)=>a+b,0); }
function showSetup(){
  if(!LIB_COUNTS){ LIB_COUNTS={}; DECK_LIST.forEach(([id,n])=>LIB_COUNTS[id]=n); }
  const panel=document.getElementById("overlay-panel");
  panel.classList.add("wide");
  panel.innerHTML=`<h2>The Library</h2>
    <p style="margin-bottom:10px;">Every tile in the game. Both architects draw from identical decks — choose how many of each enter them (0–4). Hold ⌘ over a card for details.</p>
    <div class="lib-grid">${DECK_LIST.map(([id])=>`
      <div class="lib-entry">
        <div class="card${LIB_COUNTS[id]===0?" excluded":""}" data-lib="${id}">${cardInnerHTML(id,0)}</div>
        <div class="lib-stepper">
          <button class="btn ghost" data-dec="${id}">−</button>
          <span class="lib-count${LIB_COUNTS[id]===0?" zeroed":""}" id="libc-${id}">${LIB_COUNTS[id]}</span>
          <button class="btn ghost" data-inc="${id}">+</button>
        </div>
      </div>`).join("")}</div>
    <div style="margin-top:14px; display:flex; gap:14px; justify-content:center; align-items:center;">
      <span id="lib-total" style="font-size:13px; color:#5c4a2e;">${libTotal()} tiles per deck</span>
      <button class="btn ghost" id="lib-back">Back</button>
      <button class="btn ghost" id="lib-reset">Reset</button>
      <button class="btn" id="lib-begin">Begin mirror match</button>
    </div>`;
  const refresh=()=>{
    DECK_LIST.forEach(([id])=>{
      const c=panel.querySelector("#libc-"+id);
      if(c){ c.textContent=LIB_COUNTS[id]; c.classList.toggle("zeroed",LIB_COUNTS[id]===0); }
      const cd=panel.querySelector(`[data-lib="${id}"]`);
      if(cd) cd.classList.toggle("excluded",LIB_COUNTS[id]===0);
    });
    const tot=panel.querySelector("#lib-total");
    tot.textContent=libTotal()+" tiles per deck"+(libTotal()<15?" — need at least 15":"");
    panel.querySelector("#lib-begin").disabled=libTotal()<15;
  };
  panel.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.dec; LIB_COUNTS[id]=Math.max(0,LIB_COUNTS[id]-1); refresh();
  });
  panel.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.inc;
    LIB_COUNTS[id]=Math.min(DEFS[id].maxCopies||4, LIB_COUNTS[id]+1);
    refresh();
  });
  panel.querySelector("#lib-reset").onclick=()=>{
    DECK_LIST.forEach(([id,n])=>LIB_COUNTS[id]=n); refresh();
  };
  panel.querySelector("#lib-back").onclick=showDeckSelect;
  panel.querySelector("#lib-begin").onclick=()=>beginGame(null,null,null,
    "A mirror match — both architects draw from your forged deck.");
  panel.querySelectorAll("[data-lib]").forEach(cd=>{
    const pseudo={defId:cd.dataset.lib, faceDown:false, dormant:false, bricked:false, spent:false, claims:0};
    cd.onmouseenter=(e)=>showTooltip(e,pseudo,0);
    cd.onmousemove=(e)=>moveTooltip(e);
    cd.onmouseleave=hideTooltip;
  });
  document.getElementById("overlay").classList.add("show");
}
function beginGame(counts0, counts1, rivalBias, intro){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("overlay-panel").classList.remove("wide");
  if(NET.mode==="local") setSeed((Math.random()*2**31)|0);
  G.players[0]=newPlayer(0, counts0);
  G.players[1]=newPlayer(1, counts1);
  G.aiBias=rivalBias||null;
  G._fireTotals=[2,2]; G._handLen=undefined;
  document.getElementById("hand").innerHTML="";
  buildBoards();
  renderAll();
  log("Two architects. One valley. May the warmer hearth prevail.","system");
  if(intro) log(intro,"system");
  startTurn(0);
}
/* deck & graveyard viewer */
function showDeckOverlay(){
  const grouped=list=>{
    const m={}; list.forEach(id=>m[id]=(m[id]||0)+1);
    const rows=Object.entries(m)
      .sort((a,b)=>DEFS[a[0]].name.localeCompare(DEFS[b[0]].name))
      .map(([id,n])=>`<div class="dk-row"><span class="dk-ic">${icon(id)}</span>${DEFS[id].name}<span class="dk-n">×${n}</span></div>`);
    return rows.join("")||'<div class="dk-row" style="opacity:.55;">— empty —</div>';
  };
  const panel=document.getElementById("overlay-panel");
  panel.classList.add("wide");
  panel.innerHTML=`<h2>Deck &amp; Graveyards</h2>
    <div class="dk-cols">
      <div><h3>Your deck · ${G.players[MYSEAT].deck.length}</h3>${grouped(G.players[MYSEAT].deck)}</div>
      <div><h3>Your graveyard · ${G.players[MYSEAT].grave.length}</h3>${grouped(G.players[MYSEAT].grave)}</div>
      <div><h3>Rival graveyard · ${G.players[1-MYSEAT].grave.length}</h3>${grouped(G.players[1-MYSEAT].grave)}</div>
    </div>
    <button class="btn" style="margin-top:14px;" onclick="document.getElementById('overlay').classList.remove('show');document.getElementById('overlay-panel').classList.remove('wide');">Close</button>`;
  document.getElementById("overlay").classList.add("show");
}
document.getElementById("deck-info").addEventListener("click",showDeckOverlay);

G.players[0]=newPlayer(0);
G.players[1]=newPlayer(1);
buildBoards();
renderAll();
showDeckSelect();
</script>
</body>
