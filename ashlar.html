  }
}

/* ---------- shape payoffs ---------- */
function countCourtyards(p){
  let n=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(p.board.has(key(x,y))) continue;
    if(DIRS.every(([dx,dy])=>{
      const t=p.board.get(key(x+dx,y+dy));
      return t && t.defId!=="boulder";
    })) n++;
  }
  return n;
}
function hasTwoByTwo(p){
  for(let y=0;y<H-1;y++)for(let x=0;x<W-1;x++){
    if([[0,0],[1,0],[0,1],[1,1]].every(([dx,dy])=>{
      const t=p.board.get(key(x+dx,y+dy));
      return t && t.defId!=="boulder";
    })) return true;
  }
  return false;
}
function distFromHearth(p,x,y){ return Math.abs(x-CX)+Math.abs(y-CY); }
// trebuchet: length of the unbroken line of own tiles extending from an open edge
function lineFromOpenEdge(p, x, y, edges){
  const dir=edges.findIndex(e=>e);
  if(dir<0) return 0;
  const [dx,dy]=DIRS[dir];
  let n=0, cx=x+dx, cy=y+dy;
  while(inBounds(cx,cy)){
    const t=p.board.get(key(cx,cy));
    if(!t||t.defId==="boulder") break;
    n++; cx+=dx; cy+=dy;
  }
  return n;
}
// tiles of a given kind that are lit (claimed fire, awake, whole)
function litTiles(p, defId){
  return [...p.board.values()].filter(t=>t.defId===defId&&t.claims>0&&!t.dormant&&!t.bricked);
}
// how many true connections (mutual open edges) a tile has
function connectionCount(p,t){
  let n=0;
  DIRS.forEach(([dx,dy],dir)=>{
    const q=p.board.get(key(t.x+dx,t.y+dy));
    if(q && q.defId!=="boulder" && t.edges[dir] && q.edges[OPP[dir]]) n++;
  });
  return n;
}
const isLeaf=(p,t)=> t.defId!=="hearth" && t.defId!=="boulder" && connectionCount(p,t)===1;
// spiral stair: elbows are tiles with exactly two neighbors at a right angle
function countElbows(p){
  let n=0;
  for(const t of p.board.values()){
    if(t.defId==="boulder") continue;
    let h=0,v=0;
    DIRS.forEach(([dx,dy])=>{
      const q=p.board.get(key(t.x+dx,t.y+dy));
      if(q&&q.defId!=="boulder"){ if(dy===0)h++; else v++; }
    });
    if(h===1&&v===1) n++;
  }
  return n;
}
// twin gates: the castle spans two opposite board edges
function touchesOppositeEdges(p){
  let minX=99,maxX=-1,minY=99,maxY=-1;
  for(const t of p.board.values()){
    if(t.defId==="boulder") continue;
    minX=Math.min(minX,t.x); maxX=Math.max(maxX,t.x);
    minY=Math.min(minY,t.y); maxY=Math.max(maxY,t.y);
  }
  return (minX===0&&maxX===W-1)||(minY===0&&maxY===H-1);
}
// mirror hall: every tile has a partner reflected across the hearth's column
function mirrorSymmetric(p){
  for(const t of p.board.values()){
    if(t.defId==="boulder") continue;
    const m=p.board.get(key(2*CX-t.x, t.y));
    if(!m||m.defId==="boulder") return false;
  }
  return true;
}
// aqueduct: longest unbroken straight run of tiles, any row or column
function longestRun(p){
  let best=0;
  for(let y=0;y<H;y++){
    let run=0;
    for(let x=0;x<W;x++){
      const t=p.board.get(key(x,y));
      run = (t&&t.defId!=="boulder") ? run+1 : 0;
      best=Math.max(best,run);
    }
  }
  for(let x=0;x<W;x++){
    let run=0;
    for(let y=0;y<H;y++){
      const t=p.board.get(key(x,y));
      run = (t&&t.defId!=="boulder") ? run+1 : 0;
      best=Math.max(best,run);
    }
  }
  return best;
}
// keystone: all four orthogonal neighbors are yours
function fullySurrounded(p,x,y){
  return DIRS.every(([dx,dy])=>{
    const t=p.board.get(key(x+dx,y+dy));
    return t && t.defId!=="boulder";
  });
}
// grand ballista: widest span of the castle (boulders don't count)
function castleSpan(p){
  let minX=99,maxX=-1,minY=99,maxY=-1;
  for(const t of p.board.values()){
    if(t.defId==="boulder") continue;
    minX=Math.min(minX,t.x); maxX=Math.max(maxX,t.x);
    minY=Math.min(minY,t.y); maxY=Math.max(maxY,t.y);
  }
  if(maxX<0) return 1;
  return Math.max(maxX-minX+1, maxY-minY+1);
}

/* ---------- damage & destruction ---------- */
function findBulwark(p, x, y){
  for(const t of p.board.values()){
    if(t.defId!=="bulwark"||t.bricked||t.faceDown) continue;
    if(Math.abs(t.x-x)<=1 && Math.abs(t.y-y)<=1) return t;
  }
  return null;
}
async function dealDamage(p, tile, dmg, sourceLabel, attacker){
  // toll gates collect on rival aggression — even blows a bulwark will eat
  if(attacker===1-p.i){
    for(const tg of litTiles(p,"tollgate")){
      log(`${pname(p.i)} Toll Gate collects — draw a tile.`, who(p.i));
      await drawTiles(p,1);
    }
  }
  // bulwark interception
  const bw=findBulwark(p, tile.x, tile.y);
  if(bw && bw.uid!==tile.uid){
    log(`${pname(p.i)} Bulwark hurls itself before the blow!`, who(p.i));
    await animateHit(p.i,bw.x,bw.y);
    await destroyTile(p,bw);
    return;
  }
  if(bw && bw.uid===tile.uid){ /* bulwark itself targeted: it just dies absorbing */ }
  tile.hp-=dmg;
  if(tile.defId==="hearth"){
    await animateHit(p.i,tile.x,tile.y);
    p.flames=Math.max(0,tile.hp);
    log(`A flame of ${pname(p.i)} hearth is snuffed! (${p.flames} remain)`,"system");
    renderAll();
    if(p.flames<=0){ endGame(1-p.i); return; }
    return; // hearth never leaves the board
  }
  if(tile.hp<=0){
    // burrows: protected leaves cling on at the brink
    if(tile.hp===0 && litTiles(p,"burrows").length && isLeaf(p,tile)){
      log(`The ${DEFS[tile.defId].name} shelters in its burrow — barely standing.`, who(p.i));
      await animateHit(p.i,tile.x,tile.y);
      renderAll();
      return;
    }
    // a killing blow shatters on impact — no flash first
    await destroyTile(p,tile);
  }else{
    await animateHit(p.i,tile.x,tile.y);
    renderAll();
  }
}
async function destroyTile(p,tile,silent){
  if(tile.defId==="hearth") return;
  const el=tileEl(p.i,tile.x,tile.y);
  if(el){
    // the blow lands: the face cracks and jolts in the same instant
    spawnShatter(p.i,tile.x,tile.y,tile);
    el.style.visibility="hidden";
    await sleep(550);
  }
  p.board.delete(key(tile.x,tile.y));
  p.claimOrder=p.claimOrder.filter(u=>u!==tile.uid);
  p.grave.push(tile.defId);
  if(!silent) log(`${DEFS[tile.defId].name} in ${pname(p.i)} castle is destroyed.`, who(p.i));
  settleDormancy(p);
  renderAll();
  // a falling bonfire erupts over its neighbors
  if(tile.defId==="bonfire" && !G.over){
    log("The Great Bonfire erupts as it falls!","system");
    for(const [dx,dy] of DIRS){
      if(G.over) return;
      const n=p.board.get(key(tile.x+dx,tile.y+dy));
      if(n) await dealDamage(p,n,1,"Great Bonfire",p.i);
    }
  }
}

/* ---------- the stack ---------- */
function pushStack(item){ G.stack.push(item); renderStack(); }
async function resolveStack(){
  while(G.stack.length){
    // response window for the non-controller of the top item
    const top=G.stack[G.stack.length-1];
    const responder=1-top.controller;
    if(!top.noRespond && !top.countered){
      let reacted;
      if(responder===MYSEAT) reacted=await humanResponseWindow(top);
      else if(NET.mode==="local") reacted=await aiResponseWindow(top);
      else reacted=await remoteResponseWindow(top);
      if(reacted) continue; // a new item was added; loop to offer responses to it
    }
    const item=G.stack.pop();
    renderStack();
    if(item.countered){
      log(`${item.label} fizzles — countered.`,"system");
      // the source never fired: release its fire claim and let it stand dormant
      const sp=G.players[item.controller];
      const src=[...sp.board.values()].find(t=>t.uid===item.sourceUid);
      if(src && src.claims){
        src.claims=0; src.dormant=true;
        sp.claimOrder=sp.claimOrder.filter(u=>u!==src.uid);
        settleDormancy(sp);
      }
    }else{
      await item.effect();
    }
    await structureCheck();
    if(G.over) return;
  }
  renderStack();
}

/* ---------- ETB abilities ---------- */
async function onEnterAbility(p, tile){
  const d=DEFS[tile.defId];
  const id=tile.defId;
  if(id==="hallway"){
    G.playsLeft++;
    log(`${pname(p.i)} Hallway: draw a tile, play an extra tile.`, who(p.i));
    await drawTiles(p,1);
  }
  else if(id==="courtyard"){
    const n=countCourtyards(p);
    if(n>0){ log(`Courtyard: ${n} enclosed ground${n>1?"s":""} — draw ${n}.`, who(p.i)); await drawTiles(p,n); }
    else log(`Courtyard finds no enclosed grounds.`, who(p.i));
  }
  else if(id==="serpent"){
    if(!hasTwoByTwo(p)){
      G.playsLeft++; await drawTiles(p,1);
      log(`Serpent Wall: the castle winds like a snake — draw a tile, play an extra tile.`, who(p.i));
    } else log(`Serpent Wall: the castle is too blocky. Nothing happens.`, who(p.i));
  }
  else if(id==="spiral"){
    const n=Math.floor(countElbows(p)/2);
    if(n>0){ log(`The Spiral Stair winds through ${countElbows(p)} elbows — draw ${n}.`, who(p.i)); await drawTiles(p,n); }
    else log(`The Spiral Stair winds to nowhere.`, who(p.i));
  }
  else if(id==="twingates"){
    if(touchesOppositeEdges(p)){
      G.playsLeft+=2;
      log(`The Twin Gates open — the castle spans the valley! Draw 2, +2 plays.`, who(p.i));
      await drawTiles(p,2);
    } else log(`The Twin Gates await a castle that spans the valley.`, who(p.i));
  }
  else if(id==="cornerstone"){
    if((tile.x===0||tile.x===W-1)&&(tile.y===0||tile.y===H-1)){
      log(`The Cornerstone Shrine blesses the far corner — draw 3.`, who(p.i));
      await drawTiles(p,3);
    } else log(`The Cornerstone Shrine yearns for a true corner.`, who(p.i));
  }
  else if(id==="milestone"){
    const runThrough=(dx,dy)=>{
      let n=1;
      for(const s of [-1,1]){
        let cx=tile.x+dx*s, cy=tile.y+dy*s;
        while(inBounds(cx,cy)){
          const q=p.board.get(key(cx,cy));
          if(!q||q.defId==="boulder") break;
          n++; cx+=dx*s; cy+=dy*s;
        }
      }
      return n;
    };
    const n=Math.max(runThrough(1,0),runThrough(0,1))>=3?2:1;
    log(`The Milestone marks the road — draw ${n}.`, who(p.i));
    await drawTiles(p,n);
  }
  else if(id==="cloisterwalk"){
    const now=countCourtyards(p);
    p.board.delete(key(tile.x,tile.y));
    const before=countCourtyards(p);
    p.board.set(key(tile.x,tile.y),tile);
    if(now>before){
      G.playsLeft++;
      log(`The Cloister Walk closes the ring — draw 1, +1 play.`, who(p.i));
      await drawTiles(p,1);
    } else log(`The Cloister Walk encloses nothing new.`, who(p.i));
  }
  else if(id==="caravan"){
    G.playsLeft++;
    log(`The Trade Caravan arrives — both larders fill.`, who(p.i));
    await drawTiles(p,2);
    await drawTiles(G.players[1-p.i],2);
  }
  else if(id==="pyre"){
    const own=[...p.board.values()].filter(t=>t.defId!=="hearth"&&t.defId!=="boulder"&&t.uid!==tile.uid);
    if(!own.length){ log(`The Pyre finds nothing to burn.`, who(p.i)); return; }
    const victim = await choose(p,
      ()=>humanPickOwnTile(own,"Choose a tile to feed to the Pyre."),
      ()=>aiPickPyre(p,own), encTile, decTileOn(p));
    if(!victim){ log(`The Pyre stays cold.`, who(p.i)); return; }
    const item={
      kind:"ability", label:`Pyre → ${victim.faceDown?"a veiled tile":DEFS[victim.defId].name}`,
      sourceUid:tile.uid, controller:p.i, target:{p:p.i, uid:victim.uid},
      effect:async()=>{
        const cur=[...p.board.values()].find(t=>t.uid===item.target.uid);
        if(!cur){ log("The Pyre's offering is already gone.","system"); return; }
        await destroyTile(p,cur);
        if(G.over) return;
        await drawTiles(p,2);
      }
    };
    pushStack(item);
    log(`${pname(p.i)} Pyre is stacked with kindling...`, who(p.i));
    await resolveStack();
  }
  else if(id==="mastermason"){
    if(!p.grave.length){ log(`The Master Mason finds no fallen stone.`, who(p.i)); return; }
    const pickId = await choose(p,
      ()=>showGravePicker(p,"Return a fallen tile to your hand"),
      ()=>aiPickGrave(p));
    if(pickId==null){ log(`The Master Mason rests.`, who(p.i)); return; }
    const item={
      kind:"ability", label:`Master Mason → ${DEFS[pickId].name}`,
      sourceUid:tile.uid, controller:p.i, target:null,
      effect:async()=>{
        const gi=p.grave.indexOf(pickId);
        if(gi<0){ log("The fallen stone is beyond recall.","system"); return; }
        p.grave.splice(gi,1);
        p.hand.push(pickId);
        log(`The Master Mason restores a ${DEFS[pickId].name} to ${pname(p.i)} hand.`,"system");
        renderHandArea(); renderAll();
      }
    };
    pushStack(item);
    log(`${pname(p.i)} Master Mason sifts the rubble...`, who(p.i));
    await resolveStack();
  }
  else if(id==="haunt"){
    if(!p.grave.length){ log(`The Haunt finds no spirit to wear.`, who(p.i)); return; }
    const pickId = await choose(p,
      ()=>showGravePicker(p,"Choose a fallen tile for the Haunt to become"),
      ()=>aiPickGrave(p));
    if(pickId==null){ log(`The Haunt stays formless.`, who(p.i)); return; }
    const item={
      kind:"ability", label:`Haunt → ${DEFS[pickId].name}`,
      sourceUid:tile.uid, controller:p.i, target:{p:p.i, uid:tile.uid},
      effect:async()=>{
        const cur=[...p.board.values()].find(t=>t.uid===tile.uid);
        if(!cur){ log("The Haunt was banished before taking form.","system"); return; }
        const gi=p.grave.indexOf(pickId);
        if(gi<0){ log("The chosen spirit has fled.","system"); return; }
        p.grave.splice(gi,1);
        cur.defId=pickId;
        cur.edges=rotEdges(DEFS[pickId].edges,cur.rot);
        cur.hp=DEFS[pickId].hp;
        animatePop(p.i,cur.x,cur.y);
        log(`The Haunt takes the form of a ${DEFS[pickId].name}!`,"system");
        renderAll();
        await sleep(380);
        await onEnterAbility(p,cur);
      }
    };
    pushStack(item);
    log(`${pname(p.i)} Haunt reaches into the grave...`, who(p.i));
    await resolveStack();
  }
  else if(id==="earthquake"){
    if(freeFires(p)<1){
      tile.dormant=true;
      log(`The Earthquake slumbers — no free fire.`, who(p.i));
      return;
    }
    claimFire(p,tile,1);
    const item={
      kind:"ability", label:"Earthquake", sourceUid:tile.uid, controller:p.i, target:null,
      effect:async()=>{
        const victims=[];
        for(const q of G.players)
          for(const t of q.board.values())
            if(isLeaf(q,t)) victims.push({q,t});
        log(`The valley shakes — ${victims.length} loose stone${victims.length===1?"":"s"}!`,"system");
        for(const v of victims){
          if(G.over) return;
          const still=[...v.q.board.values()].find(x=>x.uid===v.t.uid);
          if(still) await dealDamage(v.q, still, 1, "Earthquake", p.i);
        }
      }
    };
    pushStack(item);
    log(`${pname(p.i)} Earthquake rumbles beneath the valley...`, who(p.i));
    await resolveStack();
  }
  else if(d.persistent && d.needsFire){
    if(freeFires(p)>=d.needsFire){
      claimFire(p,tile,d.needsFire);
      log(`${d.name} takes its fire${d.needsFire>1?"s":""}.`, who(p.i));
    } else {
      tile.dormant=true;
      log(`${d.name} sits dark — needs ${d.needsFire} free fire${d.needsFire>1?"s":""}.`, who(p.i));
    }
  }
  else if(id==="gatehouse"){
    G.playsLeft++;
    log(`${pname(p.i)} Gatehouse swings wide — an extra play.`, who(p.i));
  }
  else if(id==="keystone"){
    if(fullySurrounded(p,tile.x,tile.y)){
      G.playsLeft++;
      log(`The Keystone locks into place — draw 2, play an extra tile!`, who(p.i));
      await drawTiles(p,2);
    } else log(`The Keystone sits loose — nothing embraces it.`, who(p.i));
  }
  else if(id==="mirror"){
    if(mirrorSymmetric(p)){
      G.playsLeft++;
      log(`The Mirror Hall gleams — the castle is in balance! Draw 2, play an extra tile.`, who(p.i));
      await drawTiles(p,2);
    } else log(`The Mirror Hall reflects only disorder.`, who(p.i));
  }
  else if(id==="aqueduct"){
    const n=Math.floor(longestRun(p)/3);
    if(n>0){
      log(`The Aqueduct flows along ${longestRun(p)} stones — draw ${n}.`, who(p.i));
      await drawTiles(p,n);
    } else log(`The Aqueduct finds no line to follow.`, who(p.i));
  }
  else if(id==="guild"){
    const elig=[];
    DIRS.forEach(([dx,dy])=>{
      const n=p.board.get(key(tile.x+dx,tile.y+dy));
      if(n && n.defId!=="hearth" && n.defId!=="boulder") elig.push(n);
    });
    if(!elig.length){ log("The Masons' Guild has nothing to shift.", who(p.i)); return; }
    let mover=null, dest=null;
    if(p.i===MYSEAT){
      mover=await humanPickOwnTile(elig,"Choose an adjacent tile for the masons to move.");
      if(NET.mode!=="local") netSend({c:encTile(mover)});
      if(mover){
        p.board.delete(key(mover.x,mover.y));
        const cells=legalCells(p,mover.edges).filter(([cx,cy])=>!(cx===mover.x&&cy===mover.y));
        p.board.set(key(mover.x,mover.y),mover);
        if(cells.length) dest=await humanPickCell(cells,"Choose where the masons carry it.");
        if(NET.mode!=="local") netSend({c:dest});
      }
    }else if(NET.mode!=="local"){
      mover=decTileOn(p)(await netAwaitChoice());
      if(mover) dest=await netAwaitChoice();
    }else{
      const mv=aiPickGuildMove(p,elig);
      if(mv){ mover=mv.tile; dest=mv.dest; }
    }
    if(!mover||!dest){ log("The masons rest their trowels.", who(p.i)); return; }
    const item={
      kind:"ability", label:`Masons' Guild → ${mover.faceDown?"a veiled tile":DEFS[mover.defId].name}`,
      sourceUid:tile.uid, controller:p.i, target:{p:p.i, uid:mover.uid},
      effect:async()=>{
        const cur=[...p.board.values()].find(t=>t.uid===item.target.uid);
        if(!cur){ log("The masons find nothing left to move.","system"); return; }
        const [nx,ny]=dest;
        if(p.board.has(key(nx,ny))){ log("The masons' site is occupied — they stand down.","system"); return; }
        p.board.delete(key(cur.x,cur.y));
        if(!canPlaceAt(p,cur.edges,nx,ny)){ // re-verify at resolution
          p.board.set(key(cur.x,cur.y),cur);
          log("The ground no longer suits — the masons stand down.","system");
          return;
        }
        cur.x=nx; cur.y=ny;
        p.board.set(key(nx,ny),cur);
        animatePop(p.i,nx,ny);
        log(`The masons carry the ${cur.faceDown?"veiled tile":DEFS[cur.defId].name} to new ground.`,"system");
        renderAll();
      }
    };
    pushStack(item);
    log(`${pname(p.i)} Masons' Guild takes up their tools...`, who(p.i));
    await resolveStack();
  }
  else if(id==="reliquary"){
    log(`${pname(p.i)} Reliquary yields its treasures — draw 2.`, who(p.i));
    await drawTiles(p,2);
  }
  else if(id==="thief"){
    const ep=G.players[1-p.i];
    log(`${pname(p.i)} Ember Thief seizes a rival fire!`, who(p.i));
    settleDormancy(ep);
    renderAll();
  }
  else if(id==="rats"){
    if(freeFires(p)<1){
      tile.dormant=true;
      log(`The Rat Swarm slumbers — no free fire.`, who(p.i));
      return;
    }
    claimFire(p,tile,1);
    const item={
      kind:"ability", label:"Rat Swarm", sourceUid:tile.uid, controller:p.i, target:null,
      effect:async()=>{
        const ep=G.players[1-p.i];
        if(!ep.hand.length){ log("The rats find an empty larder.","system"); return; }
        const idx=Math.floor(RNG()*ep.hand.length);
        const lost=ep.hand[idx];
        await discardFromHand(ep,idx);
        log(`The rats devour ${ep.i===MYSEAT?"your":"the rival's"} ${DEFS[lost].name}!`,"system");
        renderAll();
      }
    };
    pushStack(item);
    log(`${pname(p.i)} Rat Swarm scurries toward the larder...`, who(p.i));
    await resolveStack();
  }
  else if(id==="echo"){
    const elig=[];
    DIRS.forEach(([dx,dy])=>{
      const n=p.board.get(key(tile.x+dx,tile.y+dy));
      if(n && n.defId!=="hearth" && n.defId!=="boulder" && !n.faceDown) elig.push(n);
    });
    if(!elig.length){ log("The Echo Arch hums to no one.", who(p.i)); return; }
    const target = await choose(p,
      ()=>humanPickOwnTile(elig,"Choose an adjacent tile to blink."),
      ()=>aiPickEcho(p,elig), encTile, decTileOn(p));
    if(!target){ log("The Echo Arch stays quiet.", who(p.i)); return; }
    const item={
      kind:"ability", label:`Echo Arch → ${DEFS[target.defId].name}`,
      sourceUid:tile.uid, controller:p.i, target:{p:p.i, uid:target.uid},
      effect:async()=>{
        const cur=[...p.board.values()].find(t=>t.uid===item.target.uid);
        if(!cur){ log("The echo finds nothing to answer.","system"); return; }
        const {x,y,rot,defId}=cur;
        p.board.delete(key(x,y));
        p.claimOrder=p.claimOrder.filter(u=>u!==cur.uid);
        settleDormancy(p);
        const fresh=makeTile(defId,rot,false);
        putTile(p,fresh,x,y);
        animatePop(p.i,x,y);
        log(`${DEFS[defId].name} shimmers and re-enters!`,"system");
        renderAll();
        await sleep(420);
        await onEnterAbility(p,fresh);
      }
    };
    pushStack(item);
    log(`${pname(p.i)} Echo Arch resonates...`, who(p.i));
    await resolveStack();
  }
  else if(d.needsFire){
    const need=d.needsFire;
    if(freeFires(p)<need){
      tile.dormant=true;
      log(`${d.name} enters dormant — not enough free fire to crew it.`, who(p.i));
      return;
    }
    const isBrick = id==="witch";
    const aoe = id==="bombard";
    let dmg=1;
    if(id==="spire") dmg = distFromHearth(p,tile.x,tile.y)>=4?2:1;
    if(id==="trebuchet") dmg = Math.min(3, Math.max(1, lineFromOpenEdge(p,tile.x,tile.y,tile.edges)));
    if(id==="ballista") dmg = Math.max(1, Math.floor(castleSpan(p)/3));
    if(id==="necropolis"){
      dmg = Math.min(3, Math.floor((G.players[0].grave.length+G.players[1].grave.length)/8));
      if(dmg<=0){
        tile.dormant=true;
        log(`The Necropolis finds too few dead to answer it.`, who(p.i));
        return;
      }
    }
    const target = await choose(p,
      ()=>humanPickTarget(1-p.i, isBrick),
      ()=>aiPickTarget(1-p.i, isBrick, dmg, aoe),
      encTile, decTileOn(G.players[1-p.i]));
    if(!target){
      tile.dormant=true;
      log(`${d.name} holds its fire — no target.`, who(p.i));
      return;
    }
    claimFire(p,tile,need);
    const tName = target.faceDown ? "a veiled tile" : DEFS[target.defId].name;
    const item={
      kind: isBrick?"ability":"attack",
      label: isBrick ? `${d.name} → ${tName}`
           : `${d.name} (${dmg}${aoe?", splash":""}) → ${tName}`,
      sourceUid:tile.uid, controller:p.i,
      target:{p:1-p.i, uid:target.uid},
      dmg,
      effect:async()=>{
        const ep=G.players[1-p.i];
        const cur=[...ep.board.values()].find(t=>t.uid===item.target.uid);
        if(!cur){ log(`${d.name}'s target is already gone.`,"system"); return; }
        await animateProjectile(p.i,tile.x,tile.y, 1-p.i,cur.x,cur.y);
        if(isBrick){
          cur.bricked=true; cur.claims=0;
          ep.claimOrder=ep.claimOrder.filter(u=>u!==cur.uid);
          log(`${DEFS[cur.defId].name} is bricked by the Cinder Witch!`, "system");
          settleDormancy(ep); renderAll();
        }else if(aoe){
          const cx=cur.x, cy=cur.y;
          await dealDamage(ep,cur,1,d.name,p.i);
          for(const [dx,dy] of DIRS){
            if(G.over) return;
            const n=ep.board.get(key(cx+dx,cy+dy));
            if(n) await dealDamage(ep,n,1,d.name,p.i);
          }
        }else{
          await dealDamage(ep,cur,dmg,d.name,p.i);
        }
      }
    };
    pushStack(item);
    log(`${pname(p.i)} ${d.name} takes aim at ${tName}...`, who(p.i));
    await resolveStack();
  }
}
/* ---------- turn flow ---------- */
const HAND_LIMIT=7;
/* discard a card from hand to the graveyard, with its animation */
async function discardFromHand(p, idx){
  const id=p.hand[idx];
  if(id===undefined) return null;
  if(p.i===MYSEAT){
    const takeoff=handCardTakeoff(idx);
    G._playedIdx=idx;
    p.hand.splice(idx,1);
    p.grave.push(id);
    animateDiscard(takeoff);
    renderHandArea();
    await sleep(260);
  }else{
    p.hand.splice(idx,1);
    p.grave.push(id);
    renderMeters();
  }
  return id;
}
/* the card slumps toward the graveyard pile, draining to gray */
function animateDiscard(takeoff){
  if(!takeoff.rect||!takeoff.node) return;
  const g=document.createElement("div");
  g.className="flycard";
  g.style.left=takeoff.rect.left+"px"; g.style.top=takeoff.rect.top+"px";
  g.style.width=takeoff.rect.width+"px"; g.style.height=takeoff.rect.height+"px";
  takeoff.node.classList.remove("selected","drawn","unplayable");
  takeoff.node.style.animation="none";
  takeoff.node.style.left="0px";
  takeoff.node.style.setProperty("--fy","0px");
  takeoff.node.style.setProperty("--fr","0deg");
  g.appendChild(takeoff.node);
  document.body.appendChild(g);
  const dk=document.getElementById("deck-info");
  const dr=dk&&dk.getBoundingClientRect ? dk.getBoundingClientRect() : {left:60,top:innerHeight-100,width:60,height:90};
  const dx=dr.left+dr.width/2-(takeoff.rect.left+takeoff.rect.width/2);
  const dy=dr.top+dr.height/2-(takeoff.rect.top+takeoff.rect.height/2);
  g.animate(
    [{transform:"translate(0,0) scale(1) rotate(0deg)", opacity:1, filter:"grayscale(0) brightness(1)"},
     {transform:`translate(${dx*0.5}px,${dy*0.5}px) scale(.6) rotate(-8deg)`, opacity:.85, filter:"grayscale(.7) brightness(.8)", offset:.5},
     {transform:`translate(${dx}px,${dy}px) scale(.28) rotate(-14deg)`, opacity:0, filter:"grayscale(1) brightness(.5)"}],
    {duration:520, easing:"cubic-bezier(.45,.1,.45,1)", fill:"forwards"});
  setTimeout(()=>g.remove(), 600);
}
async function drawTiles(p,n){
  // one card at a time, so every draw gets its animation — and multiple
  // draws sweep in one after another
  for(let i=0;i<n;i++){
    if(!p.deck.length) break;
    p.hand.push(p.deck.pop());
    if(p.i===MYSEAT){ renderHandArea(); await sleep(300); }
    else { renderMeters(); await sleep(140); }
  }
  renderHandArea();
}
function pname(i){ return i===MYSEAT?"your":"the rival's"; }

async function startTurn(i){
  if(G.over) return;
  G.active=i; G.playsLeft=1;
  document.getElementById("turn-banner").textContent = i===MYSEAT?"Your turn":"Rival's turn";
  document.getElementById("turn-banner").classList.toggle("enemy", i===1);
  document.getElementById("panel-"+V(i)).classList.toggle("active-turn", true);
  document.getElementById("panel-"+V(1-i)).classList.toggle("active-turn", false);
  const p=G.players[i];
  p.flags={fireClaimed:false};
  for(const t of p.board.values()) t.usedBarracks=false;
  // festival room: momentum pays out
  if((p.placedCount||0)>=3){
    for(const f of [...p.board.values()].filter(t=>t.defId==="festival"&&!t.bricked)){
      G.playsLeft++;
      log(`${pname(i)} Festival Room celebrates the building spree — +1 play, draw 1.`, who(i));
      await drawTiles(p,1);
    }
  }
  p.placedCount=0;
  // coal cellar: the artillery reloads
  if(litTiles(p,"coalcellar").length){
    const ONESHOT=["catapult","spire","trebuchet","bombard","ballista","witch","rats","necropolis"];
    let freed=0;
    for(const t of p.board.values()){
      if(ONESHOT.includes(t.defId)&&t.claims>0){
        freed+=t.claims; t.claims=0;
        p.claimOrder=p.claimOrder.filter(u=>u!==t.uid);
      }
    }
    if(freed){
      settleDormancy(p);
      log(`${pname(i)} Coal Cellar reloads the engines — ${freed} fire${freed>1?"s":""} freed.`, who(i));
      renderAll();
    }
  }
  // relight: kindled tiles that arrived dark claim their fire when it frees
  for(const t of p.board.values()){
    const dd=DEFS[t.defId];
    if(dd.persistent && dd.needsFire && t.dormant && !t.bricked && t.claims===0
       && freeFires(p)>=dd.needsFire){
      claimFire(p,t,dd.needsFire);
      t.dormant=false;
      log(`${pname(i)} ${dd.name} relights.`, who(i));
    }
  }
  // studies and gardens
  for(const t of p.board.values()){
    if(t.claims>0 && !t.dormant && !t.bricked){
      if(t.defId==="scriptorium"){
        log(`${pname(i)} Scriptorium yields an extra tile.`, who(i));
        await drawTiles(p,1);
      }else if(t.defId==="garden" && countCourtyards(p)>0){
        log(`${pname(i)} Hidden Garden blooms in its courtyard — an extra tile.`, who(i));
        await drawTiles(p,1);
      }
    }
  }
  // ossuary: the dead pay tribute
  const graveSum=G.players[0].grave.length+G.players[1].grave.length;
  if(graveSum>(p.lastGraveSum||0)){
    for(const o of litTiles(p,"ossuary")){
      log(`${pname(i)} Ossuary counts the fallen — draw a tile.`, who(i));
      await drawTiles(p,1);
    }
  }
  p.lastGraveSum=graveSum;
  // the warbands ride
  const ep=G.players[1-i];
  for(const wb of [...p.board.values()].filter(t=>
      ["outriders","wolfpack","stormaltar"].includes(t.defId)&&t.claims>0&&!t.dormant&&!t.bricked)){
    if(G.over) return;
    const enemies=[...ep.board.values()].filter(t=>t.defId!=="hearth"&&t.defId!=="boulder");
    if(!enemies.length) continue;
    let target=null;
    if(wb.defId==="outriders"){
      let best=-1;
      for(const t of enemies){
        const dd=Math.abs(t.x-CX)+Math.abs(t.y-CY);
        if(dd>best||(dd===best&&RNG()<0.5)){ best=dd; target=t; }
      }
    }else if(wb.defId==="wolfpack"){
      const leaves=enemies.filter(t=>isLeaf(ep,t));
      if(leaves.length) target=leaves[Math.floor(RNG()*leaves.length)];
    }else{ // storm altar hunts the newest stone
      target=enemies.reduce((a,b)=>a.uid>b.uid?a:b);
    }
    if(!target) continue;
    log(`${pname(i)} ${DEFS[wb.defId].name} strikes the ${target.faceDown?"veiled tile":DEFS[target.defId].name}!`, who(i));
    await animateProjectile(i,wb.x,wb.y,1-i,target.x,target.y);
    await dealDamage(ep,target,1,DEFS[wb.defId].name,i);
    if(G.over) return;
    await structureCheck();
    if(G.over) return;
  }
  await drawTiles(p,1);
  renderAll();
  if(i===MYSEAT){
    G.mode="idle";
    setPrompt(`Play a tile (${G.playsLeft} play left), demolish one of yours, or end your turn.`,
      [{label:"End Turn", cls:"", fn:()=>endTurn()},
       {label:"Demolish a tile", cls:"danger", fn:()=>beginDemolish()}]);
    maybeAutoEnd();
  }else{
    setPrompt("The rival architect ponders...");
    if(NET.mode==="local") await aiTurn();
    else await remoteTurnLoop();
  }
}
/* the remote player's turn: their actions arrive over the wire */
async function remoteTurnLoop(){
  while(!G.over){
    const a=await netAwaitAction();
    if(a.t==="place") await applyRemotePlace(a);
    else if(a.t==="demolish") await applyRemoteDemolish(a);
    else if(a.t==="end"){ await endTurn(); return; }
  }
}
async function applyRemotePlace(a){
  const p=G.players[G.active];
  const id=p.hand[a.handIdx];
  if(id===undefined) return;
  p.hand.splice(a.handIdx,1);
  G.playsLeft--;
  const isBoulder=id==="boulder";
  const targetP=isBoulder?G.players[1-p.i]:p;
  const tile=makeTile(id,a.rot,a.fd);
  putTile(targetP,tile,a.x,a.y);
  await flyCard(rivalHandRect(),targetP.i,a.x,a.y,null);
  animatePop(targetP.i,a.x,a.y);
  log(isBoulder ? "The rival hurls a Boulder into your grounds!" :
      (a.fd?"The rival lays a tile face down...":`The rival builds a ${DEFS[id].name}.`),"foe");
  renderAll();
  p.placedCount=(p.placedCount||0)+1;
  if(!isBoulder) await checkBarracks(p,a.x,a.y);
  if(isBoulder) await structureCheck();
  else if(!a.fd) await onEnterAbility(p,tile);
  renderAll();
}
async function applyRemoteDemolish(a){
  const p=G.players[G.active];
  await discardFromHand(p,a.d);
  G.playsLeft--;
  const tile=p.board.get(key(a.x,a.y));
  if(tile){
    log(`The rival pays the masons and demolishes a ${DEFS[tile.defId].name}.`,"foe");
    await destroyTile(p,tile,true);
    await structureCheck();
  }
}
async function endTurn(){
  if(G.over) return;
  if(NET.mode!=="local" && G.active===MYSEAT) netSend({a:{t:"end"}});
  clearSelection();
  setPrompt("");
  await structureCheck();
  if(G.over) return;
  {
    const tp=G.players[G.active];
    if(tp.hand.length>HAND_LIMIT){
      if(G.active===MYSEAT) await humanDiscardDown();
      else if(NET.mode!=="local"){ while(tp.hand.length>HAND_LIMIT){ const di=await netAwaitChoice(); await discardFromHand(tp, di); } }
    }
  }
  await sleep(300);
  startTurn(1-G.active);
}
/* overburdened: click cards to discard until at the hand limit */
function humanDiscardDown(){
  return new Promise(res=>{
    G.mode="discard";
    G.pending={discardDownResolve:res};
    updateDiscardPrompt();
    renderHandArea();
  });
}
function updateDiscardPrompt(){
  const n=G.players[MYSEAT].hand.length-HAND_LIMIT;
  if(n<=0){
    const r=G.pending&&G.pending.discardDownResolve;
    G.mode="idle"; G.pending=null; setPrompt(""); renderHandArea();
    if(r) r();
    return;
  }
  setPrompt(`Overburdened — click ${n} tile${n>1?"s":""} to discard.`);
}
/* pick exactly one card to discard (the masons' fee) */
function humanPickDiscardOne(msg){
  return new Promise(res=>{
    G.mode="discard";
    G.pending={discardPickResolve:res};
    setPrompt(msg,[{label:"Cancel", cls:"ghost", fn:()=>{
      G.mode="idle"; G.pending=null; setPrompt(""); renderHandArea(); res(null);
    }}]);
    renderHandArea();
  });
}

/* demolish: spend your play to remove one of your own tiles (frees fires) */
function beginDemolish(){
  if(G.playsLeft<1){ setPromptFlash("No plays left this turn."); return; }
  if(!G.players[MYSEAT].hand.length){ setPromptFlash("The masons want payment — you have no tile to discard."); return; }
  G.mode="demolish";
  setPrompt("Choose one of your tiles to demolish (not the Hearth). It will cost a discard.",
    [{label:"Cancel", cls:"ghost", fn:()=>{G.mode="idle"; renderAll(); startIdlePrompt();}}]);
  renderAll();
}
async function doDemolish(tile){
  G.mode="idle"; renderAll();
  const idx=await humanPickDiscardOne(`The masons want payment — discard a tile to demolish the ${DEFS[tile.defId].name}.`);
  if(idx==null){ startIdlePrompt(); return; }
  if(NET.mode!=="local") netSend({a:{t:"demolish", x:tile.x, y:tile.y, d:idx}});
  const paid=await discardFromHand(G.players[MYSEAT],idx);
  G.playsLeft--;
  log(`You pay the masons a ${DEFS[paid].name} and demolish your ${DEFS[tile.defId].name}${tile.claims?", freeing its fire":""}.`,"you");
  await destroyTile(G.players[MYSEAT],tile,true);
  await structureCheck();
  afterHumanPlay();
}
function startIdlePrompt(){
  setPrompt(`Play a tile (${G.playsLeft} play${G.playsLeft===1?"":"s"} left), demolish, or end your turn.`,
    [{label:"End Turn", cls:"", fn:()=>endTurn()},
     {label:"Demolish a tile", cls:"danger", fn:()=>beginDemolish()}]);
}
function afterHumanPlay(){
  if(G.over) return;
  renderAll();
  renderHandArea();
  if(G.playsLeft>0) startIdlePrompt();
  else setPrompt("No plays remain — ending turn...", [{label:"End Turn", cls:"", fn:()=>endTurn()}]);
  maybeAutoEnd();
}
/* nothing left to do? pass the turn after a beat */
let autoEndTimer=null;
function maybeAutoEnd(){
  clearTimeout(autoEndTimer);
  if(G.over || G.active!==MYSEAT || G.mode!=="idle" || G.stack.length) return;
  const p=G.players[MYSEAT];
  if(G.playsLeft>0 && p.hand.length>0) return;
  autoEndTimer=setTimeout(()=>{
    if(G.over || G.active!==MYSEAT || G.mode!=="idle" || G.stack.length) return;
    const pp=G.players[MYSEAT];
    if(G.playsLeft<=0 || pp.hand.length===0) endTurn();
  }, 600);
}

/* ---------- human play flow ---------- */
let sel = null; // {handIndex, defId, rot, faceDown}
function clearSelection(){ sel=null; G.mode="idle"; renderHandArea(); renderAll(); }
function selectCard(idx){
  if(G.over) return;
  if(G.mode==="discard" && G.pending){
    if(G.pending.discardPickResolve){
      const r=G.pending.discardPickResolve;
      G.mode="idle"; G.pending=null; setPrompt("");
      r(idx);
    }else{
      if(NET.mode!=="local") netSend({c:idx});
      discardFromHand(G.players[MYSEAT],idx).then(updateDiscardPrompt);
    }
    return;
  }
  if(G.active!==MYSEAT || G.mode==="target" || G.mode==="respond" || G.mode==="discard") return;
  const p=G.players[MYSEAT];
  if(G.playsLeft<1){ setPromptFlash("No plays left — end your turn."); return; }
  const defId=p.hand[idx];
  if(sel && sel.handIndex===idx){ clearSelection(); startIdlePrompt(); return; }
  sel={handIndex:idx, defId, rot:0, faceDown: defId==="ward"};
  G.mode="place";
  const d=DEFS[defId];
  const btns=[{label:"Rotate (R)", cls:"", fn:()=>rotateSel()},
              {label:"Cancel", cls:"ghost", fn:()=>{clearSelection(); startIdlePrompt();}}];
  if(defId==="boulder")
    setPrompt("Hurl the Boulder — choose any empty cell beside a rival tile.", [{label:"Cancel", cls:"ghost", fn:()=>{clearSelection(); startIdlePrompt();}}]);
  else
    setPrompt(`Place your ${d.name}${defId==="ward"?" (face down)":""} — glowing cells connect. Press R to rotate.`, btns);
  renderAll(); renderHandArea();
}
function rotateSel(){
  if(!sel || sel.defId==="boulder") return;
  sel.rot=(sel.rot+1)%4;
  renderAll(); renderHandArea();
}
document.addEventListener("keydown",e=>{
  if(e.key==="r"||e.key==="R") rotateSel();
  if(e.key==="Escape" && sel){ clearSelection(); if(G.active===MYSEAT) startIdlePrompt(); }
});
async function humanPlaceAt(x,y){
  const p=G.players[MYSEAT];
  const defId=sel.defId, rot=sel.rot, faceDown=sel.faceDown;
  const isBoulder = defId==="boulder";
  const targetP = isBoulder ? G.players[1-MYSEAT] : p;
  if(isBoulder){ if(!boulderCells(targetP).some(([cx,cy])=>cx===x&&cy===y)) return; }
  else if(!canPlaceAt(p, rotEdges(DEFS[defId].edges,rot), x, y)) return;
  if(NET.mode!=="local") netSend({a:{t:"place", handIdx:sel.handIndex, rot, x, y, fd:!!faceDown}});
  const takeoff=handCardTakeoff(sel.handIndex);
  G._playedIdx=sel.handIndex;
  p.hand.splice(sel.handIndex,1);
  G.playsLeft--;
  clearSelection(); // renders the board while the cell is still empty
  const tile=makeTile(defId,rot,faceDown);
  putTile(targetP,tile,x,y);
  await flyCard(takeoff.rect, targetP.i, x, y, takeoff.node);
  animatePop(targetP.i,x,y);
  log(isBoulder ? "You hurl a Boulder into the rival's grounds!" :
      `You lay a ${faceDown?"face-down tile":DEFS[defId].name}.`, "you");
  renderAll();
  p.placedCount=(p.placedCount||0)+1;
  if(!isBoulder) await checkBarracks(p,x,y);
  if(!faceDown && !isBoulder) await onEnterAbility(p,tile);
  if(isBoulder) await structureCheck();
  afterHumanPlay();
}

/* human picks one of their own tiles (e.g. a blink target) */
function humanPickOwnTile(elig, promptText){

function humanPickCell(cells, promptText){

               resolveCell:(xy)=>{G.mode="idle"; G.pending=null; setPrompt(""); res(xy);}};

      [{label:"Hold fire", cls:"ghost", fn:()=>G.pending.resolve(null)}]);

/* ---------- response windows ---------- */
function playerHasResponse(p, top){
  const wards=[...p.board.values()].filter(t=>t.faceDown && !t.bricked);
  const canWard = wards.length>0 && freeFires(p)>=1;
  const isAttackOnMe = top.kind==="attack" && top.target && top.target.p===p.i;
  const towers = p.hand.map((id,idx)=>({id,idx})).filter(c=>c.id==="watchtower");
  // a tower can only shelter tiles adjacent or diagonal to it: it must land
  // within one step of the declared target, on a legally-connected cell
  let towerSpots=[], targetTile=null;
  if(isAttackOnMe && towers.length){
    targetTile=[...p.board.values()].find(t=>t.uid===top.target.uid);
    if(targetTile){
      for(let rot=0;rot<4;rot++){
        for(const [x,y] of legalCells(p, rotEdges(DEFS.watchtower.edges,rot)))
          if(Math.abs(x-targetTile.x)<=1 && Math.abs(y-targetTile.y)<=1)
            towerSpots.push({x,y,rot});
      }
    }
  }
  const canTower = towerSpots.length>0;
  return {canWard, wards, canTower, towers, towerSpots, targetTile, isAttackOnMe};
}
function isTowerSpot(p, top, x, y, rot){
  const tgt=[...p.board.values()].find(t=>t.uid===top.target.uid);
  if(!tgt || Math.abs(x-tgt.x)>1 || Math.abs(y-tgt.y)>1) return false;
  return canPlaceAt(p, rotEdges(DEFS.watchtower.edges,rot), x, y);
}
/* the remote player is deciding whether to respond — both clients computed
   the same playerHasResponse, so we only wait when they truly have options */
async function remoteResponseWindow(top){
  const p=G.players[1-MYSEAT];
  const r=playerHasResponse(p,top);
  if(!r.canWard && !r.canTower) return false;
  if(top.target){ G.threatUid=top.target.uid; renderAll(); }
  setPrompt("The rival weighs a response...");
  const msg=await netAwaitChoice();
  G.threatUid=null; setPrompt(""); renderAll();
  if(!msg || msg.r==="pass") return false;
  if(msg.r==="ward"){ await flipWard(p, r.wards[0], top); return true; }
  if(msg.r==="tower"){
    p.hand.splice(msg.handIdx,1);
    const tile=makeTile("watchtower",msg.rot,false);
    putTile(p,tile,msg.x,msg.y);
    animatePop(p.i,msg.x,msg.y);
    top.target={p:p.i, uid:tile.uid};
    top.label+=" → Watchtower";
    log("The rival's Watchtower rises to intercept!","foe");
    renderAll(); renderStack();
    p.placedCount=(p.placedCount||0)+1;
    await checkBarracks(p,msg.x,msg.y);
    await checkWhispers(p);
    return true;
  }
  return false;
}
function humanResponseWindow(top){
  return new Promise(res=>{
    const p=G.players[MYSEAT];
    const r=playerHasResponse(p,top);
    if(!r.canWard && !r.canTower){ res(false); return; }
    G.mode="respond";
    document.getElementById("stack-panel").classList.add("hot");
    if(top.target){ G.threatUid=top.target.uid; renderAll(); }
    const btns=[];
    if(r.canWard) btns.push({label:"Flip Ward — counter it", cls:"arcane", fn:async()=>{
      finish();
      if(NET.mode!=="local") netSend({c:{r:"ward"}});
      await flipWard(p, r.wards[0], top);
      res(true);
    }});
    if(r.canTower) btns.push({label:"Watchtower — intercept", cls:"arcane", fn:()=>{
      finish();
      beginTowerPlacement(p, r.towers[0].idx, top).then(placed=>{
        if(!placed && NET.mode!=="local") netSend({c:{r:"pass"}});
        res(placed);
      });
    }});
    btns.push({label:"Let it resolve", cls:"ghost", fn:()=>{
      finish();
      if(NET.mode!=="local") netSend({c:{r:"pass"}});
      res(false);
    }});
    setPrompt(`Rival's ${top.label} is on the stack — respond?`, btns);
    function finish(){
      G.mode="idle"; G.threatUid=null;
      document.getElementById("stack-panel").classList.remove("hot");
      setPrompt(""); renderAll();
    }
  });
}
async function flipWard(p, ward, top){
  ward.faceDown=false; ward.spent=true;
  top.countered=true;
  const el=tileEl(p.i,ward.x,ward.y);
  if(el){ el.classList.remove("facedown"); el.classList.add("hit-flash"); }
  log(`${p.i===MYSEAT?"You flip":"The rival flips"} a Veiled Ward — ${top.label} is countered!`, who(p.i));
  renderAll();
  await sleep(500);
  await checkWhispers(p);
}
function beginTowerPlacement(p, handIdx, top){
  return new Promise(res=>{
    G.mode="place";
    if(top.target) G.threatUid=top.target.uid;
    sel={handIndex:handIdx, defId:"watchtower", rot:0, faceDown:false, reactionTop:top,
         reactionResolve:res};
    setPrompt("Place the Watchtower beside the threatened tile (R to rotate) — it only shelters its 8 neighbors.",
      [{label:"Rotate (R)", cls:"", fn:()=>rotateSel()},
       {label:"Never mind", cls:"ghost", fn:()=>{G.threatUid=null; clearSelection(); res(false);}}]);
    renderAll();
  });
}
async function placeReactionTower(x,y){
  const p=G.players[MYSEAT];
  const top=sel.reactionTop, resolveFn=sel.reactionResolve;
  if(!isTowerSpot(p, top, x, y, sel.rot)){ return; }
  const takeoff=handCardTakeoff(sel.handIndex);
  const rot=sel.rot;
  if(NET.mode!=="local") netSend({c:{r:"tower", handIdx:sel.handIndex, x, y, rot}});
  G._playedIdx=sel.handIndex;
  p.hand.splice(sel.handIndex,1);
  G.threatUid=null;
  clearSelection(); // renders the board while the cell is still empty
  const tile=makeTile("watchtower",rot,false);
  putTile(p,tile,x,y);
  await flyCard(takeoff.rect, p.i, x, y, takeoff.node);
  animatePop(p.i,x,y);
  top.target={p:p.i, uid:tile.uid};
  top.label+=" → Watchtower";
  log("Your Watchtower rises to take the blow!","you");
  renderAll(); renderStack();
  p.placedCount=(p.placedCount||0)+1;
  await checkBarracks(p,x,y);
  await checkWhispers(p);
  resolveFn(true);
}
/* =====================================================
   Rendering
===================================================== */
function tileEl(pi,x,y){
  return document.querySelector(`#board-${V(pi)} .cell[data-x="${x}"][data-y="${y}"] .tile`);
}
function cellEl(pi,x,y){
  return document.querySelector(`#board-${V(pi)} .cell[data-x="${x}"][data-y="${y}"]`);
}
function buildBoards(){
  for(let i=0;i<2;i++){
    const b=document.getElementById("board-"+i);
    b.style.gridTemplateColumns=`repeat(${W}, var(--tile-size))`;
    b.innerHTML="";
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const c=document.createElement("div");
      c.className="cell"; c.dataset.x=x; c.dataset.y=y;
      c.addEventListener("click",()=>onCellClick(S(i),x,y));
      b.appendChild(c);
    }
  }
}
function edgeMarkup(edges, hideAll){
  const names=["n","e","s","w"];
  return names.map((n,i)=>`<div class="edge ${n} ${hideAll?"sealed":(edges[i]?"open":"sealed")}"></div>`).join("");
}
function renderBoard(pi){
  const p=G.players[pi];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=cellEl(pi,x,y);
    const t=p.board.get(key(x,y));
    c.classList.remove("placeable","targetable");
    const existing=c.querySelector(".tile");
    if(!t){ if(existing) existing.remove(); markInteractiveCell(pi,x,y,c); continue; }
    const d=DEFS[t.defId];
    const hideInfo = t.faceDown && pi!==MYSEAT; // enemy face-down: hidden
    const showFaceDown = t.faceDown;
    let cls="tile";
    if(t.defId==="hearth") cls+=" hearth-tile";
    if(t.defId==="brazier") cls+=" brazier-tile";
    if(t.defId==="bonfire") cls+=" brazier-tile bonfire-tile";
    if(t.defId==="thief" && !t.bricked) cls+=" thief-lit";
    if(t.defId==="boulder") cls+=" boulder-tile";
    if(showFaceDown) cls+=" facedown";
    if(t.dormant&&!showFaceDown) cls+=" dormant";
    if(t.bricked) cls+=" bricked";
    if(pi===1-MYSEAT && isEnemyTargetableNow(t)) cls+=" enemy-targetable";
    if(pi===MYSEAT && G.mode==="demolish" && t.defId!=="hearth") cls+=" selectable-own";
    if(pi===MYSEAT && G.mode==="target" && G.pending && G.pending.ownUids && G.pending.ownUids.has(t.uid)) cls+=" selectable-own";
    if(G.threatUid && t.uid===G.threatUid) cls+=" threatened";
    const glyph = showFaceDown ? ICONS.veil : icon(t.defId);
    const hp = (!showFaceDown && (d.hp>1||t.hp>1) && t.defId!=="hearth") ? `<span class="hp-badge">${t.hp}</span>` : "";
    const fire = (!showFaceDown && t.claims>0 && !t.dormant && !t.bricked) ? `<span class="fire-badge">${ICONS.flame.repeat(t.claims)}</span>` : "";
    const html=`${edgeMarkup(t.edges, showFaceDown&&pi!==MYSEAT)}<span class="glyph">${glyph}</span>${hp}${fire}`;
    if(existing){
      existing.className=cls+(existing.classList.contains("pop")?" pop":"");
      existing.innerHTML=html;
      existing.dataset.uid=t.uid;
    }else{
      const el=document.createElement("div");
      el.className=cls; el.innerHTML=html; el.dataset.uid=t.uid;
      c.appendChild(el);
    }
    const el=c.querySelector(".tile");
    el.onmouseenter=(e)=>showTooltip(e, t, pi);
    el.onmouseleave=hideTooltip;
    el.onmousemove=(e)=>moveTooltip(e);
  }
}
function markInteractiveCell(pi,x,y,c){
  if(G.mode==="target" && G.pending && G.pending.moveCells){
    if(pi===MYSEAT && G.pending.moveCells.has(key(x,y))) c.classList.add("placeable");
    return;
  }
  if(G.mode!=="place"||!sel) return;
  if(sel.reactionTop){
    if(pi===MYSEAT && isTowerSpot(G.players[MYSEAT], sel.reactionTop, x, y, sel.rot)) c.classList.add("placeable");
    return;
  }
  const isBoulder=sel.defId==="boulder";
  if(isBoulder){
    if(pi===1-MYSEAT && boulderCells(G.players[1-MYSEAT]).some(([cx,cy])=>cx===x&&cy===y)) c.classList.add("placeable");
  }else{
    if(pi===MYSEAT && canPlaceAt(G.players[MYSEAT], rotEdges(DEFS[sel.defId].edges, sel.rot), x, y)) c.classList.add("placeable");
  }
}
function isEnemyTargetableNow(t){
  if(G.mode!=="target"||!G.pending||G.pending.ownUids) return false;
  if(G.pending.isBrick && t.defId==="hearth") return false;
  if(t.faceDown) return true; // you may strike unknown tiles
  return true;
}
function onCellClick(pi,x,y){
  if(G.over) return;
  const p=G.players[pi];
  const t=p.board.get(key(x,y));
  if(G.mode==="place" && sel){
    if(sel.reactionResolve){ if(pi===MYSEAT) placeReactionTower(x,y); return; }
    if(sel.defId==="boulder"){ if(pi===1-MYSEAT) humanPlaceAt(x,y); return; }
    if(pi===MYSEAT) humanPlaceAt(x,y);
    return;
  }
  if(G.mode==="target" && G.pending && G.pending.moveCells){
    if(pi===MYSEAT && !t && G.pending.moveCells.has(key(x,y))) G.pending.resolveCell([x,y]);
    return;
  }
  if(G.mode==="target" && G.pending && G.pending.ownUids){
    if(pi===MYSEAT && t && G.pending.ownUids.has(t.uid)) G.pending.resolve(t);
    return;
  }
  if(G.mode==="target" && G.pending && pi===G.pending.enemyIdx && t){
    if(G.pending.isBrick && t.defId==="hearth") return;
    G.pending.resolve(t);
    return;
  }
  if(G.mode==="demolish" && pi===MYSEAT && t && t.defId!=="hearth"){
    doDemolish(t);
    return;
  }
}

/* header meters */
function renderMeters(){
  for(let i=0;i<2;i++){
    const p=G.players[i];
    // flame niches: reconciled in place so the gutter-out animation can play
    const fl=document.getElementById("flames-"+V(i));
    while(fl.children.length<3){
      const d=document.createElement("div");
      d.className="flame-pip";
      fl.appendChild(d);
    }
    [...fl.children].forEach((d,k)=>{
      const lit=k<p.flames;
      if(!lit && d.dataset.was==="lit"){
        d.classList.add("snuff");
        setTimeout(()=>d.classList.remove("snuff"), 3800);
      }
      d.classList.toggle("out", !lit);
      d.dataset.was = lit?"lit":"out";
    });
    // fire sockets: reconciled in place (never rebuilt) so the punch-through
    // and kindle animations survive re-renders
    const total=fireSources(p), free=freeFires(p);
    const fm=document.getElementById("fires-"+V(i));
    if(!fm.dataset.built){
      fm.dataset.built="1";
      fm.innerHTML=`fires&nbsp;<span class="fire-sockets"></span><span class="fire-free" style="opacity:.7"></span>`;
    }
    const sock=fm.querySelector(".fire-sockets");
    const prev=G._fireTotals ? G._fireTotals[i] : total;
    while(sock.children.length>total) sock.lastChild.remove();
    while(sock.children.length<total){
      const d=document.createElement("span");
      d.className="fire-dot";
      if(sock.children.length>=prev){
        d.classList.add("punch");
        setTimeout(()=>d.classList.remove("punch"), 900);
      }
      sock.appendChild(d);
    }
    [...sock.children].forEach((d,k)=>{
      const claimed=k>=free;
      if(claimed && d.dataset.was==="free"){
        d.classList.remove("ignite");
        d.classList.add("snuff");
        setTimeout(()=>d.classList.remove("snuff"), 3100);
      }
      if(!claimed && d.dataset.was==="claimed"){
        d.classList.remove("snuff");
        d.classList.add("ignite");
        setTimeout(()=>d.classList.remove("ignite"), 750);
      }
      d.classList.toggle("claimed", claimed);
      d.dataset.was = claimed?"claimed":"free";
    });
    fm.querySelector(".fire-free").textContent=`${free}/${total} free`;
    G._fireTotals=G._fireTotals||[2,2];
    G._fireTotals[i]=total;
  }
  // rival hand pips: reconciled so additions glide in instead of jolting
  document.getElementById("grave-count").textContent=G.players[MYSEAT].grave.length+" fallen";
  const hn=G.players[1-MYSEAT].hand.length;
  const hm=document.getElementById("hand-meter-1");
  if(!hm.dataset.built){
    hm.dataset.built="1";
    hm.innerHTML='<span class="hand-pips"></span><span class="hand-count"></span>';
  }
  const pips=hm.querySelector(".hand-pips");
  const want=Math.min(hn,14);
  while(pips.children.length>want) pips.lastChild.remove();
  while(pips.children.length<want){
    const d=document.createElement("span");
    d.className="hand-pip pip-in";
    setTimeout(()=>d.classList.remove("pip-in"), 350);
    pips.appendChild(d);
  }
  hm.querySelector(".hand-count").textContent=hn;
  document.getElementById("deck-count").textContent=G.players[MYSEAT].deck.length+" tiles";
}

/* fan the cards: overlapping when crowded, arcing like a held hand */
function layoutHand(){
  const h=document.getElementById("hand");
  if(!h.getBoundingClientRect) return;
  const cards=[...h.children].filter(c=>c.classList&&c.classList.contains("card"));
  const n=cards.length;
  let spacer=h.querySelector(".hand-spacer");
  if(!spacer){ spacer=document.createElement("div"); spacer.className="hand-spacer"; h.appendChild(spacer); }
  if(!n){ spacer.style.width="0px"; return; }
  const cw=108, minPeek=32;
  const avail=Math.max(0,(h.clientWidth||600)-cw-16);
  const spread = n<=1 ? 0 : Math.min(cw+10, Math.max(minPeek, avail/(n-1)));
  const total=cw+spread*(n-1);
  const left0 = total+16>(h.clientWidth||600) ? 8 : (h.clientWidth-total)/2;
  const mid=(n-1)/2;
  const tilt=Math.min(2.2, 9/Math.max(n,1));
  cards.forEach((c,i)=>{
    c.style.left=(left0+i*spread)+"px";
    c.style.setProperty("--fr", ((i-mid)*tilt)+"deg");
    c.style.setProperty("--fy", (Math.pow(Math.abs(i-mid),1.6)*1.5)+"px");
    c.style.zIndex=i+1;
  });
  spacer.style.width=(left0+total+8)+"px";
}
function renderHandArea(){
  const p=G.players[MYSEAT];
  const h=document.getElementById("hand");
  let cards=[...h.children].filter(c=>c.classList&&c.classList.contains("card"));
  // a played card leaves; the rest glide into their new places
  if(G._playedIdx!=null && cards.length===p.hand.length+1){
    const gone=cards[G._playedIdx];
    if(gone) gone.remove();
    cards.splice(G._playedIdx,1);
  }
  G._playedIdx=null;
  if(cards.length>p.hand.length){ // fell out of sync: rebuild
    cards.forEach(c=>c.remove()); cards=[];
  }
  while(cards.length<p.hand.length){ // fresh from the deck
    const card=document.createElement("div");
    card.className="card drawn";
    h.appendChild(card); cards.push(card);
    setTimeout(()=>card.classList.remove("drawn"), 520);
  }
  cards.forEach((card,idx)=>{
    const id=p.hand[idx], d=DEFS[id];
    let cls="card";
    if(sel&&sel.handIndex===idx&&G.mode==="place") cls+=" selected";
    if(G.active===MYSEAT&&G.playsLeft<1&&G.mode!=="discard") cls+=" unplayable";
    if(d.reaction) cls+=" reaction-glow";
    if(card.classList.contains("drawn")) cls+=" drawn";
    card.className=cls;
    const rot=(sel&&sel.handIndex===idx)?sel.rot:0;
    card.innerHTML=cardInnerHTML(id,rot);
    card.onclick=()=>selectCard(idx);
    const pseudo={defId:id, faceDown:false, dormant:false, bricked:false, spent:false, claims:0};
    card.onmouseenter=(e)=>showTooltip(e,pseudo,0);
    card.onmousemove=(e)=>moveTooltip(e);
    card.onmouseleave=hideTooltip;
  });
  layoutHand();
  renderMeters();
}

/* the tile breaks into a 3x3 grid of jagged fragments of its own face,
   which fly apart from where they sat, tumble, and fall */
/* a card sails from a hand and shrinks onto its cell */
function flyCard(fromRect, pi, x, y, cardNode){
  const cell=cellEl(pi,x,y);
  if(!cell||!fromRect) return Promise.resolve();
  const to=cell.getBoundingClientRect();
  const g=document.createElement("div");
  g.className="flycard"+(cardNode?"":" flyback");
  g.style.left=fromRect.left+"px"; g.style.top=fromRect.top+"px";
  g.style.width=fromRect.width+"px"; g.style.height=fromRect.height+"px";
  if(cardNode){
    cardNode.classList.remove("selected","drawn","unplayable");
    cardNode.style.animation="none";
    cardNode.style.left="0px";
    cardNode.style.setProperty("--fy","0px");
    cardNode.style.setProperty("--fr","0deg");
    g.appendChild(cardNode);
  }
  document.body.appendChild(g);
  const dx=to.left+to.width/2-(fromRect.left+fromRect.width/2);
  const dy=to.top+to.height/2-(fromRect.top+fromRect.height/2);
  const sc=Math.max(to.width/fromRect.width,.12);
  const at=f=>`translate(${dx*f}px,${dy*f}px) scale(${1+(sc-1)*f})`;
  // the card burns away mid-flight: brightens, blurs, and is gone by
  // the halfway point — shedding embers where it went
  g.animate(
    [{transform:at(0),   opacity:1,   filter:"blur(0px) brightness(1)"},
     {transform:at(.2),  opacity:.9,  filter:"blur(0.5px) brightness(1.25) sepia(.25)", offset:.22},
     {transform:at(.36), opacity:.55, filter:"blur(2px) brightness(1.7) sepia(.5)",     offset:.38},
     {transform:at(.5),  opacity:0,   filter:"blur(6px) brightness(2.2) sepia(.7)",     offset:.52},
     {transform:at(1),   opacity:0,   filter:"blur(6px) brightness(2.2)"}],
    {duration:480, easing:"cubic-bezier(.4,.1,.3,1)", fill:"forwards"});
  // ember motes drift off the dissolve point
  setTimeout(()=>{
    const px=fromRect.left+fromRect.width/2+dx*0.42;
    const py=fromRect.top+fromRect.height/2+dy*0.42;
    for(let i=0;i<6;i++){
      const m=document.createElement("div");
      m.className="mote";
      const sz=2+Math.random()*2.5;
      m.style.width=sz+"px"; m.style.height=sz+"px";
      m.style.left=(px+(Math.random()*36-18))+"px";
      m.style.top=(py+(Math.random()*26-13))+"px";
      document.body.appendChild(m);
      m.animate(
        [{transform:"translate(0,0)", opacity:.95},
         {transform:`translate(${Math.random()*24-12}px,${-(14+Math.random()*22)}px)`, opacity:0}],
        {duration:520+Math.random()*380, easing:"ease-out", fill:"forwards"});
      setTimeout(()=>m.remove(), 950);
    }
  }, 170);
  return new Promise(res=>setTimeout(()=>{g.remove(); res();}, 260));
}

function spawnShatter(pi,x,y,tile){
  const c=cellEl(pi,x,y); if(!c) return;
  const r=c.getBoundingClientRect();
  let light="#90938c", dark="#6d7069";
  if(tile){
    if(tile.faceDown){ light="#5b4a6b"; dark="#3a3046"; }
    else if(tile.defId==="boulder"){ light="#6f6a62"; dark="#403c34"; }
    else if(tile.defId==="brazier"){ light="#6e4218"; dark="#3a2d1e"; }
  }
  // fracture: cracks radiate from one interior break-point out to jittered
  // marks on the tile's edges, splitting the face into 3-4 large wedges
  const R=()=>Math.random();
  const C=[38+R()*24, 38+R()*24]; // the break-point
  const cycle=[
    {mark:true,  pt:[25+R()*50, 0]},   {pt:[100,0]},
    {mark:true,  pt:[100, 25+R()*50]}, {pt:[100,100]},
    {mark:true,  pt:[75-R()*50, 100]}, {pt:[0,100]},
    {mark:true,  pt:[0, 75-R()*50]},   {pt:[0,0]},
  ];
  if(R()<0.5){ // three pieces: one crack fewer
    const marks=cycle.filter(c=>c.mark);
    marks[Math.floor(R()*4)].mark=false;
  }
  const pieces=[];
  const startIdx=cycle.findIndex(c=>c.mark);
  let cur=null;
  for(let k=0;k<=cycle.length;k++){
    const node=cycle[(startIdx+k)%cycle.length];
    if(node.mark){
      if(cur){ cur.push(node.pt); pieces.push(cur); }
      if(k<cycle.length) cur=[node.pt];
    } else if(cur) cur.push(node.pt);
  }
  const src=tileEl(pi,x,y);
  const canClone = src && typeof src.cloneNode==="function";
  for(const poly of pieces){
    const s=document.createElement("div");
    s.className="shard";
    s.style.width=r.width+"px"; s.style.height=r.height+"px";
    s.style.left=r.left+"px"; s.style.top=r.top+"px";
    s.style.clipPath=`polygon(${[...poly, C].map(p=>p[0]+"% "+p[1]+"%").join(",")})`;
    if(canClone){
      // each wedge carries the tile's actual face — glyph, edges and all
      const clone=src.cloneNode(true);
      clone.classList.remove("pop","hit-flash","quake","selectable-own","enemy-targetable");
      clone.style.visibility="visible";
      s.appendChild(clone);
    }else{
      s.style.background=`linear-gradient(${150+Math.floor(R()*40-20)}deg, ${light}, ${dark})`;
    }
    document.body.appendChild(s);
    // the wedges settle straight into their cracked-open resting places —
    // slightly spread, tilted inward — sit broken a while, then dissolve
    const mx=poly.reduce((a,p)=>a+p[0],0)/poly.length - C[0];
    const my=poly.reduce((a,p)=>a+p[1],0)/poly.length - C[1];
    const len=Math.hypot(mx,my)||1;
    const dx=(mx/len)*(2+R()*2);
    const dy=(my/len)*(1.4+R()*1.4)+1;
    const rot=-(mx/len)*(4+R()*4);
    const b=0.88+R()*0.24; // broken faces catch the light unevenly
    const fb=`brightness(${b})`;
    const settled=`translate(${dx}px,${dy}px) rotate(${rot}deg)`;
    s.animate(
      [{transform:"none", opacity:1, filter:fb},
       {transform:settled, opacity:1, filter:fb, offset:.08},
       {transform:settled, opacity:1, filter:fb, offset:.74},
       {transform:`translate(${dx}px,${dy+1.5}px) rotate(${rot}deg)`, opacity:0, filter:`${fb} blur(2px)`}],
      {duration:1600+R()*200, easing:"ease-out", fill:"both"});
    setTimeout(()=>s.remove(), 2100);
  }
}

async function animateProjectile(fromP,fx,fy,toP,tx,ty){
  const a=cellEl(fromP,fx,fy), b=cellEl(toP,tx,ty);
  if(!a||!b) return;
  const r1=a.getBoundingClientRect(), r2=b.getBoundingClientRect();
  const pr=document.createElement("div"); pr.className="projectile";
  document.body.appendChild(pr);
  const x1=r1.left+r1.width/2, y1=r1.top+r1.height/2;
  const x2=r2.left+r2.width/2, y2=r2.top+r2.height/2;
  const dur=650, start=performance.now();
  await new Promise(done=>{
    function step(now){
      const t=Math.min(1,(now-start)/dur);
      const ease=t*t*(3-2*t);
      const x=x1+(x2-x1)*ease, y=y1+(y2-y1)*ease - Math.sin(t*Math.PI)*90;
      pr.style.left=(x-7)+"px"; pr.style.top=(y-7)+"px";
      pr.style.transform=`scale(${1+Math.sin(t*Math.PI)*.5})`;
      if(t<1) requestAnimationFrame(step); else done();
    }
    requestAnimationFrame(step);
  });
  pr.remove();
}
/* =====================================================
   The Rival Architect (AI)
===================================================== */
function tileValue(t, p){
  if(t.defId==="boulder") return -5;
  switch(t.defId){
    case "hearth": return 100 + (3-p.flames)*40;
    case "brazier": return 60;
    case "scriptorium": return 55;
    case "bulwark": return (Math.abs(t.x-CX)<=2&&Math.abs(t.y-CY)<=2)?45:25;
    case "thief": return 70; // it is stealing OUR fire
    case "outriders": case "wolfpack": case "stormaltar": return 68; // stop the raids
    case "coalcellar": return 62;
    case "bonfire": return 58;
    case "barracks": case "forge": case "whisper": case "tollgate": return 45;
    case "festival": case "ossuary": case "garden": return 40;
    case "burrows": return 42;
    case "wall": return 15;
    case "catapult": case "spire": case "trebuchet": case "bombard": case "ballista": case "rats":
      return 12; // destroying them frees their fire
    default: return 20;
  }
}
function aiPickTarget(enemyIdx, isBrick, dmg, aoe){
  const ep=G.players[enemyIdx];
  let best=null, bestV=-1;
  for(const t of ep.board.values()){
    if(t.defId==="boulder") continue;
    if(isBrick){
      if(t.defId==="hearth"||t.bricked||t.spent) continue;
      let v=0;
      if(t.defId==="brazier") v=70;
      else if(t.defId==="scriptorium") v=60;
      else if(t.defId==="bulwark") v=50;
      else if(t.faceDown) v=40;
      else v=8;
      if(v>bestV){bestV=v; best=t;}
    }else{
      let v=tileValue(t,ep);
      if(aoe){ // splash: add the neighbors' worth
        for(const [dx,dy] of DIRS){
          const n=ep.board.get(key(t.x+dx,t.y+dy));
          if(n&&n.defId!=="boulder") v+=tileValue(n,ep)*0.7;
        }
      }
      const bw=findBulwark(ep,t.x,t.y);
      if(bw&&bw.uid!==t.uid) v*=0.45; // shielded — blow gets absorbed
      if(v>bestV){bestV=v; best=t;}
    }
  }
  return best;
}
/* how juicy is blinking this neighbor? */
function echoValue(p,n){
  if(!n||n.defId==="hearth"||n.defId==="boulder"||n.faceDown||n.bricked) return 0;
  const need=DEFS[n.defId].needsFire||0;
  const refire=freeFires(p)+n.claims>=need;
  switch(n.defId){
    case "hallway": return 25;
    case "gatehouse": return 20;
    case "reliquary": return 30;
    case "courtyard": return Math.min(3,countCourtyards(p))*20;
    case "serpent": return hasTwoByTwo(p)?0:25;
    case "catapult": case "spire": case "witch": case "rats": return refire?40:2;
    case "trebuchet": return refire?Math.min(3,lineFromOpenEdge(p,n.x,n.y,n.edges))*13:2;
    case "bombard": return refire?45:2;
    case "ballista": return refire?Math.max(1,Math.floor(castleSpan(p)/3))*14:2;
    case "wall": return n.hp<2?12:0;
    case "keystone": return fullySurrounded(p,n.x,n.y)?35:0;
    case "mirror": return mirrorSymmetric(p)?38:0;
    case "aqueduct": return Math.floor(longestRun(p)/3)*15;
    case "guild": return 15;
    default: return 4;
  }
}
function aiPickEcho(p,elig){

const GRAVE_VAL={bombard:9,ballista:8,witch:8,trebuchet:8,bonfire:8,brazier:7,spire:7,
  earthquake:6,catapult:6,reliquary:6,scriptorium:5,necropolis:5,hallway:5,gatehouse:5,caravan:5};
function aiPickGrave(p){
  if(!p.grave.length) return null;
  let best=p.grave[0], bv=-1;
  for(const id of p.grave){ const v=GRAVE_VAL[id]||3; if(v>bv){bv=v; best=id;} }
  return best;
}
/* pyre: burn spent engines first, never a load-bearing stone */
function aiPickPyre(p,own){
  let best=null, bv=-1;
  for(const t of own){
    let v=1;
    if(t.claims>0 && !DEFS[t.defId].persistent) v=8+t.claims;
    else if(t.spent) v=7;
    else if(t.defId==="wall") v=4;
    else if(t.defId==="hallway"||t.defId==="gatehouse") v=5;
    if(connectionCount(p,t)>1) v-=4;
    if(v>bv){bv=v; best=t;}
  }
  return bv>=4?best:null;
}
/* masons: try moves that stretch the span, break a 2x2, or close a courtyard */
function aiPickGuildMove(p,elig){
  const baseSpan=castleSpan(p), baseCourt=countCourtyards(p), baseBlock=hasTwoByTwo(p);
  let best=null,bestGain=4;
  for(const t of elig){
    p.board.delete(key(t.x,t.y));
    const cells=legalCells(p,t.edges);
    for(const [cx,cy] of cells){
      if(cx===t.x&&cy===t.y) continue;
      const ox=t.x, oy=t.y;
      t.x=cx; t.y=cy; p.board.set(key(cx,cy),t);
      const conn=connectedSet(p);
      let severed=0;
      for(const q of p.board.values()) if(q.defId!=="boulder"&&!conn.has(key(q.x,q.y))) severed++;
      let gain = severed>0 ? -99 :
        (castleSpan(p)-baseSpan)*8 + (countCourtyards(p)-baseCourt)*18 + ((baseBlock&&!hasTwoByTwo(p))?16:0);
      p.board.delete(key(cx,cy));
      t.x=ox; t.y=oy;
      if(gain>bestGain){ bestGain=gain; best={tile:t, dest:[cx,cy]}; }
    }
    p.board.set(key(t.x,t.y),t);
  }
  return best;
}
function aiBestPlacement(p, defId){
  const d=DEFS[defId];
  let best=null, bestScore=-Infinity;
  for(let rot=0;rot<4;rot++){
    const edges=rotEdges(d.edges,rot);
    for(const [x,y] of legalCells(p,edges)){
      let s=Math.random()*2;
      const dist=distFromHearth(p,x,y);
      if(defId==="spire") s+= dist>=4?25:0;
      else if(defId==="trebuchet") s+= Math.min(3, lineFromOpenEdge(p,x,y,edges))*9;
      else if(defId==="echo"){
        let ev=0;
        DIRS.forEach(([dx,dy])=>{ ev=Math.max(ev, echoValue(p, p.board.get(key(x+dx,y+dy)))); });
        s+=ev;
      }
      else if(defId==="keystone"){
        let nb=0; DIRS.forEach(([dx,dy])=>{ const t=p.board.get(key(x+dx,y+dy)); if(t&&t.defId!=="boulder") nb++; });
        s+= nb===4?42:nb*2;
      }
      else if(defId==="mirror"||defId==="aqueduct"){
        const t={...makeTile(defId,rot),x,y,owner:p.i};
        p.board.set(key(x,y),t);
        if(defId==="mirror") s+= mirrorSymmetric(p)?45:0;
        else s+= Math.floor(longestRun(p)/3)*13;
        p.board.delete(key(x,y));
      }
      else if(defId==="garden") s+= countCourtyards(p)*14 + (4-dist);
      else if(defId==="cornerstone") s+= ((x===0||x===W-1)&&(y===0||y===H-1))?46:0;
      else if(defId==="milestone"){
        const t={...makeTile(defId,rot),x,y,owner:p.i};
        p.board.set(key(x,y),t);
        let run=1;
        for(const [dx,dy] of [[1,0],[0,1]]){
          let n=1;
          for(const sgn of [-1,1]){
            let cx=x+dx*sgn, cy=y+dy*sgn;
            while(inBounds(cx,cy)){ const q=p.board.get(key(cx,cy)); if(!q||q.defId==="boulder")break; n++; cx+=dx*sgn; cy+=dy*sgn; }
          }
          run=Math.max(run,n);
        }
        p.board.delete(key(x,y));
        s+= run>=3?14:0;
      }
      else if(defId==="cloisterwalk"){
        const before=countCourtyards(p);
        const t={...makeTile(defId,rot),x,y,owner:p.i};
        p.board.set(key(x,y),t);
        s+= countCourtyards(p)>before?36:0;
        p.board.delete(key(x,y));
      }
      else if(defId==="spiral") s+= Math.floor(countElbows(p)/2)*10;
      else if(defId==="barracks"||defId==="festival") s+= 5-Math.abs(dist-2);
      else if(defId==="bulwark") s+= (Math.abs(x-CX)<=1&&Math.abs(y-CY)<=1)?18:-dist;
      else if(defId==="brazier"||defId==="scriptorium") s+= 6-dist;
      else if(defId==="serpent"){
        p.board.set(key(x,y),{...makeTile(defId,rot),x,y,owner:p.i});
        if(!hasTwoByTwo(p)) s+=25;
        p.board.delete(key(x,y));
      }
      else if(defId==="courtyard"){
        const t={...makeTile(defId,rot),x,y,owner:p.i};
        p.board.set(key(x,y),t);
        s+=countCourtyards(p)*30;
        p.board.delete(key(x,y));
      }
      else s+= 4-Math.abs(dist-2); // gentle sprawl
      // openness: keep future frontier
      s+=edges.filter(Boolean).length*1.5;
      if(s>bestScore){bestScore=s; best={x,y,rot,score:s};}
    }
  }
  return best;
}
function aiBoulderCell(){
  const hp=G.players[0]; // human board
  let best=null, bestV=-1;
  for(const [x,y] of boulderCells(hp)){
    let v=0;
    DIRS.forEach(([dx,dy],dir)=>{
      const n=hp.board.get(key(x+dx,y+dy));
      if(n){ v+=2; if(n.edges[OPP[dir]]) v+=3; if(n.defId==="hearth") v+=6; }
    });
    if(v>bestV){bestV=v; best=[x,y];}
  }
  return best;
}
function aiChooseMove(p, wantAll){
  const options=[];
  p.hand.forEach((id,idx)=>{
    const d=DEFS[id];
    let score=0, place=null;
    if(id==="boulder"){
      place=aiBoulderCell();
      score=place?36:-99;
    }else{
      place=aiBestPlacement(p,id);
      if(!place){ options.push({idx,id,score:-99}); return; }
      const ff=freeFires(p);
      switch(id){
        case "catapult": score= ff>=1?82:6; break;
        case "spire": score= ff>=1?(place.score>20?85:72):6; break;
        case "trebuchet": score= ff>=1?(place.score>18?88:50):6; break;
        case "bombard": score= ff>=2?86:5; break;
        case "ballista": score= ff>=1?(44+castleSpan(p)*5):6; break;
        case "witch": score= ff>=1&&aiPickTarget(0,true)?70:5; break;
        case "brazier": score= ff<=0?88: (fireSources(p)<3?46:24); break;
        case "scriptorium": score= ff>=2?60:8; break;
        case "hallway": score=58; break;
        case "serpent": score= place.score>20?54:14; break;
        case "courtyard": score= 12+ (place.score>25?38:0); break;
        case "bulwark": score= [...p.board.values()].some(t=>t.defId==="bulwark"&&!t.bricked)?18:48; break;
        case "wall": score=22; break;
        case "ward": score= fireSources(p)>=2?34:14; break;
        case "watchtower": score=8; break; // hold as a reaction
        case "gatehouse": score=48; break;
        case "reliquary": score=58; break;
        case "thief": score= freeFires(G.players[0])>0?55:16; break;
        case "rats": score= ff>=1&&G.players[0].hand.length>0?64:5; break;
        case "echo": score= place.score>18?38+place.score:8; break;
        case "keystone": score= place.score>35?72:18; break;
        case "mirror": score= place.score>38?70:14; break;
        case "aqueduct": score= place.score>18?30+place.score:20; break;
        case "garden": score= ff>=1?(countCourtyards(p)>0?62:24):8; break;
        case "guild": score=24; break;
        case "tollgate": score= ff>=1?40:10; break;
        case "forge": score= ff>=1?46:8; break;
        case "barracks": score= ff>=1?52:10; break;
        case "festival": score=30; break;
        case "ossuary": score= ff>=1?(G.players[0].grave.length+G.players[1].grave.length>0?48:34):8; break;
        case "whisper": score= ff>=1&&p.hand.some(id2=>id2==="ward"||id2==="watchtower")?46:14; break;
        case "outriders": score= ff>=1?66:8; break;
        case "wolfpack": score= ff>=1?([...G.players[0].board.values()].some(t=>isLeaf(G.players[0],t))?64:32):8; break;
        case "stormaltar": score= ff>=2?60:6; break;
        case "necropolis": score= ff>=1&&(G.players[0].grave.length+G.players[1].grave.length)>=8?70:6; break;
        case "mastermason": score= p.grave.length?46:4; break;
        case "haunt": score= p.grave.length?(38+(GRAVE_VAL[aiPickGrave(p)]||3)*3):4; break;
        case "pyre": score= [...p.board.values()].some(t=>t.claims>0&&!DEFS[t.defId].persistent)?58:20; break;
        case "spiral": score= 24+place.score; break;
        case "twingates": score= touchesOppositeEdges(p)?76:8; break;
        case "cornerstone": score= place.score>40?70:10; break;
        case "milestone": score= 38+(place.score>10?12:0); break;
        case "cloisterwalk": score= place.score>30?66:22; break;
        case "burrows": score= ff>=1?([...p.board.values()].filter(t=>isLeaf(p,t)).length>=2?52:20):8; break;
        case "bonfire": score= ff<=0?80:(fireSources(p)<3?42:22); break;
        case "coalcellar": score= ff>=2&&[...p.board.values()].some(t=>t.claims>0&&!DEFS[t.defId].persistent)?56:10; break;
        case "earthquake": {
          const el0=[...G.players[0].board.values()].filter(t=>isLeaf(G.players[0],t)).length;
          const el1=[...p.board.values()].filter(t=>isLeaf(p,t)).length;
          score= ff>=1&&el0-el1>=2?68:(ff>=1?12:5); break;
        }
        case "caravan": score=46; break;
      }
    }
    if(G.aiBias && G.aiBias[id]) score*=G.aiBias[id];
    options.push({idx,id,score,place});
  });
  options.sort((a,b)=>b.score-a.score);
  if(wantAll) return options;
  return options[0]&&options[0].score>0?options[0]:null;
}
function aiWorstCardIdx(p){
  const opts=aiChooseMove(p,true);
  if(!opts.length) return p.hand.length-1;
  // never shed the sword arm: one-shot damage cards are held even when
  // fire-starved (their low score means "not yet", not "worthless")
  const THREATS=["catapult","spire","trebuchet","bombard","ballista","necropolis","earthquake","witch",
                 "outriders","wolfpack","stormaltar"];
  const keepable=opts.filter(o=>!THREATS.includes(o.id));
  return (keepable.length?keepable:opts)[ (keepable.length?keepable:opts).length-1 ].idx;
}
async function aiTurn(){
  const p=G.players[1];
  await sleep(900);
  while(G.playsLeft>0 && !G.over){
    const mv=aiChooseMove(p);
    // starved for fire with siege in hand: dismantle a spent engine (they are
    // all single-edge leaves, so this never severs the castle behind them)
    const SPENT=["catapult","spire","trebuchet","bombard","ballista","witch"];
    if((!mv||mv.score<20) && freeFires(p)===0 && p.hand.length>1 &&
       p.hand.some(id=>DEFS[id].needsFire) ){
      const engine=[...p.board.values()].find(t=>SPENT.includes(t.defId)&&t.claims>0)
        // starving with no spent shot to reclaim: sacrifice a passive engine
        ||[...p.board.values()].find(t=>t.claims>0&&DEFS[t.defId].persistent&&
            !["outriders","wolfpack","stormaltar"].includes(t.defId));
      if(engine){
        G.playsLeft--;
        await discardFromHand(p, aiWorstCardIdx(p));
        log("The rival pays the masons and dismantles a spent engine, freeing its fire.","foe");
        await destroyTile(p,engine,true);
        await structureCheck();
        if(G.over) return;
        await sleep(700);
        continue;
      }
    }
    if(!mv){
      // frontier sealed: no legal placement anywhere — tear down a
      // dead-end (never a fire source) to reopen ground
      if(legalCells(p, DEFS.wall.edges).length===0 && p.hand.length>0){
        const cand=[...p.board.values()].filter(t=>
          t.defId!=="hearth" && !DEFS[t.defId].fires);
        const leaf=cand.find(t=>t.defId!=="thief" && t.edges.filter(Boolean).length<=1)
                 ||cand.find(t=>t.defId!=="thief")||cand[0];
        if(leaf){
          G.playsLeft--;
          await discardFromHand(p, aiWorstCardIdx(p));
          log("The rival pays the masons and tears down a blocked wing to open new ground.","foe");
          await destroyTile(p,leaf,true);
          await structureCheck();
          if(G.over) return;
          await sleep(700);
          continue;
        }
      }
      break;
    }
    p.hand.splice(mv.idx,1);
    G.playsLeft--;
    if(mv.id==="boulder"){
      const [x,y]=mv.place;
      const tile=makeTile("boulder");
      putTile(G.players[0],tile,x,y);
      await flyCard(rivalHandRect(), 0, x, y, null);
      animatePop(0,x,y);
      log("The rival hurls a Boulder into your grounds!","foe");
      renderAll();
      p.placedCount=(p.placedCount||0)+1;
      await structureCheck();
    }else{
      const tile=makeTile(mv.id, mv.place.rot, mv.id==="ward");
      putTile(p,tile,mv.place.x,mv.place.y);
      await flyCard(rivalHandRect(), 1, mv.place.x, mv.place.y, null);
      animatePop(1,mv.place.x,mv.place.y);
      log(mv.id==="ward"?"The rival lays a tile face down...":`The rival builds a ${DEFS[mv.id].name}.`,"foe");
      renderAll();
      p.placedCount=(p.placedCount||0)+1;
      await checkBarracks(p,mv.place.x,mv.place.y);
      await sleep(650);
      if(mv.id!=="ward") await onEnterAbility(p,tile);
    }
    if(G.over) return;
    await sleep(800);
  }
  await structureCheck();
  if(G.over) return;
  while(p.hand.length>HAND_LIMIT){
    await discardFromHand(p, aiWorstCardIdx(p));
    log("The rival sheds a tile from an overfull hand.","foe");
  }
  setPrompt("");
  await sleep(400);
  startTurn(0);
}
/* AI deciding whether to respond to the human's stack item */
async function aiResponseWindow(top){
  const p=G.players[1];
  if(top.countered) return false;
  const r=playerHasResponse(p,top);
  // what is threatened?
  let threat=0, targetTile=null;
  if(top.target && top.target.p===1){
    targetTile=[...p.board.values()].find(t=>t.uid===top.target.uid);
    if(targetTile) threat=tileValue(targetTile,p);
  } else if(top.kind==="ability") threat=45;
  if(r.canWard && threat>=55){
    await sleep(700);
    await flipWard(p, r.wards[0], top);
    return true;
  }
  if(r.canTower && targetTile && threat>=60){
    const spot=r.towerSpots[0];
    if(spot){
      await sleep(700);
      const c=r.towers[0];
      p.hand.splice(c.idx,1);
      const tile=makeTile("watchtower",spot.rot,false);
      putTile(p,tile,spot.x,spot.y);
      animatePop(1,spot.x,spot.y);
      top.target={p:1, uid:tile.uid};
      top.label+=" → Watchtower";
      log("The rival's Watchtower rises to intercept your attack!","foe");
      renderAll(); renderStack();
      p.placedCount=(p.placedCount||0)+1;
      await checkBarracks(p,spot.x,spot.y);
      await checkWhispers(p);
      return true;
    }
  }
  return false;
}

function loadPeerJS(){
  return new Promise((res,rej)=>{
    if(typeof Peer!=="undefined") return res();
    const s=document.createElement("script");
    s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
    s.onload=()=>res();
    s.onerror=()=>rej(new Error("Could not load the connection library — online play needs internet."));
    document.head.appendChild(s);
  });
}
function genCode(){
  const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  return Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join("");
}
