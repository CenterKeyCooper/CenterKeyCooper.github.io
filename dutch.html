<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<title>dutch: split the bill</title>
<meta name="description" content="Snap the receipt, tap who had what, and send everyone a link to pay you back on Venmo.">
<meta property="og:type" content="website">

<meta property="og:description" content="Snap the receipt, tap who had what, and send everyone a link to pay you back on Venmo.">
<meta property="og:image" content="https://cooperwilk.com/dutch.png">
<meta property="og:image:width" content="900">
<meta property="og:image:height" content="900">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23161a20'/%3E%3Cpath d='M16 2v28' stroke='%23ffd23f' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f7; --surface:#ffffff; --ink:#161a20; --muted:#667080; --line:#e0e3e8; --soft:#eceef1;
  --hi:#ffd23f; --hi-ink:#161a20; --ok:#1d7a44; --bad:#c42f2f;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#101215; --surface:#181b20; --ink:#eef0f3; --muted:#8b93a0; --line:#282c33; --soft:#20242a; --ok:#5bc489; --bad:#ff7a73; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;font:17px/1.45 var(--body);color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(140px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font:800 24px/1 var(--display);letter-spacing:-.04em}
.brand svg{display:block}
.prog{display:flex;gap:6px;margin:18px 0 0}
.prog button{flex:1;height:22px;background:none;border:0;padding:0;position:relative}
.prog button::before{content:"";position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--line)}
.prog button.done::before{background:var(--ink)}
.prog button.cur::before{background:var(--hi);box-shadow:inset 0 0 0 1.5px var(--ink)}
.prog button:disabled{cursor:default}

/* type */
h1{font:700 clamp(34px,10vw,44px)/1.02 var(--display);letter-spacing:-.035em;margin:26px 0 10px}
h2{font:700 20px/1.2 var(--display);letter-spacing:-.02em;margin:34px 0 6px}
.lede{color:var(--muted);margin:0 0 24px;max-width:34ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
.step.enter{animation:in .3s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border:0;border-radius:999px;font-weight:700;font-size:17px;background:var(--soft);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--hi);color:var(--hi-ink);flex:1;box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.primary:disabled{background:var(--soft);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.round{width:52px;padding:0}
.btn.sm{min-height:44px;padding:0 18px;font-size:16px}
.btn.pay{background:var(--hi);color:var(--hi-ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.wide{width:100%}
.link{background:none;border:0;padding:10px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.addbtn{display:flex;align-items:center;gap:8px;width:100%;padding:14px 0;border:0;background:none;font-weight:600;color:var(--ink);text-align:left}
.addbtn svg{flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.hint{max-width:560px;margin:0 auto 10px;font-size:14px;color:var(--muted);text-align:center}

/* fields */
.field{width:100%;min-height:50px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
.field:focus{outline:none;border-color:var(--ink)}
.field.money{text-align:right}
.ghost-in{width:100%;min-width:0;min-height:48px;padding:0 2px;border:0;border-bottom:1.5px solid var(--line);border-radius:0;background:transparent;font-size:17px}
.ghost-in:focus{outline:none;border-bottom-color:var(--ink)}
.ghost-in.money{width:96px;flex:none;text-align:right}
.lbl{font-weight:600;margin:0 0 8px}

/* receipt step */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 24px;border:2px dashed var(--ink);border-radius:20px;text-align:center;cursor:pointer;background:var(--surface)}
.drop strong{font:700 20px var(--display);letter-spacing:-.02em}
.drop span{color:var(--muted);font-size:15px;max-width:28ch}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{display:grid;place-items:center;border:2px dashed var(--ink);cursor:pointer}
.thumb .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.note{margin:18px 0 0;padding:14px 16px;border-radius:10px;background:var(--soft);border-left:5px solid var(--ink)}
.note.ok{border-left-color:var(--ok)}
.note.err{border-left-color:var(--bad)}
.note.warn{border-left-color:var(--hi);background:color-mix(in srgb,var(--hi) 22%,var(--surface))}
.ind{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:12px}
.ind::after{content:"";display:block;height:100%;width:35%;background:var(--ink);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.keybox{margin-top:28px;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.keybox p{margin:0 0 12px}
.keybox .row{display:flex;gap:8px;margin-top:10px}
.keybox a{color:var(--ink)}

/* people */
.addrow{display:flex;gap:8px}
.addrow .btn{flex:none}
.recent{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.pill{border:1.5px solid var(--line);background:transparent;border-radius:999px;min-height:38px;padding:0 14px;font-weight:500}
.plist{list-style:none;margin:20px 0 0;padding:0}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 15px var(--display)}
.dot.lg{width:44px;height:44px;font-size:19px}
.pn{flex:1;min-width:0;font-weight:600;font-size:18px;overflow-wrap:anywhere}
.paid{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600;display:flex;align-items:center;gap:6px}
.paid.on{background:var(--hi);border-color:var(--ink);color:var(--hi-ink)}
.iconbtn{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}

/* items */
.peek{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pthumb{width:44px;height:58px;border-radius:8px;overflow:hidden;border:1.5px solid var(--line);padding:0;background:var(--surface)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.irow,.frow{display:flex;align-items:center;gap:8px}
.qty{flex:none;font-weight:700;font-size:14px;background:var(--soft);border-radius:6px;padding:2px 7px}
.iwrap{border-bottom:1px solid var(--line);padding:2px 0}
.iwrap .link{padding:0 0 10px}
.sign{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:20px;line-height:1}
.sign.neg{background:var(--ok);border-color:var(--ok);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;min-height:42px;padding:0 8px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tipnote{min-height:22px;margin:8px 0 0;color:var(--muted);font-size:14px}
.tot{margin:20px 0 0;border:1.5px solid var(--ink);border-radius:10px;background:var(--surface);padding:6px 16px}
.tot div{display:flex;justify-content:space-between;padding:8px 0}
.tot dt,.tot dd{margin:0}
.tot .grand{border-top:1.5px dashed var(--ink);margin-top:4px;padding-top:12px;font:700 22px var(--display);letter-spacing:-.02em}
.tot .minus dd{color:var(--ok)}
.line{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0}
.line .field{width:130px}

/* assign */
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:20px 0 8px}
.meter div{height:100%;background:var(--ink);border-radius:3px;transition:width .25s}
.arow{padding:16px 0 16px 14px;border-bottom:1px solid var(--line);box-shadow:inset 4px 0 0 var(--hi);margin-left:0}
.arow.done{box-shadow:none;padding-left:0}
.itop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.iname{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.price{font-weight:600;font-size:18px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:16px;transition:background .12s,border-color .12s}
.chip .dot{width:28px;height:28px;font-size:13px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.on .dot{background:rgba(255,255,255,.28)}
.chip.all{padding-left:14px;--c:var(--ink)}
.chip.all.on{color:var(--bg)}
.each{margin-top:10px;font-size:14px;color:var(--muted)}
.ptabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600;transition:background .12s}
.ptab.on{background:var(--c);border-color:var(--c);color:#fff}
.ptab small{font-size:13px;font-weight:700;opacity:.75}
.prow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;transition:background .12s}
.prow.on{background:color-mix(in srgb,var(--c) 13%,transparent)}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;color:#fff}
.prow.on .check{background:var(--c);border-color:var(--c)}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column}
.pmain .sub{font-size:14px;color:var(--muted)}
.ptotal{display:flex;justify-content:space-between;padding:18px 0 14px;font:700 20px var(--display);letter-spacing:-.02em}

/* results */
.splitbar{display:flex;gap:3px;height:16px;margin:0 0 8px}
.splitbar span{border-radius:8px;min-width:8px}
.owe{padding:20px 0;border-bottom:1px solid var(--line)}
.otop{display:flex;align-items:center;gap:14px}
.ow{flex:1;min-width:0}
.oname{font:700 20px var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.amt{font:800 32px/1 var(--display);letter-spacing:-.04em}
.oact{display:flex;gap:8px;margin-top:16px}
.oact .btn{flex:1}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:15px;padding:6px 0}
.breakdown{list-style:none;margin:6px 0 0;padding:0}
.breakdown li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:15px}
.payerline{padding:18px 0;color:var(--muted)}
.venmo{margin-top:12px}
.venmo .row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.at{font-weight:700;color:var(--muted)}

.keybox .seg{margin-bottom:0}
.models{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.who{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.owe.me{background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;padding:18px;margin:8px 0 6px}
.owe.me .amt{font-size:40px}
.subh{font:700 17px var(--display);letter-spacing:-.02em;margin:24px 0 0;color:var(--muted)}
.shared-top{display:flex;align-items:center;justify-content:space-between}

/* overlays */
.lb{position:fixed;inset:0;z-index:40;background:rgba(10,12,15,.92);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:56px 12px 24px}
.lb img{max-width:100%;height:auto;border-radius:6px;touch-action:pan-x pan-y pinch-zoom}
.lbx{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#161a20;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:50;white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar" class="bar"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const LS = { key:'dutch.key', model:'dutch.model', ckey:'dutch.key.claude', cmodel:'dutch.model.claude', provider:'dutch.provider', state:'dutch.state.v1', recent:'dutch.recent' };
const COLORS = ['#2f56e0','#d1307a','#1f8a4c','#d9581a','#0f7f86','#9a6b00','#7a3fb0','#4a5568'];
const STEPS = ['Receipt','People','Items','Assign','Split'];
const MOBILE = /iPhone|iPad|Android/i.test(navigator.userAgent);
// After you deploy the Cloudflare Worker, paste its address here (no trailing slash),
// for example 'https://dutch.yourname.workers.dev'. Leave it empty to share as plain text.
const SHARE_API = '';

/* ---------- storage ---------- */
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

/* ---------- state ---------- */
const fresh = () => ({
  step:0, people:[], payer:null, items:[], fees:[], tax:0,
  tip:{ mode:'pct', pct:20, flat:0, basis:'pre', fromReceipt:false },
  receipt:null, view:'item', activePerson:null, venmo:'', note:'Dinner', share:null
});
function load(){
  try {
    const s = JSON.parse(lsGet(LS.state) || 'null');
    if (s && typeof s === 'object') {
      const m = { ...fresh(), ...s, tip:{ ...fresh().tip, ...(s.tip || {}) } };
      if (m.step >= 2 && (m.people.length < 2 || !m.payer)) m.step = 1;
      if (m.step >= 3 && !m.items.length) m.step = 2;
      return m;
    }
  } catch {}
  return fresh();
}
let S = load();
const save = () => lsSet(LS.state, JSON.stringify(S));
const ui = { photos:[], scanning:false, error:'', keyEdit:false, lb:null, focus:null, sharing:false, shared:null };

/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const $bar = document.getElementById('bar');
const $toast = document.getElementById('toast');
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = c => { const neg = c < 0; c = Math.abs(c); return (neg ? '−$' : '$') + (c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const plain = c => (c/100).toFixed(2);
const parse = s => { s = String(s).replace(/[^0-9.\-]/g,''); if (s === '' || s === '-' || s === '.') return 0; const n = parseFloat(s); return isFinite(n) ? Math.round(n*100) : 0; };
const initial = n => (String(n).trim()[0] || '?').toUpperCase();
const person = id => S.people.find(p => p.id === id);
const item = id => S.items.find(i => i.id === id);
const fee = id => S.fees.find(f => f.id === id);
const iname = it => (it.name || '').trim() || 'Item';
const PROVIDERS = {
  gemini:{ name:'Gemini', vendor:'Google', keyLS:'key', modelLS:'model', model:'gemini-3.1-flash-lite', link:'https://aistudio.google.com/apikey' },
  claude:{ name:'Claude', vendor:'Anthropic', keyLS:'ckey', modelLS:'cmodel', model:'claude-haiku-5-5', link:'https://console.anthropic.com/settings/keys' }
};
const getProvider = () => lsGet(LS.provider) === 'claude' ? 'claude' : 'gemini';
const P = () => PROVIDERS[getProvider()];
const getKey = () => lsGet(LS[P().keyLS]) || '';
const getModel = () => lsGet(LS[P().modelLS]) || P().model;
const getRecent = () => { try { return JSON.parse(lsGet(LS.recent) || '[]'); } catch { return []; } };

const svg = (d, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  camera: svg('<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', 34),
  x: svg('<path d="M6 6l12 12M18 6L6 18"/>', 18),
  plus: svg('<path d="M12 5v14M5 12h14"/>', 20),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 16),
  back: svg('<path d="M15 5l-7 7 7 7"/>', 22)
};
const LOGO = `<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="currentColor"/><path d="M16 2v28" stroke="#ffd23f" stroke-width="3.5"/></svg>`;

function toast(msg, ms = 1600){
  $toast.textContent = msg; $toast.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { $toast.hidden = true; }, ms);
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch {}
  try {
    const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select(); const ok = document.execCommand('copy'); a.remove(); return ok;
  } catch { return false; }
}

/* ---------- money math (integer cents) ---------- */
// Split `total` cents by `weights`; leftover pennies go to the largest remainders.
function allocate(total, weights, offset = 0){
  const n = weights.length; if (!n) return [];
  const sign = total < 0 ? -1 : 1, t = Math.abs(total);
  let w = weights.map(x => Math.max(0, x)), s = w.reduce((a,b) => a + b, 0);
  if (s === 0) { w = w.map(() => 1); s = n; }
  const raw = w.map(x => t * x / s);
  const out = raw.map(Math.floor);
  const rem = t - out.reduce((a,b) => a + b, 0);
  const order = raw.map((r,i) => ({ i, f:r - out[i] }))
    .sort((a,b) => (b.f - a.f) || (((a.i + offset) % n) - ((b.i + offset) % n)));
  for (let k = 0; k < rem; k++) out[order[k].i]++;
  return out.map(x => sign * x || 0);
}
// Pure: items [{name,cents,who:[ids]}], people ids, tax/fees/tip in cents.
function computeSplit(items, ids, tax, fees, tip){
  const per = {}; ids.forEach(id => per[id] = { items:[], sub:0, tax:0, fees:0, tip:0, total:0 });
  const unassigned = [];
  items.forEach((it, idx) => {
    const who = ids.filter(id => it.who.includes(id));
    if (!who.length) { unassigned.push(it); return; }
    const shares = allocate(it.cents, who.map(() => 1), idx);
    who.forEach((id, i) => {
      per[id].sub += shares[i];
      per[id].items.push({ name:(it.name || '').trim() || 'Item', cents:shares[i], n:who.length });
    });
  });
  const weights = ids.map(id => per[id].sub);
  const t = allocate(tax, weights), f = allocate(fees, weights), p = allocate(tip, weights);
  ids.forEach((id, i) => {
    Object.assign(per[id], { tax:t[i], fees:f[i], tip:p[i] });
    per[id].total = per[id].sub + t[i] + f[i] + p[i];
  });
  return { per, unassigned };
}
const itemsSum = () => S.items.reduce((a,i) => a + i.cents, 0);

const feesSum = () => S.fees.reduce((a,f) => a + feeCents(f), 0);

const tipCents = () => S.tip.mode === 'flat' ? S.tip.flat : Math.round(tipBase() * S.tip.pct / 100);

/* ---------- receipt reading (Gemini) ---------- */
const PROMPT = `You are reading photos of one restaurant or store receipt. Several photos may show different parts of the same receipt, so do not list an item twice.
Return every purchased line item with:
- name: cleaned up, readable, no item codes
- quantity: default 1
- price_cents: the TOTAL price for that line (quantity times unit price) in integer cents
Do not list tax, tip, subtotal, total, or payment lines as items.
Put discounts and coupons in fees as NEGATIVE amount_cents. Put service charges and delivery fees in fees as positive amount_cents.
tax_cents is the total sales tax. tip_cents is the tip or auto-gratuity if one is printed or written in, otherwise null.
subtotal_cents and total_cents are as printed, otherwise null.
Respond with JSON only.`;
const SCHEMA = {
  type:'OBJECT',
  properties:{
    items:{ type:'ARRAY', items:{ type:'OBJECT', properties:{ name:{type:'STRING'}, quantity:{type:'INTEGER'}, price_cents:{type:'INTEGER'} }, required:['name','price_cents'] } },
    fees:{ type:'ARRAY', items:{ type:'OBJECT', properties:{ name:{type:'STRING'}, amount_cents:{type:'INTEGER'} }, required:['name','amount_cents'] } },
    subtotal_cents:{ type:'INTEGER', nullable:true },
    tax_cents:{ type:'INTEGER', nullable:true },
    tip_cents:{ type:'INTEGER', nullable:true },
    total_cents:{ type:'INTEGER', nullable:true }

  required:['items']

const HEIC_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js';
// Draw any decoded image source onto a canvas capped at ~2000px and return a JPEG data URL.
function drawScaled(src, w0, h0){
  const M = 1600, k = Math.min(1, M / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(src, 0, 0, w, h);
  const out = c.toDataURL('image/jpeg', .8);
  if (!out || out.length < 100) throw new Error('empty canvas');
  return out;
}
function viaImageEl(url, revoke){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try { resolve(drawScaled(img, img.naturalWidth, img.naturalHeight)); }
      catch (e) { reject(e); }
      finally { if (revoke) URL.revokeObjectURL(url); }
    };
    img.onerror = () => { if (revoke) URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
function readAsDataURL(blob){
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(new Error('read')); r.readAsDataURL(blob); });
}
function loadScript(src){
  return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('script')); document.head.appendChild(s); });
}
// Turn any photo into a JPEG of about 2000px, trying several decoders before giving up.
async function downscale(file){
  const why = [];
  const attempt = async (name, fn) => { try { return await fn(); } catch (e) { why.push(name + ': ' + (e && e.message || e)); return null; } };
  let out = null;

  if (window.createImageBitmap) {
    out = await attempt('bitmap', async () => {
      const bmp = await createImageBitmap(file, { imageOrientation:'from-image' }).catch(() => createImageBitmap(file));
      try { return drawScaled(bmp, bmp.width, bmp.height); } finally { bmp.close && bmp.close(); }
    });
    if (out) return out;
  }
  out = await attempt('blob', () => { const u = URL.createObjectURL(file); return viaImageEl(u, true); });
  if (out) return out;
  out = await attempt('dataurl', async () => viaImageEl(await readAsDataURL(file), false));
  if (out) return out;

  const isHeic = /hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name);
  if (isHeic) {
    out = await attempt('heic', async () => {
      if (!window.heic2any) await loadScript(HEIC_SRC);
      const res = await window.heic2any({ blob:file, toType:'image/jpeg', quality:.85 });
      const blob = Array.isArray(res) ? res[0] : res;
      return viaImageEl(await readAsDataURL(blob), false);
    });
    if (out) return out;
  }

  // Last resort: send the original file untouched and let Gemini decode it.
  if (file.size < 12 * 1024 * 1024) {
    const raw = await attempt('raw', async () => {
      const d = await readAsDataURL(file);
      const mime = /^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type) ? file.type.toLowerCase() : (isHeic ? 'image/heic' : 'image/jpeg');
      return d.replace(/^data:[^;,]*/, 'data:' + mime);
    });
    if (raw) return raw;
  }
  console.warn('Photo failed to load', file.type, file.size, why);
  throw new Error(`That photo (${file.type || 'unknown type'}, ${(file.size / 1048576).toFixed(1)} MB) couldn’t be processed. Try a screenshot of it instead. Details: ${why.join('; ')}`);
}
async function addFiles(files){
  ui.error = '';
  for (const f of files) {
    if (ui.photos.length >= 6) break;
    try { ui.photos.push(await downscale(f)); } catch (e) { ui.error = e.message; }
  }

}
function applyReceipt(r){
  S.items = (r.items || []).filter(i => i && Number.isFinite(i.price_cents)).map(i => ({
    id:uid(), name:String(i.name || '').trim(), qty:Math.max(1, i.quantity || 1), cents:Math.round(i.price_cents), who:[]
  }));
  S.fees = (r.fees || []).filter(f => f && Number.isFinite(f.amount_cents) && f.amount_cents !== 0).map(f => ({
    id:uid(), name:String(f.name || '').trim(), amt:Math.abs(Math.round(f.amount_cents)), neg:f.amount_cents < 0
  }));
  S.tax = Math.max(0, Math.round(r.tax_cents || 0));
  if (r.tip_cents > 0) S.tip = { ...S.tip, mode:'flat', flat:Math.round(r.tip_cents), fromReceipt:true };
  else S.tip = { ...S.tip, mode:'pct', pct:S.tip.pct || 20, fromReceipt:false };
  S.receipt = { subtotal:Number.isFinite(r.subtotal_cents) ? r.subtotal_cents : null, total:Number.isFinite(r.total_cents) ? r.total_cents : null };

}
// Safari reports any blocked or failed request as "Load failed". Probe to tell why.
async function diagnoseNetwork(key){
  if (getProvider() === 'claude') return 'Couldn’t reach Anthropic. Check your connection, turn off any VPN or content blocker, and make sure the key is right.';
  const shape = `${key.slice(0, 4)}…, ${key.length} characters`;
  let online = true;
  try { await fetch('https://www.gstatic.com/generate_204', { mode:'no-cors', cache:'no-store' }); } catch { online = false; }
  if (!online) return 'Your browser can’t reach Google at all. Check your connection, and turn off any VPN, iCloud Private Relay, or content blocker.';
  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1&key=' + encodeURIComponent(key));
    if (r.ok) return 'Google accepted the key, but the receipt request itself failed. Try one or two smaller photos.';
    return `Google answered with status ${r.status}. Check the key and its restrictions.`;
  } catch {
    return `Google is reachable, but it refused the browser request for this key (saved key: ${shape}). `
      + 'Most often the key itself is the cause. In Google Cloud Console, create a new API key, restrict it to Generative Language API only, and leave website restrictions off for now.';
  }
}
class ApiError extends Error {}
async function callGemini(url, body, headers = { 'Content-Type':'application/json' }){
  const t0 = Date.now();
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 60000);
  try {
    const res = await fetch(url, { method:'POST', headers, body, signal:ctl.signal });
    if (res.ok) return { ok:true, data:await res.json() };
    let msg = ''; try { msg = (await res.json()).error?.message || ''; } catch {}
    return { ok:false, ms:Date.now() - t0, status:res.status, msg, transient:[500,502,503,504,529].includes(res.status) || /deadline|overloaded|unavailable/i.test(msg) };
  } catch (e) {
    if (e && e.name === 'AbortError') return { ok:false, ms:Date.now() - t0, status:0, msg:P().vendor + ' took too long to answer.', transient:true };
    throw e;
  } finally { clearTimeout(timer); }
}
// Receipts don't need deep reasoning. Newer Gemini models think a lot by default, which is slow and costs more.
function thinkingFor(model){
  return /2\.5/.test(model) ? { thinkingBudget:0 } : { thinkingLevel:'minimal' };
}
const CLAUDE_TOOL = {
  name:'record_receipt',
  description:'Record the line items and totals read from the receipt.',
  input_schema:{ type:'object', properties:{
    items:{ type:'array', items:{ type:'object', properties:{ name:{type:'string'}, quantity:{type:'integer'}, price_cents:{type:'integer'} }, required:['name','price_cents'] } },
    fees:{ type:'array', items:{ type:'object', properties:{ name:{type:'string'}, amount_cents:{type:'integer'} }, required:['name','amount_cents'] } },
    subtotal_cents:{ type:'integer' }, tax_cents:{ type:'integer' }, tip_cents:{ type:'integer' }, total_cents:{ type:'integer' }
  }, required:['items'] }
};
async function scan(){
  const key = getKey(); if (!key || !ui.photos.length || ui.scanning) return;
  const pv = getProvider(), vendor = P().vendor, model = getModel();
  ui.scanning = true; ui.error = ''; ui.attempt = 1; render();
  try {
    let r, extract;
    if (pv === 'claude') {
      if (ui.photos.some(d => !/^data:image\/(jpeg|png|webp|gif);/.test(d))) throw new ApiError('Claude can’t read HEIC photos. Remove the photo and add it again as a JPEG.');
      const content = ui.photos.map(d => ({ type:'image', source:{ type:'base64', media_type:d.slice(5, d.indexOf(';')), data:d.split(',')[1] } }));
      content.push({ type:'text', text:PROMPT });
      const body = JSON.stringify({ model, max_tokens:2048, tools:[CLAUDE_TOOL], tool_choice:{ type:'tool', name:CLAUDE_TOOL.name }, messages:[{ role:'user', content }] });
      r = await callGemini('https://api.anthropic.com/v1/messages', body, {
        'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'
      });
      extract = d => (d.content || []).find(b => b.type === 'tool_use')?.input;
    } else {
      const parts = ui.photos.map(d => ({ inline_data:{ mime_type:d.slice(5, d.indexOf(';')), data:d.split(',')[1] } }));
      parts.push({ text:PROMPT });
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
      const mk = withThinking => JSON.stringify({
        contents:[{ parts }],
        generationConfig:{ responseMimeType:'application/json', responseSchema:SCHEMA, temperature:0, maxOutputTokens:8192, ...(withThinking ? { thinkingConfig:thinkingFor(model) } : {}) }
      });
      // One request, no automatic retries: every attempt can be billed.
      r = await callGemini(url, mk(true));
      // A custom model that doesn't accept the thinking setting: ask once more without it.
      if (!r.ok && r.status === 400 && /think/i.test(r.msg)) r = await callGemini(url, mk(false));
      extract = d => {
        const t = (d.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('').trim()
          .replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
        return t ? JSON.parse(t) : null;
      };
    }
    if (!r.ok) {
      if (r.status === 429) throw new ApiError('You’ve hit the rate limit. Wait a minute and try again.');
      if (r.status === 401) throw new ApiError(`${vendor} rejected the key. Check that it’s correct.`);
      if (r.status === 400 || r.status === 403) throw new ApiError(`${vendor} rejected the request. Check that the key and model name are right. ${r.msg}`);
      if (r.status === 404) throw new ApiError('That model name doesn’t exist. Change it under the key settings.');
      if (r.transient) throw new ApiError(`${vendor} is busy or timed out (${r.status ? 'error ' + r.status : 'no answer'} after ${Math.round(r.ms / 1000)}s, model ${model}). I didn’t retry automatically, to avoid extra charges. Wait a minute and tap Read receipt, or switch models.`);
      throw new ApiError(r.msg || `Request failed (${r.status}).`);
    }
    const receipt = extract(r.data);
    if (!receipt) throw new ApiError('The model sent back nothing. Try a clearer photo.');
    applyReceipt(receipt);
    if (!S.items.length) throw new ApiError('No line items found. Try a clearer, flatter photo.');
  } catch (e) {
    if (e instanceof SyntaxError) ui.error = 'The response wasn’t readable. Tap Read receipt to try again.';
    else if (e instanceof ApiError) ui.error = e.message;
    else ui.error = (await diagnoseNetwork(key)) + ` (${e && e.name}: ${e && e.message})`;
  }
  ui.scanning = false; render();
}

function barHTML(){

/* CARD-START */
// The link-preview picture: drawn on your phone when you tap Share link, then stored with the split.
const CARD_FONT = '"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif';
function rrect(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fitText(ctx, text, maxW){
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text; while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + '…';
}
function drawShareCard(ctx, W, snap){
  const INK = '#161a20', FG = '#f3f4f6', MUTED = '#8b93a0', LINE = '#2a2f38', YEL = '#ffd23f', PAD = 64, R = W - PAD;
  const payer = snap.people.find(p => p.payer);
  const others = snap.people.filter(p => !p.payer);
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, W);
  ctx.textBaseline = 'alphabetic';

  // mark + name, and the note on the right
  ctx.fillStyle = FG; ctx.beginPath(); ctx.arc(PAD + 22, PAD + 22, 22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = YEL; ctx.fillRect(PAD + 20, PAD, 4, 44);
  ctx.fillStyle = FG; ctx.textAlign = 'left'; ctx.font = `800 40px ${CARD_FONT}`;
  ctx.fillText('dutch', PAD + 60, PAD + 34);
  ctx.fillStyle = MUTED; ctx.textAlign = 'right'; ctx.font = `500 36px ${CARD_FONT}`;
  ctx.fillText(fitText(ctx, snap.title, 360), R, PAD + 33);

  // size things first so the whole block can be centred in the space under the header
  const amount = fmt(snap.total);
  let size = 150; ctx.font = `800 ${size}px ${CARD_FONT}`;
  while (ctx.measureText(amount).width > W - PAD * 2 && size > 60) { size -= 4; ctx.font = `800 ${size}px ${CARD_FONT}`; }
  const shown = others.length > 5 ? others.slice(0, 4) : others;
  const more = others.length - shown.length;
  const rows = shown.length + (more > 0 ? 1 : 0);
  const rowH = Math.min(112, Math.floor(380 / rows)), k = Math.min(1.3, rowH / 84);
  const barH = 18, head = 46 + 30 + size * 0.74 + 40 + barH + 36;
  const y0 = Math.max(150, 150 + (W - PAD - 150 - (head + rows * rowH)) / 2);

  // who paid, and how much
  ctx.textAlign = 'left'; ctx.fillStyle = MUTED; ctx.font = `500 46px ${CARD_FONT}`;
  ctx.fillText(fitText(ctx, payer.name + ' paid', W - PAD * 2), PAD, y0 + 46);
  ctx.fillStyle = FG; ctx.font = `800 ${size}px ${CARD_FONT}`;
  const amountY = y0 + 46 + 30 + size * 0.74;
  ctx.fillText(amount, PAD - 4, amountY);

  // everyone's share of the bill
  const barY = amountY + 40, gap = 4;
  const live = snap.people.filter(p => p.total > 0), sum = live.reduce((a, p) => a + p.total, 0) || 1;
  const avail = W - PAD * 2 - gap * (live.length - 1);
  let x = PAD;
  for (const p of live) { const w = Math.max(10, avail * p.total / sum); ctx.fillStyle = p.color; rrect(ctx, x, barY, w, barH, barH / 2); ctx.fill(); x += w + gap; }

  // what each person owes
  const top = barY + barH + 36, fs = Math.round(42 * k), dr = Math.round(22 * k);
  for (let i = 0; i < rows; i++) {
    const y = top + i * rowH, cy = y + rowH / 2;
    if (i > 0) { ctx.fillStyle = LINE; ctx.fillRect(PAD, y, W - PAD * 2, 2); }
    if (i < shown.length) {
      const p = shown[i];
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(PAD + dr, cy, dr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = `700 ${Math.round(dr * 1.25)}px ${CARD_FONT}`;
      ctx.fillText(initial(p.name), PAD + dr, cy + dr * 0.43);
      ctx.textAlign = 'right'; ctx.font = `800 ${fs}px ${CARD_FONT}`; ctx.fillStyle = FG;
      const amt = fmt(p.total); ctx.fillText(amt, R, cy + fs * 0.36);
      const aw = ctx.measureText(amt).width;
      ctx.textAlign = 'left'; ctx.font = `700 ${fs}px ${CARD_FONT}`;
      ctx.fillText(fitText(ctx, p.name, W - PAD * 2 - dr * 2 - 20 - aw - 24), PAD + dr * 2 + 20, cy + fs * 0.36);
    } else {
      ctx.textAlign = 'left'; ctx.fillStyle = MUTED; ctx.font = `500 36px ${CARD_FONT}`;
      ctx.fillText(`+${more} more`, PAD + dr * 2 + 20, cy + 13);
    }
  }
}
async function renderShareCard(snap){
  try {
    if (document.fonts && document.fonts.load) await Promise.all(['500', '700', '800'].map(w => document.fonts.load(`${w} 40px "Bricolage Grotesque"`)));
    const c = document.createElement('canvas'); c.width = c.height = 900;
    drawShareCard(c.getContext('2d'), 900, snap);
    let q = .8, out = '';
    do { out = c.toDataURL('image/jpeg', q).split(',')[1]; q -= .1; } while (out.length > 85000 && q > .35);
    return out.length <= 90000 ? out : null;   // too big for the table field: share without a picture
  } catch { return null; }
}
/* CARD-END */

/* ---------- sharing ---------- */
// What a link stores: the finished result, so the recipient sees exactly what you saw.
function buildSnapshot(){
  const R = calc();
  return {
    v:1, title:((S.note || '').trim() || 'Dinner'), venmo:(S.venmo || '').trim(), total:grandTotal(),
    people:S.people.map(p => { const r = R.per[p.id]; return { name:p.name, color:p.color, payer:p.id === S.payer, sub:r.sub, tax:r.tax, fees:r.fees, tip:r.tip, total:r.total, items:r.items }; })
  };
}
async function postShare(body){
  const res = await fetch(SHARE_API + '/api/share', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  let j = null; try { j = await res.json(); } catch {}
  return { status:res.status, data:res.ok ? j : null, detail:(!res.ok && j && j.detail) || '' };
}
async function shareLink(){
  if (ui.sharing) return;
  const snap = buildSnapshot(), sig = JSON.stringify(snap);
  const payer = snap.people.find(p => p.payer);
  ui.sharing = true; $bar.innerHTML = barHTML();
  try {
    let sh = S.share;
    if (!sh || sh.sig !== sig) {
      const image = await renderShareCard(snap);
      let r = await postShare({ id:sh && sh.id, key:sh && sh.key, split:snap, image });
      if (sh && (r.status === 403 || r.status === 404)) r = await postShare({ split:snap, image });   // old link is gone: make a new one
      if (!r.data) throw new Error(`error ${r.status}${r.detail ? ': ' + r.detail : ''}`);
      sh = S.share = { id:r.data.id, key:r.data.key, sig }; save();
    }
    const url = `${SHARE_API}/s/${sh.id}`;
    ui.sharing = false; $bar.innerHTML = barHTML();
    if (navigator.share) {
      try { await navigator.share({ title:`${snap.title}: ${payer.name} paid ${fmt(snap.total)}`, url }); return; }
      catch (err) { if (err && err.name === 'AbortError') return; }
    }
    toast((await copyText(url)) ? 'Link copied' : 'Couldn’t copy the link');
  } catch (e) {
    ui.sharing = false;
    console.error('share failed', e);
    const why = e instanceof TypeError ? 'can’t reach the Worker' : (e && e.message) || 'unknown';
    toast(`Couldn’t make a link (${why}). ${(await copyText(summaryText())) ? 'Copied the text instead.' : ''}`, 9000);
  } finally { ui.sharing = false; $bar.innerHTML = barHTML(); }
}

function stepShared(){

  const others = d.people.filter(p => !p.payer && p !== me);
  const meOwes = me && !me.payer;
  let h = `<h1>${esc(payer.name)} paid ${fmt(d.total)}</h1><p class="lede">${esc(d.title)}. ${me ? (meOwes ? 'Here’s your share.' : 'Here’s what everyone owes you.') : 'Tap your name to see your share first.'}</p>

  <p class="muted small" style="margin:14px 0 8px">Who are you?</p>
  <div class="who">${d.people.map(p => `<button class="chip ${me === p ? 'on' : ''}" style="--c:${esc(p.color)}" data-act="me" data-name="${esc(p.name)}" aria-pressed="${me === p}"><span class="dot">${esc(initial(p.name))}</span>${esc(p.name)}</button>`).join('')}</div>`;
  if (meOwes) h += sharedCard(me, d, true) + (others.length ? `<div class="subh">Everyone else</div>` : '');
  h += `<div>${others.map(p => sharedCard(p, d, false)).join('')}</div>`;
  h += `<p class="payerline">${esc(payer.name)}’s own share is ${fmt(payer.total)}.</p>`;
  return h;
}
function barShared(){
  const sh = ui.shared, d = sh.data;
  const payer = d && d.people.find(p => p.payer);
  const me = d && d.people.find(p => p.name === sh.me);
  if (sh.status === 'ok' && me && !me.payer && d.venmo) {
    const h = venmoUrl(d.venmo, d.title, me.total);
    return `<div class="in"><a class="btn primary" href="${esc(h)}" ${MOBILE ? '' : 'target="_blank" rel="noopener"'}>Pay ${esc(payer.name)} ${fmt(me.total)} on Venmo</a></div>`;
  }
  return `<div class="in"><button class="btn primary" data-act="ownSplit">Split your own receipt</button></div>`;
}
async function loadShared(id){
  try {
    const res = await fetch(`${SHARE_API}/api/split/${encodeURIComponent(id)}`);
    if (!res.ok) throw new Error('status ' + res.status);
    const j = await res.json();
    if (!j.split || !Array.isArray(j.split.people)) throw new Error('bad data');
    ui.shared.data = j.split; ui.shared.status = 'ok';
  } catch { ui.shared.status = 'error'; }
  render({ enter:true });
}

function summaryText(){
  const R = calc(), payer = person(S.payer);
  const lines = [`${S.note || 'Dinner'}: ${fmt(grandTotal())} total, paid by ${payer.name}.`];
  S.people.filter(p => p.id !== S.payer).forEach(p => lines.push(`${p.name} owes ${fmt(R.per[p.id].total)}`));
  if ((S.venmo || '').trim()) lines.push(`Venmo: @${S.venmo.trim().replace(/^@/, '')}`);
  return lines.join('\n');
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, p = el.dataset.p;
  switch (a) {
    case 'goto': if (+el.dataset.n <= S.step) go(+el.dataset.n); break;
    case 'next': go(S.step + 1); break;
    case 'back': go(S.step - 1); break;
    case 'scan': scan(); break;
    case 'manual': go(1); break;
    case 'rmPhoto': ui.photos.splice(+el.dataset.i, 1); render(); break;
    case 'editKey': ui.keyEdit = true; render(); break;
    case 'rmKey': lsDel(LS[P().keyLS]); lsDel(LS[P().modelLS]); ui.keyEdit = false; ui.models = null; ui.modelsMsg = ''; render(); break;
    case 'provider': lsSet(LS.provider, el.dataset.v); ui.models = null; ui.modelsMsg = ''; ui.keyEdit = true; render(); break;
    case 'pickModel': lsSet(LS.model, el.dataset.name); toast('Model set to ' + el.dataset.name); ui.error = ''; render(); break;
    case 'listModels': {
      ui.modelsMsg = 'Looking…'; render();
      try {
        const rr = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(getKey()));
        if (!rr.ok) throw new Error('status ' + rr.status);
        const j = await rr.json();
        ui.models = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /flash/i.test(m.name) && !/image|tts|live|audio|embed|robotics|computer|thinking/i.test(m.name))
          .map(m => m.name.replace(/^models\//, '')).slice(0, 12);
        ui.modelsMsg = ui.models.length ? 'Tap one to use it.' : 'No Flash models found for this key.';
      } catch { ui.models = null; ui.modelsMsg = 'Couldn’t load the list.'; }
      render(); break;
    }
    case 'addRecent': if (addPerson(el.dataset.name)) { ui.focus = '#pname'; render(); } break;
    case 'payer': S.payer = p; save(); render(); break;
    case 'rmPerson':
      S.people = S.people.filter(x => x.id !== p);
      S.items.forEach(i => { i.who = i.who.filter(x => x !== p); });
      if (S.payer === p) S.payer = S.people[0]?.id || null;
      if (S.activePerson === p) S.activePerson = null;
      save(); render(); break;
    case 'addItem': { const it = { id:uid(), name:'', qty:1, cents:0, who:[] }; S.items.push(it); save(); ui.focus = `[data-f="iname"][data-id="${it.id}"]`; render(); break; }
    case 'rmItem': S.items = S.items.filter(i => i.id !== id); save(); render(); break;
    case 'splitQty': {
      const i = S.items.findIndex(x => x.id === id), it = S.items[i]; if (!it) break;
      const shares = allocate(it.cents, Array(it.qty).fill(1));
      S.items.splice(i, 1, ...shares.map(c => ({ id:uid(), name:it.name, qty:1, cents:c, who:[] })));
      save(); render(); break;
    }
    case 'addFee': { const f = { id:uid(), name:'', amt:0, neg:el.dataset.neg === '1' }; S.fees.push(f); save(); ui.focus = `[data-f="fname"][data-id="${f.id}"]`; render(); break; }
    case 'rmFee': S.fees = S.fees.filter(f => f.id !== id); save(); render(); break;
    case 'feeSign': { const f = fee(id); if (f) { f.neg = !f.neg; save(); render(); } break; }
    case 'tip': S.tip.mode = 'pct'; S.tip.pct = +el.dataset.v; S.tip.fromReceipt = false; save(); render(); break;
    case 'tipOther': if (S.tip.mode !== 'flat') { S.tip.flat = tipCents(); S.tip.mode = 'flat'; S.tip.fromReceipt = false; save(); render(); } break;
    case 'basis': S.tip.basis = el.dataset.v; save(); render(); break;
    case 'lb': ui.lb = +el.dataset.i; render(); break;
    case 'closeLb': ui.lb = null; render(); break;
    case 'view': S.view = el.dataset.v; save(); render(); break;
    case 'toggle': { const it = item(id); if (!it) break; const k = it.who.indexOf(p); if (k > -1) it.who.splice(k, 1); else it.who.push(p); normWho(it); save(); render(); break; }
    case 'all': { const it = item(id); if (!it) break; it.who = it.who.length === S.people.length ? [] : S.people.map(x => x.id); save(); render(); break; }
    case 'allLeft': unassigned().forEach(i => { i.who = S.people.map(x => x.id); }); save(); render(); break;
    case 'ptab': S.activePerson = p; save(); render(); document.querySelector('.ptab.on')?.scrollIntoView({ inline:'center', block:'nearest' }); break;
    case 'nextPerson': S.activePerson = p; save(); render(); document.querySelector('.ptabs')?.scrollIntoView({ block:'start' }); document.querySelector('.ptab.on')?.scrollIntoView({ inline:'center', block:'nearest' }); break;
    case 'copy': { const ok = await copyText(plain(+el.dataset.amt)); toast(ok ? `Copied ${plain(+el.dataset.amt)}` : 'Couldn’t copy. Select the amount instead.'); break; }
    case 'shareLink': shareLink(); break;
    case 'me': if (ui.shared) { ui.shared.me = ui.shared.me === el.dataset.name ? '' : el.dataset.name; lsSet('dutch.me.' + ui.shared.id, ui.shared.me); render(); } break;
    case 'ownSplit': location.href = location.pathname; break;
    case 'shareAll': {
      const text = summaryText();
      if (navigator.share) { try { await navigator.share({ text }); break; } catch (err) { if (err && err.name === 'AbortError') break; } }
      toast((await copyText(text)) ? 'Summary copied' : 'Couldn’t copy the summary.'); break;
    }
    case 'startover':
      if (confirm('Start over? This clears the receipt, photos, and people. Your API key stays.')) {
        S = { ...fresh(), venmo:S.venmo, note:S.note }; ui.photos = []; ui.error = ''; ui.lb = null; ui.scanning = false;
        save(); render({ enter:true });
      }
      break;
    case 'reset':
      if (confirm('Clear this receipt and start a new one? Your people stay.')) {
        const keep = { people:S.people, payer:S.payer, venmo:S.venmo, note:S.note };
        S = { ...fresh(), ...keep }; ui.photos = []; ui.error = ''; ui.lb = null; save(); render({ enter:true });
      }
      break;
  }
});

document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const id = t.dataset.id;
  switch (f) {
    case 'iname': { const it = item(id); if (it) it.name = t.value; break; }
    case 'icents': { const it = item(id); if (it) it.cents = parse(t.value); break; }
    case 'tax': S.tax = Math.max(0, parse(t.value)); break;
    case 'fname': { const x = fee(id); if (x) x.name = t.value; break; }
    case 'fcents': { const x = fee(id); if (x) x.amt = Math.abs(parse(t.value)); break; }
    case 'tipflat': S.tip.flat = Math.max(0, parse(t.value)); S.tip.fromReceipt = false; break;
    case 'venmo': S.venmo = t.value.replace(/^@/, '').trim(); break;
    case 'note': S.note = t.value; break;
  }
  save(); updateLive();
});
document.addEventListener('focusin', e => { if (e.target.classList?.contains('money')) setTimeout(() => e.target.select && e.target.select(), 0); });
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.classList?.contains('money') && t.dataset.f) { let c = parse(t.value); if (t.dataset.f !== 'icents') c = Math.max(0, c); t.value = plain(c); }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-file]')) { const files = [...e.target.files]; e.target.value = ''; addFiles(files); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'addPerson') {
    const inp = document.getElementById('pname');
    if (addPerson(inp.value)) { ui.focus = '#pname'; render(); } else { inp.focus(); }
  } else if (f === 'saveKey') {
    const k = document.getElementById('keyinput').value.replace(/[\s"'“”‘’]/g, '');
    if (!k) return;
    if (!/^[\x21-\x7E]+$/.test(k)) { toast('That key has odd characters. Copy it again.'); return; }
    lsSet(LS[P().keyLS], k);
    const m = document.getElementById('modelinput'); if (m) { const v = m.value.trim(); if (v && v !== P().model) lsSet(LS[P().modelLS], v); else lsDel(LS[P().modelLS]); }
    ui.keyEdit = false; render(); toast('Key saved');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.lb != null) { ui.lb = null; render(); } });

/* ---------- tests: open index.html?test and check the console ---------- */
function runTests(){
  const sum = a => a.reduce((x,y) => x + y, 0);
  const t = (ok, name, info) => console[ok ? 'log' : 'error']((ok ? 'pass: ' : 'FAIL: ') + name, ok ? '' : info);
  t(sum(allocate(100, [1,1,1])) === 100, 'thirds sum to 100');
  t(JSON.stringify(allocate(100, [1,1,1])) === '[34,33,33]', 'extra penny goes to the first person', allocate(100, [1,1,1]));
  const d = allocate(-200, [1000, 500]);
  t(sum(d) === -200 && d[0] === -133 && d[1] === -67, 'discount splits proportionally', d);
  t(sum(allocate(0, [3,4])) === 0, 'zero total stays zero');
  t(sum(allocate(101, [0,0])) === 101, 'zero weights fall back to an even split');
  const R = computeSplit(
    [{ name:'Shared', cents:1000, who:['a','b'] }, { name:'A only', cents:500, who:['a'] }],
    ['a','b'], 150, 0, 300);
  t(R.per.a.sub === 1000 && R.per.b.sub === 500, 'shared item splits evenly', R.per);
  t(R.per.a.tax === 100 && R.per.b.tax === 50 && R.per.a.tip === 200 && R.per.b.tip === 100, 'tax and tip follow each subtotal', R.per);
  t(R.per.a.total + R.per.b.total === 1500 + 150 + 300, 'totals match the receipt exactly');
  const R2 = computeSplit([{ name:'x', cents:100, who:['a','b','c'] }, { name:'y', cents:1, who:['a','b','c'] }], ['a','b','c'], 7, -3, 11);
  t(R2.per.a.total + R2.per.b.total + R2.per.c.total === 101 + 7 - 3 + 11, 'odd cents still add up', R2.per);
  t(computeSplit([{ name:'z', cents:5, who:[] }], ['a'], 0, 0, 0).unassigned.length === 1, 'unassigned items are reported');
}
if (/[?&]test\b/.test(location.search)) runTests();

const sharedId = new URLSearchParams(location.search).get('s');
if (SHARE_API && sharedId && /^[a-z0-9]{6,20}$/i.test(sharedId)) {
  ui.shared = { id:sharedId.toLowerCase(), status:'loading', data:null, me:lsGet('dutch.me.' + sharedId.toLowerCase()) || '' };
  loadShared(ui.shared.id);
}
render({ enter:!!ui.shared });
})();
