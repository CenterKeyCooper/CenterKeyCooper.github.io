// =====================================================================
// NETWORKING — PeerJS host-authoritative co-op
// =====================================================================
// Force the secure cloud endpoint: PeerJS infers ws/wss from the page
// protocol, and under file:// that means ws://0.peerjs.com:443 — which
// never connects. Explicit secure:true makes file:// hosting work.
// Extra ICE servers (e.g. a TURN relay for UDP-blocked networks) can be
// injected without code changes:
//   localStorage.setItem('mcrogue-ice', JSON.stringify([
//     { urls: 'turn:…', username: '…', credential: '…' }]))
function peerOpts() {
  const ice = [{ urls: 'stun:stun.l.google.com:19302' }];
  try {
    const extra = JSON.parse(localStorage.getItem('mcrogue-ice') || 'null');
    if (Array.isArray(extra)) ice.push(...extra);
  } catch (e) {}
  return { host: '0.peerjs.com', port: 443, secure: true, config: { iceServers: ice } };
}

// [T] on the title screen: in-page WebRTC loopback self-test. If two
// RTCPeerConnections in the SAME page can't open a data channel, the
// machine/network is blocking WebRTC (VPN / security software) and no
// room code will ever connect without a TURN relay.
function webrtcSelfTest() {
  netMsgTitle = 'TESTING WEBRTC…';
  try {
    const cfg = peerOpts().config;
    const a = new RTCPeerConnection(cfg), b = new RTCPeerConnection(cfg);
    let done = false;
    const finish = (msg) => {
      if (done) return;
      done = true;
      netMsgTitle = msg;
      try { a.close(); b.close(); } catch (e) {}
    };
    a.onicecandidate = e => { if (e.candidate) b.addIceCandidate(e.candidate).catch(() => {}); };
    b.onicecandidate = e => { if (e.candidate) a.addIceCandidate(e.candidate).catch(() => {}); };
    const ch = a.createDataChannel('t');
    ch.onopen = () => finish('WEBRTC OK — LOOPBACK DATA CHANNEL OPENED');
    a.createOffer()
      .then(o => a.setLocalDescription(o))
      .then(() => b.setRemoteDescription(a.localDescription))
      .then(() => b.createAnswer())
      .then(an => b.setLocalDescription(an))
      .then(() => a.setRemoteDescription(b.localDescription))
      .catch(err => finish('WEBRTC TEST ERROR: ' + err));
    setTimeout(() => finish('WEBRTC BLOCKED (ICE ' + a.iceConnectionState + ') — UDP FILTERED? (VPN)'), 6000);
  } catch (err) { netMsgTitle = 'WEBRTC UNAVAILABLE: ' + err; }
}

// cycle a player's color to the next one no other player is using
function cycleColor(idx) {
  const pl = players[idx];
  if (!pl) return;
  const used = new Set(players.filter(p => p.idx !== idx).map(p => p.color));
  const ci = Math.max(0, COLORS.indexOf(pl.color));
  for (let k = 1; k <= COLOR_BASE; k++) {
    const c = COLORS[(ci + k) % COLOR_BASE];
    if (!used.has(c)) { pl.color = c; break; }
  }
  if (idx === myIdx) saveColorPref(pl.color);
  const cn = net.conns.find(c => c._idx === idx);
  if (cn) cn._color = pl.color;
  broadcastLobby();
}

// host [L] at an end screen: bring the whole party back to the lobby
// (room, names, colors and the win tally all survive)
function returnToLobby() {
  hideOverlay();
  draftEl.classList.remove('show');
  grid = null; run = null;
  enemies = []; eggs = []; projectiles = []; enemyBullets = []; traps = []; particles = [];
  if (net.mode === 'host') {
    players = [players[0]];
    players[0].idx = 0; players[0].left = false;
    net.conns.forEach((c, i) => {
      c._idx = i + 1;
      const np = makePlayer(i + 1);
      if (c._name) np.name = c._name;
      if (c._color) np.color = c._color;
      players.push(np);
      try { c.send({ t: 'welcome', idx: i + 1 }); } catch (e) {}
    });
    player = players[0];
    gameState = 'lobby';
    setBoardSize(20, 20);
    net.sendAll({ t: 'tolobby' });
    broadcastLobby();
  } else {
    players = []; player = null;
    gameState = 'title';
    setBoardSize(20, 20);
  }
}

// mode presets: HG is the crazy one (big board, 24 tributes, fast collapse)
function setMode(m) {
  const c = net.arenaCfg, b = net.botCfg;
  if (m === 'coop') { net.arenaOn = false; c.hg = false; b.n = Math.min(b.n, 7); }
  else if (m === 'arena') {
    const wasHg = c.hg;
    net.arenaOn = true; c.hg = false;
    if (wasHg) c.size = 19;
    if (c.hp === 4 && c.ammo === 4) { c.hp = 3; c.ammo = 5; }

function netHost() {
  if (typeof Peer === 'undefined') { netMsgTitle = 'PEERJS FAILED TO LOAD — CHECK INTERNET'; return; }
  netMsgTitle = null;
  players = [makePlayer(0)];
  players[0].name = myName || 'P1';
  players[0].color = COLORS[myColorIdx % COLORS.length];
  myIdx = 0; player = players[0];
  sessionWins = {};
  net.mode = 'host';
  net.code = Array.from({ length: 4 }, () =>
    'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');
  net.peer = new Peer('mcd-' + net.code, peerOpts());
  gameState = 'lobby';
  lobbyMsg = 'OPENING ROOM…';
  net.live = false;
  net.peer.on('open', () => {
    lobbyMsg = null;
    net.live = true;
    if (net.hostTimer) { clearTimeout(net.hostTimer); net.hostTimer = null; }
  });
  net.peer.on('disconnected', () => { try { net.peer.reconnect(); } catch (e) {} });
  net.peer.on('error', (err) => {
    if (err.type === 'unavailable-id') { try { net.peer.destroy(); } catch (e) {} netHost(); }
    else if (gameState === 'lobby' && lobbyMsg) netReset('NETWORK ERROR: ' + err.type);
  });
  net.hostTimer = setTimeout(() => {
    net.hostTimer = null;
    if (net.mode === 'host' && lobbyMsg)
      lobbyMsg = 'PEER NETWORK UNREACHABLE — ROOM NOT LIVE (still trying…)';
  }, 10000);
  net.peer.on('connection', (conn) => {
    const setup = () => {
      if (gameState !== 'lobby' || players.length >= MAX_PLAYERS) {
        try { conn.send({ t: 'busy' }); } catch (e) {}
        setTimeout(() => { try { conn.close(); } catch (e) {} }, 200);
        return;
      }
      const idx = players.length;
      const pl = makePlayer(idx);
      if (conn._name) pl.name = conn._name;
      players.push(pl);
      conn._idx = idx;
      net.conns.push(conn);
      conn.send({ t: 'welcome', idx });
      broadcastLobby();
    };
    conn.on('data', (m) => hostOnData(conn, m));
    conn.on('close', () => hostDropConn(conn));
    conn.on('error', () => hostDropConn(conn));
    // PeerJS can hand us a connection that is already open, in which case
    // 'open' never fires again — handle both paths
    if (conn.open) setup(); else conn.on('open', setup);
  });
}

function hostDropConn(conn) {
  if (!net.conns.includes(conn)) return;
  net.conns = net.conns.filter(c => c !== conn);
  if (gameState === 'lobby') {
    // rebuild roster so slots stay contiguous
    players = [players[0]];
    net.conns.forEach((c, i) => {
      c._idx = i + 1;
      const np = makePlayer(i + 1);
      if (c._name) np.name = c._name;
      players.push(np);
      try { c.send({ t: 'welcome', idx: i + 1 }); } catch (e) {}
    });
    broadcastLobby();
    return;
  }
  const pl = players[conn._idx];
  if (!pl) return;
  pl.left = true; pl.downed = true;
  fx('toast', 'A PLAYER LEFT');
  if (gameState === 'playing' && players.every(p => p.left || p.downed)) loseRun();
  if (gameState === 'draft' && players.every(p => p.left || draftPicked[p.idx])) {
    draftEl.classList.remove('show');
    startFloor(run.depth + 1);
  }
}

function hostOnData(conn, m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'hi') {
    conn._name = sanitizeName(m.name) || conn._name;
    const hp = players[conn._idx];
    if (hp) {
      if (conn._name) hp.name = conn._name;
      const want = COLORS[m.col];
      if (want && !players.some(p => p !== hp && p.color === want)) hp.color = want;
      conn._color = hp.color;
      broadcastLobby();
    }
    return;
  }
  const pl = players[conn._idx];
  if (!pl) return;
  if (m.t === 'color') {
    if (gameState === 'lobby') cycleColor(conn._idx);
    return;
  }
  if (m.t === 'move') {
    pl.lastSeq = m.seq | 0;
    if (gameState === 'playing' && !pl.downed &&
        (Math.abs(m.dx) + Math.abs(m.dy) === 1))
      movePlayer(pl, m.dx | 0, m.dy | 0);
  } else if (m.t === 'act') {
    if (gameState === 'playing' && !pl.downed && pl.acts.length < 4 &&
        ['poll', 'shoot', 'trap'].includes(m.a))
      pl.acts.push(m.a);
  } else if (m.t === 'pick') {
    if (gameState === 'draft')
      applyPick(conn._idx, m.i | 0, typeof m.drop === 'string' ? m.drop : null);
  }
}

function netJoin(code) {
  if (typeof Peer === 'undefined') { netMsgTitle = 'PEERJS FAILED TO LOAD — CHECK INTERNET'; return; }
  netMsgTitle = null;
  net.mode = 'guest';
  net.code = code;
  net.clockOff = null;
  mySeq = 0; gacc = 0; gTapQueue = [];
  gameState = 'lobby';
  lobbyMsg = 'CONNECTING…';
  let signalingUp = false;
  net.peer = new Peer(peerOpts());
  net.peer.on('open', () => {
    signalingUp = true;
    lobbyMsg = 'CONNECTING TO ROOM ' + code + '…';
    const c = net.peer.connect('mcd-' + code, { reliable: true });
    net.hostConn = c;
    const onOpen = () => {
      lobbyMsg = null;
      if (net.joinTimer) { clearTimeout(net.joinTimer); net.joinTimer = null; }
      c.send({ t: 'hi', name: myName, col: myColorIdx });
    };
    c.on('data', guestOnData);
    c.on('close', () => netReset('DISCONNECTED FROM HOST'));
    c.on('error', () => netReset('CONNECTION ERROR'));
    if (c.open) onOpen(); else c.on('open', onOpen);
  });
  net.peer.on('disconnected', () => { try { net.peer.reconnect(); } catch (e) {} });
  net.peer.on('error', (err) =>
    netReset(err.type === 'peer-unavailable' ? 'ROOM ' + code + ' NOT FOUND' : 'NETWORK ERROR: ' + err.type));
  net.joinTimer = setTimeout(() => {
    net.joinTimer = null;
    if (net.mode === 'guest' && gameState === 'lobby' && lobbyMsg)
      netReset(signalingUp
        ? 'FOUND NETWORK BUT NOT ROOM ' + code + ' — IS THE HOST LOBBY OPEN?'
        : 'PEER NETWORK UNREACHABLE — CHECK INTERNET/FIREWALL');
  }, 10000);
}

function guestOnData(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'welcome') { myIdx = m.idx; }
  else if (m.t === 'lobby') {
    lobbyCount = m.n; lobbyNames = m.names || []; lobbyMode = m.mode || 'coop';
    lobbyColors = m.colors || []; lobbyWins = m.wins || []; lobbyCfg = m.cfg || null;
    lobbyBots = { n: m.bots || 0, diff: m.bd || 'mixed', aggr: m.ba || 'mixed' };
    if (lobbyColors[myIdx]) saveColorPref(lobbyColors[myIdx]);
  }
  else if (m.t === 'busy') { netReset('ROOM IS FULL OR ALREADY IN A RUN'); }
  else if (m.t === 'start') {
    run = { seed: m.seed >>> 0, depth: 0,     // depth 0 → first snap rebuilds the floor
      arena: !!m.arena, cfg: m.arena || null, winner: -1,
      shrinkLevel: 0, shrinkNext: 0, regenNext: 0, regenList: [] };
    players = [];
    for (let i = 0; i < m.n; i++) players.push(makePlayer(i));
    player = players[myIdx];
    grid = null; conf = depthConf(1);
    enemies = []; eggs = []; projectiles = []; enemyBullets = []; traps = [];
    particles = [];
    mySeq = 0; gTapQueue = []; keys.clear();
    lastDraftSeq = -1;
    finalTime = 0;
    hideOverlay();
    draftEl.classList.remove('show');
    gameState = 'playing';
  }
  else if (m.t === 'tolobby') {
    hideOverlay();
    draftEl.classList.remove('show');
    grid = null; run = null;
    enemies = []; eggs = []; projectiles = []; enemyBullets = []; traps = []; particles = [];
    gameState = 'lobby';
    lobbyMsg = null;
    setBoardSize(20, 20);
  }
  else if (m.t === 'snap') applySnap(m);
}

// ---- snapshot encode/decode ----
// per-cell mixed radix: state(3) loot(4) marked(2) nearMega(2) num(9) mine(2) mega(2)
function encodeGrid() {
  let s = '';
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const t = grid[y][x];
      const st = t.crater ? (t.stale ? 3 : 2) : t.rev ? 1 : 0;
      const lo = t.loot === 'bullet' ? 1 : t.loot === 'heart' ? 2 : t.loot === 'egg' ? 3 : 0;
      const v = st + 4 * (lo + 4 * ((t.marked ? 1 : 0) + 2 * ((t.nearMega ? 1 : 0) +
        2 * (t.num + 9 * ((t.mine ? 1 : 0) + 2 * (t.mega ? 1 : 0))))));
      s += String.fromCharCode(48 + v);
    }
  return s;
}

function buildSnap() {
  return {
    t: 'snap', tick: simTick, gs: gameState, depth: run.depth,
    cols: COLS, rows: ROWS,
    grid: encodeGrid(),
    cr: encodeCrates(),
    tl: tilesLeft, ts: totalSafe, gt: gameTime, ft: finalTime,
    dp: draftPicked, ds: draftSeq,
    bc: borderCrack ? { x: borderCrack.x, y: borderCrack.y, t: borderCrack.t } : null,
    pl: players.map(p => ({ i: p.idx, c: p.color, nm: p.name, x: p.x, y: p.y,
      dx: p.dir.x, dy: p.dir.y, hp: p.hp, mh: p.maxHp, b: p.bullets,
      dn: p.downed ? 1 : 0, nd: p.noDraft ? 1 : 0, dl: p.draftLeft || 0,
      iu: p.iframeUntil, au: p.adrenalineUntil,
      pk: p.perks, sl: p.sapperLeft, ls: p.lastSeq, lf: p.left ? 1 : 0,
      tm: p.team, bt: p.bot ? 1 : 0, iq: p.iq, ag: Math.round(p.agg * 100), k: p.kills, pc: p.place })),
    aw: run.arena ? run.winner : -1,
    wn: sessionWins,
    sh: run.shrinkLevel || 0, sn: run.shrinkNext || 0,
    rg: run.regenList || [], rn: run.regenNext || 0,
    en: enemies.map(e => ({ id: e.id, ty: e.type, x: e.x, y: e.y, hp: e.hp,
      ow: e.owner === undefined ? -1 : e.owner,
      cs: e.chargeState || 0, cdx: e.chargeDir ? e.chargeDir.x : 0, cdy: e.chargeDir ? e.chargeDir.y : 0, ct: e.chargeStart || 0,
      ss: e.shootState || 0, sdx: e.shootDir ? e.shootDir.x : 0, sdy: e.shootDir ? e.shootDir.y : 0, st: e.shootStart || 0,
      ps: e.pyroState || 0, itx: e.igniteTarget ? e.igniteTarget.x : 0, ity: e.igniteTarget ? e.igniteTarget.y : 0, it: e.igniteStart || 0 })),
    eg: eggs.map(e => ({ id: e.id, x: e.x, y: e.y, t: e.t })),
    pr: projectiles.map(p => ({ x: p.x, y: p.y, dx: p.dx, dy: p.dy })),
    eb: enemyBullets.map(b => ({ x: b.x, y: b.y, dx: b.dx, dy: b.dy })),
    tr: traps.map(t => ({ x: t.x, y: t.y })),
    ev: net.events.splice(0),
  };
}

function applySnap(s) {
  if (!run) run = { seed: 0, depth: 0 };
  const newFloor = !grid || s.depth !== run.depth || s.cols !== COLS || s.rows !== ROWS;
  run.depth = s.depth;
  if (newFloor) {
    const np2 = players.filter(p => !p.left).length;
    conf = run.arena ? arenaConf(run.cfg, np2) : depthConf(s.depth, run.seed, np2);
    if (!run.arena && conf.gladiator)
      toasts.push({ text: '⚔ GLADIATOR DEPTH — SOLE SURVIVOR DRAFTS ×3', t: performance.now() });
    s.pl.forEach(sp => { if (players[sp.i]) players[sp.i].team = sp.tm | 0; });
    updateHudH();
    setBoardSize(s.cols, s.rows, true);
    grid = [];
    for (let y = 0; y < s.rows; y++) {
      grid[y] = [];
      for (let x = 0; x < s.cols; x++)
        grid[y][x] = { mine: false, mega: false, rev: false, crater: false,
          num: 0, nearMega: false, loot: null, rt: 0, marked: false, cv: -1 };
    }
    particles = []; enemies = []; eggs = []; projectiles = []; enemyBullets = []; traps = [];
  }
  // guest clock: anchor render time to the snapshot stream
  if (net.mode === 'guest') {
    const target = s.tick * TICK_MS - performance.now();
    net.clockOff = net.clockOff === null ? target : net.clockOff + (target - net.clockOff) * 0.15;
    net.snapSim = s.tick * TICK_MS;
    net.lastSnapWall = performance.now();
  }
  const gn = net.mode === 'guest' ? grNow() : simNow;

  let i = 0;
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++, i++) {
      let v = s.grid.charCodeAt(i) - 48;
      const t = grid[y][x];
      const st = v % 4; v = (v - st) / 4;
      const lo = v % 4; v = (v - lo) / 4;
      const mk = v % 2; v = (v - mk) / 2;
      const nm = v % 2; v = (v - nm) / 2;
      const num = v % 9; v = (v - num) / 9;
      const mine = v % 2; v = (v - mine) / 2;
      const mega = v % 2;
      const wasOpen = t.rev || t.crater;
      t.rev = st >= 1; t.crater = st >= 2;
      const wasStale = t.stale; t.stale = st === 3;
      if (t.stale && !wasStale) t.staleT = gn;
      if (!wasOpen && st >= 1) t.rt = gn;
      t.loot = lo === 1 ? 'bullet' : lo === 2 ? 'heart' : lo === 3 ? 'egg' : null;
      t.marked = !!mk; t.nearMega = !!nm; t.num = num;
      t.mine = !!mine; t.mega = !!mega;
    }
  (s.cr || []).forEach(c => {
    const t = grid[c[1]] && grid[c[1]][c[0]], pk = PERKS[c[2]];
    if (t && pk) { t.loot = 'perk'; t.perk = pk.id; }
  });

  s.pl.forEach(sp => {
    let pl = players[sp.i];
    if (!pl) { pl = makePlayer(sp.i); pl.fx = sp.x; pl.fy = sp.y; players[sp.i] = pl; }
    const isMe = sp.i === myIdx && net.mode === 'guest';
    if (!isMe) { pl.x = sp.x; pl.y = sp.y; pl.dir = { x: sp.dx, y: sp.dy }; }
    else if (sp.ls >= mySeq) { pl.x = sp.x; pl.y = sp.y; }
    pl.hp = sp.hp; pl.maxHp = sp.mh; pl.bullets = sp.b; pl.downed = !!sp.dn;
    pl.noDraft = !!sp.nd; pl.draftLeft = sp.dl || 0;
    pl.iframeUntil = sp.iu; pl.adrenalineUntil = sp.au;
    pl.perks = sp.pk || {}; pl.sapperLeft = sp.sl;
    pl.left = !!sp.lf; pl.color = sp.c; pl.lastSeq = sp.ls;
    pl.bot = !!sp.bt; pl.iq = sp.iq || 0; pl.agg = (sp.ag || 0) / 100;
    pl.kills = sp.k || 0; pl.place = sp.pc || 0; pl.team = sp.tm | 0;
    if (sp.nm) pl.name = sp.nm;
  });
  player = players[myIdx];

  const em = new Map(enemies.map(e => [e.id, e]));
  enemies = s.en.map(se => {
    let e = em.get(se.id);
    if (!e) e = { id: se.id, type: se.ty, x: se.x, y: se.y, fx: se.x, fy: se.y };
    e.type = se.ty; e.x = se.x; e.y = se.y; e.hp = se.hp;
    e.owner = se.ow === undefined ? -1 : se.ow;
    e.chargeState = se.cs || null;
    e.chargeDir = (se.cdx || se.cdy) ? { x: se.cdx, y: se.cdy } : null;
    e.chargeStart = se.ct;
    e.shootState = se.ss || null;
    e.shootDir = (se.sdx || se.sdy) ? { x: se.sdx, y: se.sdy } : null;
    e.shootStart = se.st;
    e.pyroState = se.ps || null;
    e.igniteTarget = se.ps ? { x: se.itx, y: se.ity } : null;
    e.igniteStart = se.it;
    return e;
  });
  eggs = s.eg;
  projectiles = s.pr;
  enemyBullets = s.eb;
  traps = s.tr;
  tilesLeft = s.tl; totalSafe = s.ts; gameTime = s.gt; finalTime = s.ft;
  draftPicked = s.dp || [];
  borderCrack = s.bc;
  if (s.wn) sessionWins = s.wn;
  if (run.arena) {
    run.winner = s.aw !== undefined ? s.aw : -1;
    run.shrinkLevel = s.sh || 0;
    run.shrinkNext = s.sn || 0;
    run.regenList = s.rg || [];
    run.regenNext = s.rn || 0;
  }

  const prev = gameState;
  gameState = s.gs;
  // a draft sequence number (not state transitions) drives the draft UI, so
  // back-to-back drafts with no 'playing' snapshot in between still rebuild
  if (gameState === 'draft' && s.ds !== undefined && s.ds !== lastDraftSeq) {
    lastDraftSeq = s.ds;
    buildDraft();
  } else if (gameState === 'draft' && s.ds === undefined && prev !== 'draft') buildDraft();
  if (prev === 'draft' && gameState !== 'draft') draftEl.classList.remove('show');
  if ((gameState === 'lost' || gameState === 'won') && prev !== gameState) showEnd(gameState === 'won');
  if ((gameState === 'playing' || gameState === 'draft') && (prev === 'lost' || prev === 'won')) hideOverlay();
  // multi-pick drafts (gladiator spoils): host confirmed our pick but more remain
  if (net.mode === 'guest' && gameState === 'draft' && draftWaiting &&
      draftPickPending > 0 && player && player.draftLeft === draftPickPending &&
      !draftPicked[myIdx]) {
    draftPickPending = -1;
    buildDraft();
  }

  (s.ev || []).forEach(e => {
    const [k, ...a] = e;
    if (FXR[k]) FXR[k](...a);
  });
}

// guest mini-tick: own move budget + prediction + input send
function guestTick() {
  if (gameState !== 'playing' || !player || player.downed || player.left || !grid) return;
  const gn = grNow();
  player.moveBudget = Math.min(1, player.moveBudget + TICK_MS / moveCd(player, gn));
  if (player.moveBudget >= 1) {
    const d = gTapQueue.shift() || heldDir();
    if (d) {
      player.moveBudget -= 1;
      player.dir = { x: d[0], y: d[1] };
      const nx = player.x + d[0], ny = player.y + d[1];
      if (ib(nx, ny) && grid[ny][nx].rev) { player.x = nx; player.y = ny; }
      net.sendHost({ t: 'move', seq: ++mySeq, dx: d[0], dy: d[1] });
    }
  }
}

// ---- LOOP ----
// Host/solo: fixed 20Hz sim via accumulator; host broadcasts a snapshot
// after each batch of ticks. Guest: no sim — snapshot-anchored render
// clock, 20Hz prediction/input tick, interpolation via updateFx.
function loop(ts) {
  let dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.25) dt = 0.25;
  if (net.mode === 'guest') {
    gacc += dt * 1000;
    while (gacc >= TICK_MS) { gacc -= TICK_MS; guestTick(); }
    const rn = grNow();
    acc = Math.max(0, Math.min(150, rn - net.snapSim));
    updateFx(dt, ts);
    render(rn, ts);
  } else {
    // every human is out of a bot-filled arena: fast-forward the rest
    specMode = !!(run && run.arena && gameState === 'playing' &&
      players.some(p => p.bot && !p.left && !p.downed) &&
      !players.some(p => !p.bot && !p.left && !p.downed));
    acc += dt * 1000 * (specMode && specFast ? 4 : 1);
    let ticked = false;
    while (acc >= TICK_MS) {
      acc -= TICK_MS;
      simTick++; simNow = simTick * TICK_MS;
      tick();
      ticked = true;
    }
    if (net.mode === 'host' && ticked && run && gameState !== 'lobby' && gameState !== 'title')
      net.sendAll(buildSnap());
    updateFx(dt, ts);
    render(simNow + acc, ts);
  }
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);

// Debug / headless-test hook (tests/mcrogue-smoke.js, console tinkering)
window.__mc = {
  get state() {
    const me = players[myIdx] || {};
    return {
      gameState,
      depth: run ? run.depth : 0,
      hp: me.hp || 0, maxHp: me.maxHp || 0, bullets: me.bullets || 0,
      perks: me.perks ? { ...me.perks } : {},
      tilesLeft, totalSafe,
      cols: COLS, rows: ROWS,
      enemies: enemies ? enemies.length : 0,
      eggs: eggs ? eggs.length : 0,
      players: players.length,
      arena: !!(run && run.arena),
      shrink: run ? (run.shrinkLevel || 0) : 0,
      winner: run && run.winner !== undefined ? run.winner : -1,
    };
  },
  get runState() { return run; },
  get grid() { return grid; },
  get simTick() { return simTick; },
  get keys() { return keys; },
  get draftChoices() { return draftChoices.map(p => p.id); },
  get conf() { return conf; },
  enterAbyss,
  startRun: startRunShared,
  startRunSeeded(s) { ensureSolo(); newRun(s >>> 0); },
  startArena(cfg) {
    players = [makePlayer(0), makePlayer(1)];
    myIdx = 0; player = players[0];
    newArena((Math.random() * 0xffffffff) >>> 0,
      cfg || { size: 11, pvp: true, pressure: 'shrink', perks: [] });
  },
  damagePlayerAt: (idx, n) => damagePlayer(players[idx], n, 'contact'),
  startFloor,
  pickPerk,
  movePlayer: (dx, dy) => movePlayer(players[myIdx], dx, dy),
  poll: () => poll(players[myIdx]),
  shoot: () => shoot(players[myIdx]),
  placeTrap: () => placeTrap(players[myIdx]),
  damagePlayer: (n, src) => damagePlayer(players[myIdx], n, src),
  moveCd: () => moveCd(players[myIdx], simNow),
  grantPerk(id) { players[myIdx].perks[id] = (players[myIdx].perks[id] || 0) + 1; },
  forceClear() { if (gameState === 'playing') { tilesLeft = 0; floorCleared(); } },
  spawnEnemy(type, x, y) { enemies.push(makeEnemy(type, x, y, simNow)); },
  killEnemyAt(x, y) {
    const e = enemies.find(e => !e.dead && e.x === x && e.y === y);
    if (e) { killEnemy(e, 'bullet', players[myIdx]); enemies = enemies.filter(en => !en.dead); }
  },
  buildSnap, applySnap,
  step(n) { for (let i = 0; i < n; i++) { simTick++; simNow = simTick * TICK_MS; tick(); } },
  startBots(mode, nBots, diff, aggr, cfg) {
    net.mode = null; net.botMatch = true;
    net.botCfg = { n: nBots, diff: diff || 'mixed', aggr: aggr || 'mixed' };
    Object.assign(net.arenaCfg, cfg || {});
    setMode(mode);
    net.botCfg.n = nBots;      // (the HG preset would otherwise force 23)
    if (cfg) Object.assign(net.arenaCfg, cfg);
    startRunShared();
  },
  get players() { return players; },
  get run() { return run; },
  get BK() { return BK; },
  get net() { return net; },
  get specMode() { return specMode; },
  get spec() { return { camSpec, camFree, specFast }; },
  renderNow() { camUpdate(0.05); render(simNow + 25, performance.now()); },
  movePlayerBy(i, dx, dy) { movePlayer(players[i], dx, dy); },
  get cam() { return { camX, camY, VC, VR, W, H, camTx, camTy, camMode }; },
  get shakeI() { return shake.i; },
  resetShake() { shake.i = 0; },
  fx: (...a) => fx(...a),
  cycleCam,
  get toasts() { return toasts; },
};
})();
  </script>
