      val *= 1.5 - agg * 0.6;                       // chill bots love loot
      if (li === pl.lootI && now < pl.lootUntil) val *= 1.5;   // stick with the pile you're walking to
      const sc = val / (d + 1.5);
      if (sc > bsc) { bsc = sc; bl = li; }
    }
    if (bl >= 0 && bsc > 0.35) {
      const st = firstStep(dm, bl);
      if (st) { if (bl !== pl.lootI) pl.lootI = bl; pl.lootUntil = now + 2500; return st; }
    }
  }

  // --- uncover tiles ------------------------------------------------------------
  const zoneBias = (x, y) => shrinking
    ? Math.max(0, run.shrinkLevel + 3 - edgeOf(x, y)) * (zoneSoon || forceDig ? 6 : 2.5) : 0;
  let oppDist = null;
  if (arena && agg >= 0.5 && opps.length)
    oppDist = (x, y) => opps.reduce((m, o) => Math.min(m, Math.abs(o.x - x) + Math.abs(o.y - y)), 99);

  let bSafe = null, bSafeC = 1e9;
  let bMine = null, bMineC = 1e9;
  const mineList = [];
  let bGuess = null, bGuessS = 1e9, bGuessR = 1;
  // candidates = unknown tiles bordering ground this bot can walk to (not every unknown tile on the board)
  if (!BK.seen || BK.seen.length !== COLS * ROWS) { BK.seen = new Int32Array(COLS * ROWS); BK.stamp = 0; }
  const stamp = ++BK.stamp;
  const cands = [];
  for (let qi = 0; qi < dm.n; qi++) {
    const c = dm.q[qi], cx = c % COLS, cy = (c / COLS) | 0;
    for (let d = 0; d < 4; d++) {
      const nx = cx + DX4[d], ny = cy + DY4[d];
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      const ni = ny * COLS + nx;
      if (BK.seen[ni] === stamp) continue;
      const nt = grid[ny][nx];
      if (nt.rev || nt.crater) continue;
      BK.seen[ni] = stamp;
      if (isVoid(nx, ny)) continue;
      cands.push(ni);
    }
  }
  for (const i of cands) {
    const tx = i % COLS, ty = (i / COLS) | 0;
    const t = grid[ty][tx];
    if (t.rev || t.crater) continue;
    const cl = BK.claim.get(i);
    if (cl && cl.by !== pl.idx && now - cl.t < 700) continue;
    if (shrinking && iq >= 1 && edgeOf(tx, ty) < safeEdge + 1) continue;
    const site = pollSite(tx, ty, dm, pl);
    if (!site) continue;
    let cost = site.cost + zoneBias(tx, ty);
    if (oppDist) cost -= 0.6 * agg * Math.max(0, 15 - oppDist(tx, ty));
    if (i === pl.goalI && now < pl.goalUntil) cost -= 3;      // commit to the current target
    if (iq === 0 && !K.safe[i] && !K.mine[i] && BK.lv[1].mine[i]) mineList.push({ i, tx, ty, site });   // desperation
    if (K.safe[i]) {
      if (cost < bSafeC) { bSafeC = cost; bSafe = { i, tx, ty, site }; }
    } else if (K.mine[i]) {
      if (iq >= 1) {
        mineList.push({ i, tx, ty, site });
        if (cost < bMineC) { bMineC = cost; bMine = { i, tx, ty, site }; }
      }
    } else {
      let risk, score;
      if (iq === 0) {
        risk = K.risk && K.risk[i] >= 0 ? K.risk[i] : BK.d0;
        score = risk * 14 + cost * 0.5 + Math.random() * 8;   // sloppy: risk matters, but only a bit
      }
      else {
        risk = K.risk && K.risk[i] >= 0 ? K.risk[i] : BK.d0;
        score = risk * 40 + cost * 0.6;
      }
      if (score < bGuessS) { bGuessS = score; bGuess = { i, tx, ty, site }; bGuessR = risk; }
    }
  }

  const go = (p) => {
    pl.goalI = p.i; pl.goalUntil = now + 2500;
    BK.claim.set(p.i, { by: pl.idx, t: now });
    pl.stall = 0;
    return botApproach(pl, dm, p.site, 'poll');
  };

  // pop a known mine from range (opens walled-in pockets, clears a stuck board)
  const mineShot = () => {
    let best = null;
    for (const m of mineList) {
      const rs = raySite(m.tx, m.ty, dm, pl);
      if (rs && (!best || rs.cost < best.rs.cost)) best = { m, rs };
    }
    return best;
  };

  if (bSafe) return go(bSafe);
  if (bMine && pl.sapperLeft > 0) return go(bMine);

  if (bGuess) {
    if (iq === 0) return go(bGuess);
    const th = (iq === 1 ? 0.27 : 0.2) + agg * 0.08;
    if (bGuessR <= th) return go(bGuess);
    // too risky to step up to — spend a bullet to find out from a distance
    const keep = pvp ? 2 : 1;   // always hold one bullet back
    if (pl.bullets > keep) {
      const rs = raySite(bGuess.tx, bGuess.ty, dm, pl);
      if (rs) { BK.claim.set(bGuess.i, { by: pl.idx, t: now }); pl.stall = 0; return botApproach(pl, dm, rs, 'shoot'); }
    }
    // a known mine blocking the way can be popped from range to open ground
    if (iq >= 2 && pl.bullets > keep + 1) {
      const ms = mineShot();
      if (ms) { BK.claim.set(ms.m.i, { by: pl.idx, t: now }); pl.stall = 0; return botApproach(pl, dm, ms.rs, 'shoot'); }
    }
    pl.stall = (pl.stall || 0) + 1;
    if (pl.stall > (iq === 1 ? 14 : 22) || (pl.hp >= 2 && bGuessR < 0.4)) return go(bGuess);
    if (near && nd <= 6) { const st = botFlee(pl, foes, dm, now); return st || botWander(pl); }
    return botIdle(pl, dm);
  }
  if (pl.bullets >= 1 && mineList.length) {
    const ms = mineShot();
    if (ms) { BK.claim.set(ms.m.i, { by: pl.idx, t: now }); return botApproach(pl, dm, ms.rs, 'shoot'); }
  }
  if (near && nd <= 6) { const st = botFlee(pl, foes, dm, now); return st || botWander(pl); }
  return botIdle(pl, dm);
}

function botThinkMs(pl) { return BOT_THINK[pl.iq] || 170; }

function botPhase(now) {
  let any = false, live = 0;
  for (const p of players) { if (p.left || p.downed) continue; live++; if (p.bot) any = true; }
  if (!any) return;
  botRefresh();
  if (live > 12) {
    BK.hash = new Map();
    for (const p of players) {
      if (p.left || p.downed) continue;
      const k = (p.y >> 3) * 512 + (p.x >> 3);
      const cell = BK.hash.get(k);
      if (cell) cell.push(p); else BK.hash.set(k, [p]);
    }
  } else BK.hash = null;
  for (const pl of players) {
    if (!pl.bot || pl.left || pl.downed) continue;
    pl.moveBudget = Math.min(1, pl.moveBudget + TICK_MS / moveCd(pl, now));
    // anti-dither: A-B-A-B inside a few seconds means two goals are fighting over
    // the bot — hold still for a beat (unless a monster or the collapse is on it)
    const pk = pl.x * 1000 + pl.y;
    if (pk !== pl.lastK) {
      pl.lastK = pk;
      const tr = pl.trail || (pl.trail = []);
      tr.push({ k: pk, t: now });
      if (tr.length > 4) tr.shift();
      if (tr.length === 4 && tr[0].k === tr[2].k && tr[1].k === tr[3].k && tr[3].t - tr[0].t < 3500) {
        pl.calmUntil = now + 1500;
        pl.trail = [];
      }
    }
    if (now >= pl.botWake) {
      pl.botWake = now + botThinkMs(pl) * (0.8 + Math.random() * 0.4);
      let d = botThink(pl, now);
      if (d && now < (pl.calmUntil || 0) && !pl.urgent) d = null;
      if (d) pl.botMove = d;
    }
    if (pl.botMove && pl.moveBudget >= 1) {
      movePlayer(pl, pl.botMove[0], pl.botMove[1]);
      pl.moveBudget -= 1;
      pl.botMove = null;
    }
  }
}

// ---------------------------------------------------------------------
// bot perk drafting (co-op)
// ---------------------------------------------------------------------
function perkScore(pl, p) {
  let s = BOT_PERK_W[p.id] || 3;
  if (['slayer', 'demo', 'bloodlust', 'dms', 'ricochet'].includes(p.id)) s += pl.agg * 3;
  if (['vest', 'medic', 'secondwind', 'blastsuit'].includes(p.id)) s += (1 - pl.agg) * 2;
  if (p.id === 'medic' && pl.hp >= pl.maxHp) s -= 3;
  if (p.stack && pl.perks[p.id]) s *= Math.pow(0.8, pl.perks[p.id]);
  return s;
}

function botsDraft() {
  if (net.mode === 'guest') return;
  players.forEach(pl => {
    if (!pl.bot || pl.left) return;
    let guard = 0;
    while (gameState === 'draft' && !draftPicked[pl.idx] && guard++ < 5) {
      const offers = computeOffers(pl.idx);
      const noise = pl.iq === 0 ? 6 : pl.iq === 1 ? 2 : 0.4;
      let best = -1, bs = -1e9;
      offers.forEach((p, i) => {
        const s = perkScore(pl, p) + Math.random() * noise;
        if (s > bs) { bs = s; best = i; }
      });
      if (best < 0) { applyPick(pl.idx, -1, null); continue; }
      let drop = null;
      if (perkCount(pl) >= MAX_PERKS) {
        let ws = 1e9;
        for (const p of PERKS) {
          if (!pl.perks[p.id]) continue;
          const s = perkScore(pl, p);
          if (s < ws) { ws = s; drop = p.id; }
        }
        if (bs <= ws) { applyPick(pl.idx, -1, null); continue; }
      }
      applyPick(pl.idx, best, drop);
    }
  });
}


// =====================================================================
// PERK CRATES (arena modes) — v0.24
// Perks that make sense in a last-one-standing match are lootable: scattered
// crates on the board, the feast / cornucopia, and a drop from every kill
// (the victim's best perk; their ammo stash scatters as before). A configurable cap limits builds;
// at the cap a crate swaps out your weakest perk only if it's better.
// =====================================================================
const CRATE_POOL = ['vest', 'medic', 'swift', 'bandolier', 'adrenaline', 'lucky', 'sixth',
  'pierce', 'demo', 'ricochet', 'blastsuit', 'secondwind', 'magnet'];
const CRATE_RARE = new Set(['pierce', 'demo', 'ricochet', 'blastsuit', 'secondwind', 'magnet']);
function perkById(id) { return PERKS.find(p => p.id === id) || null; }
function perkValue(id) { return (BOT_PERK_W[id] || 3) + (CRATE_RARE.has(id) ? 4 : 0); }
function arenaPerkCap() { return (run && run.arena && run.cfg && run.cfg.perkCap) || MAX_PERKS; }
function randCratePerk(rareBias) {
  const rare = Math.random() < (rareBias ? 0.7 : 0.38);
  const pool = CRATE_POOL.filter(id => CRATE_RARE.has(id) === rare);
  return pool[Math.floor(Math.random() * pool.length)];
}
// can this player take that crate right now? (and which perk would it replace)
function crateVerdict(pl, id) {
  const p = perkById(id);
  if (!p) return { ok: false, why: '?' };
  if (!p.stack && pl.perks[id]) return { ok: false, why: 'HAVE IT' };
  if (perkCount(pl) < arenaPerkCap()) return { ok: true, drop: null };
  let wid = null, wv = 1e9;
  for (const k of Object.keys(pl.perks)) { const v = perkValue(k); if (v < wv) { wv = v; wid = k; } }
  if (!wid || perkValue(id) <= wv) return { ok: false, why: 'BUILD FULL' };
  return { ok: true, drop: wid };
}
function takeCrate(pl, t, nx, ny) {
  const id = t.perk, v = crateVerdict(pl, id), p = perkById(id);
  if (!v.ok) { if (!pl.bot) fx('ptext', nx, ny, v.why, '#8b949e'); return; }
  if (v.drop) { removePerk(pl, v.drop); fx('ptext', nx, ny - 0.5, '-' + perkById(v.drop).tag, '#8b949e'); }
  pl.perks[id] = (pl.perks[id] || 0) + 1;
  if (id === 'vest') { pl.maxHp++; pl.hp = Math.min(pl.hp + 1, pl.maxHp); }
  if (id === 'medic') pl.hp = pl.maxHp;
  if (id === 'bandolier') pl.bullets += 4;
  t.loot = null; t.perk = null;
  fx('burst', nx, ny, p.clr);
  fx('ptext', nx, ny, '+' + p.tag, p.clr);
}
// put loot on the nearest free, open, non-void tile within 2 of (x, y)
function placeLoot(x, y, loot, perk) {
  for (let r = 0; r <= 2; r++)
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const nx = x + dx, ny = y + dy;
        if (!ib(nx, ny)) continue;
        const t = grid[ny][nx];
        if (!t.rev || t.crater || t.loot || t.mine || isVoid(nx, ny)) continue;
        t.loot = loot; t.perk = perk || null;
        fx('burst', nx, ny, loot === 'perk' ? perkById(perk).clr : '#ffd700');
        return true;
      }
  return false;
}
function dropKillLoot(pl) {
  if (!run || !run.arena || !run.cfg || run.cfg.killDrops === false) return;
  if (isVoid(pl.x, pl.y)) return;
  let best = null, bv = -1;
  for (const id of Object.keys(pl.perks)) {
    if (!CRATE_POOL.includes(id)) continue;
    const v = perkValue(id);
    if (v > bv) { bv = v; best = id; }
  }
  if (best) placeLoot(pl.x, pl.y, 'perk', best);   // (their ammo stash already scatters on death)
}
function spawnArenaCrates() {
  const cfg = (run && run.cfg) || {};
  const lv = cfg.crates || 'normal';
  const rate = { off: 0, few: 0.005, normal: 0.011, lots: 0.02 }[lv];
  if (!rate) return;
  // scale with the table too: roughly 0.5 / 1 / 2 crates per player (or by area, if bigger)
  const perPlayer = { few: 0.5, normal: 1, lots: 2 }[lv] * players.filter(p => !p.left).length;
  const cand = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const t = grid[y][x];
      if (!t.mine && !t.rev && !t.loot) cand.push(t);
    }
  const n = Math.min(cand.length, Math.max(3, Math.round(COLS * ROWS * rate), Math.round(perPlayer)));
  for (let k = 0; k < n; k++) {
    const t = cand.splice(Math.floor(Math.random() * cand.length), 1)[0];
    t.loot = 'perk'; t.perk = randCratePerk(false);
  }
}
function encodeCrates() {
  const out = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const t = grid[y][x];
      if (t.loot === 'perk') out.push([x, y, PERKS.findIndex(p => p.id === t.perk)]);
    }
  return out;
}

// ---- INPUT ----
function heldDir() {
  if (keys.has('w') || keys.has('arrowup')) return [0, -1];
  if (keys.has('s') || keys.has('arrowdown')) return [0, 1];
  if (keys.has('a') || keys.has('arrowleft')) return [-1, 0];
  if (keys.has('d') || keys.has('arrowright')) return [1, 0];
  return null;
}
function localTap(d) {
  if (net.mode === 'guest') { if (gTapQueue.length < 2) gTapQueue.push(d); }
  else if (player && player.taps.length < 2) player.taps.push(d);
}
function localAct(a) {
  if (net.mode === 'guest') net.sendHost({ t: 'act', a });
  else if (player && player.acts.length < 4) player.acts.push(a);
}

document.addEventListener('keydown', (e) => {
  if (document.activeElement === joinInput || document.activeElement === nameInput ||
      document.activeElement === endNameInput) return;
  const k = e.key.toLowerCase();
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','e','q'].includes(k))
    e.preventDefault();
  if (e.repeat) return;
  if (gameState === 'title') {
    if (joinEl.classList.contains('show')) return;
    const acfgT = document.getElementById('acfg');
    if (acfgT.classList.contains('show')) {
      if (k === 'escape') acfgT.classList.remove('show');
      else if (k === 'enter') { acfgT.classList.remove('show'); net.botMatch = true; startRunShared(); }
      return;
    }
    if (k === 'b') {
      e.preventDefault();
      if (!net.arenaOn && net.botCfg.n === 0) setMode('arena');
      renderSetup(); acfgT.classList.add('show');
      return;
    }
    if (k === 'h') { e.preventDefault(); showDialog('host'); return; }
    if (k === 'j') { e.preventDefault(); showDialog('join'); return; }
    if (k === 't') { webrtcSelfTest(); return; }
    net.botMatch = false;
    startRunShared();
    return;
  }
  if (gameState === 'lobby') {
    const acfgEl2 = document.getElementById('acfg');
    if (acfgEl2.classList.contains('show')) {
      if (k === 'escape') acfgEl2.classList.remove('show');
      return;
    }
    if (k === 'escape') { netReset(null); return; }
    if (k === 'enter' && net.mode === 'host') startRunShared();
    else if (k === 'v' && net.mode === 'host') {
      setMode(!net.arenaOn ? 'arena' : net.arenaCfg.hg ? 'coop' : 'hg'); saveSetup(); broadcastLobby();
    }
    else if (k === 'c' && net.mode === 'host') { renderSetup(); acfgEl2.classList.add('show'); }
    else if (k === 'x') {
      if (net.mode === 'host') cycleColor(myIdx);
      else net.sendHost({ t: 'color' });
    }
    return;
  }
  if (gameState === 'draft') {
    if (k === '1' || k === '2' || k === '3') pickPerk(+k - 1);
    else if (k === 'escape' && draftSwap >= 0) { draftSwap = -1; renderDraftSwap(); }
    return;
  }
  if (gameState !== 'playing') {
    if (k === 'r' && net.mode !== 'guest') { hideOverlay(); startRunShared(); }
    else if (k === 'enter' && gameState === 'won') enterAbyss();
    else if (k === 'l' && net.mode !== 'guest' && (gameState === 'won' || gameState === 'lost'))
      returnToLobby();
    return;
  }
  if (k === 'z') { cycleCam(); return; }
  if (player && player.downed) {                      // spectating
    if (k === 'f') { camFree = camFree ? null : { fx: camTx - 0.5, fy: camTy - 0.5 }; return; }
    if (k === 'x') { specFast = !specFast; return; }
    if (!camFree) {
      if (k === 'arrowright' || k === 'd' || k === '.') { specStep(1); return; }
      if (k === 'arrowleft' || k === 'a' || k === ',') { specStep(-1); return; }
      if (k === 'tab') { e.preventDefault(); specStep(e.shiftKey ? -1 : 1); return; }
    }
  }
  keys.add(k);
  const DKEY = { w: [0,-1], arrowup: [0,-1], s: [0,1], arrowdown: [0,1],
                 a: [-1,0], arrowleft: [-1,0], d: [1,0], arrowright: [1,0] };
  if (DKEY[k]) localTap(DKEY[k]);
  else if (k === ' ') localAct('poll');
  else if (k === 'e') localAct('shoot');
  else if (k === 'q') localAct('trap');
});
document.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

// =====================================================================
// SIM TICK — fixed 20Hz, host/solo only. No rendering, no wall clock.
// =====================================================================
function tick() {
  const dt = TICK_DT, now = simNow;
  if (gameState !== 'playing') return;
  playTicks++;
  gameTime = playTicks * TICK_DT;

  for (let i = explosionQueue.length - 1; i >= 0; i--) {
    if (now >= explosionQueue[i].time) {
      const eq = explosionQueue.splice(i, 1)[0];
      if (grid[eq.y][eq.x].mine)
        doExplosion(eq.x, eq.y, eq.by >= 0 ? players[eq.by] : null);
    }
  }
  if (explosionQueue.length === 0 && tilesLeft <= 0 && gameState === 'playing') floorCleared();
  if (gameState !== 'playing') return;

  // bots think + move (same move-budget rule as a human)
  botPhase(now);

  // queued actions (local player's + guests' via 'act' messages)
  players.forEach(pl => {
    if (pl.left || pl.downed) { pl.acts.length = 0; return; }
    while (pl.acts.length) {
      const a = pl.acts.shift();
      if (a === 'poll') poll(pl);
      else if (a === 'shoot') shoot(pl);
      else if (a === 'trap') placeTrap(pl);
    }
  });
  if (gameState !== 'playing') return;

  // local player movement via move budget (guests are client-driven: their
  // 'move' messages apply on arrival and are budget-limited on their end)
  const me = players[myIdx];
  if (me && !me.downed && !me.left) {
    me.moveBudget = Math.min(1, me.moveBudget + TICK_MS / moveCd(me, now));
    if (me.moveBudget >= 1) {
      const d = me.taps.shift() || heldDir();
      if (d) { movePlayer(me, d[0], d[1]); me.moveBudget -= 1; }
    }
  }
  if (gameState !== 'playing') return;

  // player bullets
  projectiles.forEach(p => {
    if (!p.active) return;
    p.x += p.dx * BULLET_SPEED * dt;
    p.y += p.dy * BULLET_SPEED * dt;
    let gx = Math.floor(p.x), gy = Math.floor(p.y);
    if (!ib(gx, gy)) {
      if (p.ricochet && !p.bounced) {
        p.bounced = true;
        p.dx = -p.dx; p.dy = -p.dy;
        p.x = Math.min(Math.max(p.x, 0.01), COLS - 0.01);
        p.y = Math.min(Math.max(p.y, 0.01), ROWS - 0.01);
        gx = Math.floor(p.x); gy = Math.floor(p.y);
      } else { p.active = false; return; }
    }
    if (run.arena && run.cfg && run.cfg.pvp) {
      const hitP = livePlayers().find(pl2 => pl2.idx !== p.owner && pl2.x === gx && pl2.y === gy &&
        !(teamsOn() && !run.cfg.ff && players[p.owner] && players[p.owner].team === pl2.team));
      if (hitP) { damagePlayer(hitP, 1, 'bullet', p.owner); p.active = false; return; }
    }
    if (p.slayer) {
      const foe = enemies.find(e => !e.dead && e.x === gx && e.y === gy &&
        !(e.type === 'burrower' && !grid[gy][gx].rev));
      if (foe) {
        if ((foe.hp || 1) > 1) {
          foe.hp--;
          fx('flash', (gx + 0.5) * TILE, (gy + 0.5) * TILE + HUD_H, '#ffffff', TILE * 0.8);
        } else {
          killEnemy(foe, 'bullet', players[p.owner]);
          enemies = enemies.filter(e => !e.dead);
        }
        p.active = false;
        return;
      }
    }
    if (p.eggcrush) {
      const egg = eggs.find(e => e.x === gx && e.y === gy);
      if (egg) killEgg(egg, players[p.owner]);
    }
    if (!grid[gy][gx].rev && !grid[gy][gx].crater) {
      if (p.demo) {
        reveal(gx, gy, players[p.owner]);
        for (const [ddx, ddy] of [[0,-1],[0,1],[-1,0],[1,0]]) reveal(gx + ddx, gy + ddy, players[p.owner]);
        p.active = false;
      } else {
        reveal(gx, gy, players[p.owner]);
        p.reveals++;
        const pierced = p.pierce && p.reveals < 2 && grid[gy][gx].rev && !grid[gy][gx].crater;
        if (!pierced) p.active = false;
      }
      fx('spark', p.x * TILE, p.y * TILE + HUD_H, '#ffd700');
    }
  });
  projectiles = projectiles.filter(p => p.active);
  if (gameState !== 'playing') return;

  // eggs hatch (type keyed by egg id: guests can derive it from the seed)
  eggs = eggs.filter(egg => {
    if (now - egg.t >= conf.hatch) {
      const etype = rollType(run.depth, keyedRng(run.seed, run.depth, egg.id, 1)());
      const ec = ENEMY_COLORS[etype] || ENEMY_COLORS.normal;
      enemies.push(makeEnemy(etype, egg.x, egg.y, now,
        egg.owner === undefined ? -1 : egg.owner));
      fx('burst', egg.x, egg.y, ec.body);
      return false;
    }
    return true;
  });

  // stall rescue (descent): a minute with no new tiles and nothing moving means
  // someone is walled in by mines with no ammo left to blast through
  if (!run.arena) {
    if (tilesLeft !== run.lastTiles) { run.lastTiles = tilesLeft; run.lastTilesAt = now; }
    else if (now - run.lastTilesAt > 60000) {
      run.lastTilesAt = now;
      const rc = [];
      for (let y = 0; y < ROWS; y++)
        for (let x = 0; x < COLS; x++) {
          const t = grid[y][x];
          if (t.rev && !t.crater && !t.loot) rc.push({ x, y });
        }
      for (let k = 0; k < 3 && rc.length; k++) {
        const pick = rc.splice(Math.floor(Math.random() * rc.length), 1)[0];
        grid[pick.y][pick.x].loot = 'bullet';
        fx('burst', pick.x, pick.y, '#ffd700');
      }
      fx('toast', 'SUPPLY DROP — THE MINES HOLD STILL');
    }
  }
  // Border spawn when the board goes quiet
  if (enemies.length === 0 && eggs.length === 0 && tilesLeft > 0) {
    if (borderCrack) {
      if (now - borderCrack.t > 2000) {
        const pick = borderCrack; borderCrack = null; borderSpawnTimer = 0;
        const pt = grid[pick.y][pick.x];
        if (!pt.rev && !pt.crater && !pt.mine) {
          pt.rev = true; pt.rt = now; pt.loot = null; pt.marked = false; tilesLeft--;
          fx('crack', (pick.x + 0.5) * TILE, (pick.y + 0.5) * TILE + HUD_H);
          spawnEgg(pick.x, pick.y);
          if (tilesLeft <= 0 && gameState === 'playing') floorCleared();
        }
      }
    } else {
      if (!borderSpawnTimer) { borderSpawnTimer = now; }
      else if (now - borderSpawnTimer > conf.borderQuiet) {
        const candidates = [];
        for (let y = 0; y < ROWS; y++)
          for (let x = 0; x < COLS; x++) {
            const t = grid[y][x];
            if (t.rev || t.crater || t.mine) continue;
            let adj = false;
            for (const [dx, dy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
              const nx = x + dx, ny = y + dy;
              if (ib(nx, ny) && grid[ny][nx].rev) { adj = true; break; }
            }
            if (adj) candidates.push({ x, y });
          }
        if (candidates.length) {
          const pick = candidates[Math.floor(Math.random() * candidates.length)];
          borderCrack = { x: pick.x, y: pick.y, t: now };
        }
      }
    }
  } else { borderSpawnTimer = 0; borderCrack = null; }
  if (gameState !== 'playing') return;

  // Charger charge updates (dash = one cell per tick, v2 §4b alignment)
  enemies.forEach(en => {
    if (en.dead || en.type !== 'charger' || !en.chargeState) return;
    if (en.chargeState === 'winding') {
      if (now - en.chargeStart > 600) en.chargeState = 'charging';
    } else if (en.chargeState === 'charging') {
      const nx = en.x + en.chargeDir.x, ny = en.y + en.chargeDir.y;
      if (!ib(nx, ny)) {
        en.chargeState = 'stunned'; en.stunStart = now;
        fx('spark', (en.x + 0.5) * TILE, (en.y + 0.5) * TILE + HUD_H, '#aa44ff');
        return;
      }
      players.forEach(pl => {
        if (!pl.left && !pl.downed && pl.x === nx && pl.y === ny) damagePlayer(pl, 1, 'contact', en.owner);
      });
      en.x = nx; en.y = ny;
      const t = grid[ny][nx];
      if (!t.rev && !t.crater) {
        if (t.mine) {
          killEnemy(en, 'self', null);
          reveal(nx, ny);
          return;
        }
        reveal(nx, ny);
      }
    } else if (en.chargeState === 'stunned') {
      if (now - en.stunStart > conf.espeed) {
        en.chargeState = null; en.chargeDir = null;
      }
    }
  });
  enemies = enemies.filter(e => !e.dead);
  if (gameState !== 'playing') return;

  // Pyro ignition
  enemies.forEach(en => {
    if (en.dead || en.type !== 'pyro' || en.pyroState !== 'igniting') return;
    const tgt = en.igniteTarget;
    if (!tgt || !grid[tgt.y][tgt.x].mine || grid[tgt.y][tgt.x].crater) {
      en.pyroState = null; en.igniteTarget = null;
      return;
    }
    if (now - en.igniteStart > 800) {
      en.pyroState = null;
      killEnemy(en, 'self', null);
      doExplosion(tgt.x, tgt.y);
    }
  });
  enemies = enemies.filter(e => !e.dead);
  if (gameState !== 'playing') return;

  // Shooter fire check
  enemies.forEach(en => {
    if (en.dead || en.type !== 'shooter') return;
    if (en.shootState === 'charging') {
      if (now - en.shootStart > 500) {
        en.shootState = null; en.lastShot = now;
        const dir = en.shootDir;
        enemyBullets.push({ x: en.x + 0.5, y: en.y + 0.5, dx: dir.x, dy: dir.y,
          active: true, own: en.owner });
        fx('flash', (en.x + 0.5) * TILE, (en.y + 0.5) * TILE + HUD_H, '#66aaff', TILE * 0.9);
      }
      return;
    }
    if (now - en.lastShot < 2500) return;
    for (const pl of livePlayers()) {
      if (run.arena && allyOf(en.owner, pl)) continue;
      const dx = pl.x - en.x, dy = pl.y - en.y;
      if ((dx !== 0 && dy !== 0) || (dx === 0 && dy === 0)) continue;
      en.shootState = 'charging';
      en.shootStart = now;
      en.shootDir = { x: Math.sign(dx), y: Math.sign(dy) };
      break;
    }
  });

  // Enemy bullets
  enemyBullets.forEach(b => {
    if (!b.active) return;
    b.x += b.dx * 12 * dt;
    b.y += b.dy * 12 * dt;
    const gx = Math.floor(b.x), gy = Math.floor(b.y);
    if (!ib(gx, gy)) { b.active = false; return; }
    const hit = livePlayers().find(pl => pl.x === gx && pl.y === gy &&
      !(run.arena && allyOf(b.own, pl)));
    if (hit) { damagePlayer(hit, 1, 'bullet', b.own); b.active = false; return; }
    if (!grid[gy][gx].rev && !grid[gy][gx].crater) {
      reveal(gx, gy); b.active = false;
      fx('spark', b.x * TILE, b.y * TILE + HUD_H, '#66aaff');
    }
  });
  enemyBullets = enemyBullets.filter(b => b.active);
  if (gameState !== 'playing') return;

  // Enemy movement — per-type brains. Enemies never block players;
  // overlap damage/theft is handled in the contact pass below.
  const occupied = new Set(enemies.map(e => e.x + ',' + e.y));
  enemies.forEach(en => {
    if (en.dead) return;
    if (en.type === 'charger' && en.chargeState) return;
    if (en.type === 'shooter' && en.shootState) return;
    if (en.type === 'pyro' && en.pyroState) return;
    if (now - en.lm < en.cd) return;
    en.lm = now;
    en.cd = conf.espeed * (SPEED_MUL[en.type] || 1) + (Math.random() - 0.5) * 200;
    occupied.delete(en.x + ',' + en.y);

    let target = null;
    if (en.type === 'burrower') target = burrowerStep(en, occupied);
    else if (en.type === 'magpie') target = magpieStep(en, now, occupied);
    else if (en.type === 'pyro') target = pyroStep(en, now, occupied);
    else if (en.type === 'brood') target = broodStep(en, now, occupied);
    else target = defaultStep(en, occupied, 0.3);

    if (target && !occupied.has(target.x + ',' + target.y)) {
      en.x = target.x; en.y = target.y;
    }
    occupied.add(en.x + ',' + en.y);

    if (en.type === 'magpie') {
      const t = grid[en.y][en.x];
      if (t.rev && t.loot) {
        t.loot = null;
        fx('ptext', (en.x + 0.5) * TILE, en.y * TILE + HUD_H, 'nom', '#cfd8ff');
      }
    }

    // Charger: check alignment to start winding
    if (en.type === 'charger' && !en.chargeState) {
      for (const pl of livePlayers()) {
        if (run.arena && allyOf(en.owner, pl)) continue;
        const dx = pl.x - en.x, dy = pl.y - en.y;
        if ((dx === 0) !== (dy === 0)) {
          en.chargeState = 'winding';
          en.chargeDir = { x: Math.sign(dx), y: Math.sign(dy) };
          en.chargeStart = now;
          break;
        }
      }
    }
  });

  // Brood egg-laying
  enemies.forEach(en => {
    if (en.dead || en.type !== 'brood') return;
    if (now - en.lastLay < 6000) return;
    en.lastLay = now;
    if (eggs.length >= 6) return;
    const t = grid[en.y][en.x];
    if (t.rev && !eggs.some(e => e.x === en.x && e.y === en.y)) {
      spawnEgg(en.x, en.y, en.owner);
      fx('burst', en.x, en.y, '#ff9e2c');
    }
  });

  // Traps
  if (traps.length) {
    traps = traps.filter(tr => {
      const victim = enemies.find(e => !e.dead && e.x === tr.x && e.y === tr.y &&
        !(e.type === 'burrower' && !grid[e.y][e.x].rev));
      if (victim) {
        fx('flash', (tr.x + 0.5) * TILE, (tr.y + 0.5) * TILE + HUD_H, '#7dff9a', TILE * 1.3);
        killEnemy(victim, 'trap', players[tr.owner]);
        return false;
      }
      return true;
    });
    enemies = enemies.filter(e => !e.dead);
  }

  // Magnet: pull loot within 2 tiles of each magnet owner
  players.forEach(pl => {
    if (pl.left || pl.downed || !pl.perks.magnet) return;
    for (let mdy = -2; mdy <= 2; mdy++)
      for (let mdx = -2; mdx <= 2; mdx++) {
        if (!mdx && !mdy) continue;
        const nx = pl.x + mdx, ny = pl.y + mdy;
        if (!ib(nx, ny)) continue;
        const t = grid[ny][nx];
        if (!t.rev || !t.loot || t.loot === 'perk') continue;
        if (t.loot === 'heart' && pl.hp >= pl.maxHp) continue;
        const loot = t.loot;
        t.loot = null;
        if (loot === 'bullet') {
          pl.bullets += 1 + (pl.perks.bandolier || 0);
          if (pl.bullets >= 12 && pl.idx === myIdx) award('hoard');
        } else if (loot === 'heart') pl.hp = Math.min(pl.maxHp, pl.hp + 1);
        fx('streak', (nx + 0.5) * TILE, (ny + 0.5) * TILE + HUD_H,
          (pl.x + 0.5) * TILE, (pl.y + 0.5) * TILE + HUD_H,
          loot === 'heart' ? '#ff6b6b' : '#ffd700');
      }
  });

  // Contact pass: overlap = damage (or magpie theft); never blocks movement
  enemies.forEach(e => {
    if (e.dead) return;
    for (const pl of livePlayers()) {
      if (e.x !== pl.x || e.y !== pl.y) continue;
      if (run.arena && allyOf(e.owner, pl)) continue;   // loyal to its uncoverer (and its team)
      if (e.type === 'magpie') {
        if (now >= e.stealCd) {
          e.stealCd = now + 2000;
          e.fleeUntil = now + 3000;
          const steal = Math.min(2, pl.bullets);
          if (steal > 0) {
            pl.bullets -= steal;
            fx('ptext', (pl.x + 0.5) * TILE, pl.y * TILE + HUD_H, '-' + steal + '◆', '#ffd700');
          }
        }
      } else damagePlayer(pl, 1, 'contact', e.owner);
    }
  });
  enemies = enemies.filter(e => !e.dead);

  // ---- arena pressure + last-one-standing ----
  if (run.arena && gameState === 'playing') {
    const cfgA = run.cfg || {};
    if (cfgA.pressure === 'regen') {
      // re-bury batches of cleared ground (telegraphed 3s ahead)
      if (!run.regenList.length && now >= run.regenNext - 3000) {
        const rcand = [];
        for (let y = 0; y < ROWS; y++)
          for (let x = 0; x < COLS; x++) {
            const t = grid[y][x];
            if (!t.rev || t.crater || t.loot) continue;
            if (players.some(p => !p.left && !p.downed &&
              Math.max(Math.abs(p.x - x), Math.abs(p.y - y)) <= 2)) continue;
            if (enemies.some(e => e.x === x && e.y === y)) continue;
            if (eggs.some(e => e.x === x && e.y === y)) continue;
            if (traps.some(tr => tr.x === x && tr.y === y)) continue;
            rcand.push({ x, y });
          }
        // land comes back in contiguous blobs, not scattered one-offs:
        // pick a seed, flood-grow through eligible neighbors, repeat
        const candSet = new Set(rcand.map(c2 => c2.x + ',' + c2.y));
        const target = Math.max(6, Math.round(COLS * ROWS * 0.05));
        const blobMax = Math.max(4, Math.ceil(target / 2));
        const picked = [];
        while (picked.length < target && candSet.size) {
          const keys2 = [...candSet];
          const frontier = [keys2[Math.floor(Math.random() * keys2.length)]];
          let blob = 0;
          while (frontier.length && picked.length < target && blob < blobMax) {
            const k2 = frontier.splice(Math.floor(Math.random() * frontier.length), 1)[0];
            if (!candSet.has(k2)) continue;
            candSet.delete(k2);
            const [bx, by] = k2.split(',').map(Number);
            picked.push({ x: bx, y: by });
            blob++;
            for (const [ddx, ddy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
              const nk = (bx + ddx) + ',' + (by + ddy);
              if (candSet.has(nk)) frontier.push(nk);
            }
          }
        }
        run.regenList = picked;
      }
      if (run.regenList.length && now >= run.regenNext) {
        run.regenList.forEach(c2 => {
          const t = grid[c2.y][c2.x];
          if (!t.rev || t.crater) return;
          if (players.some(p => !p.left && p.x === c2.x && p.y === c2.y)) return;
          if (enemies.some(e => e.x === c2.x && e.y === c2.y)) return;
          t.rev = false; t.rt = 0; t.loot = null; t.marked = false;
          t.mine = Math.random() < 0.3;
          t.mega = t.mine && Math.random() < 0.12;
        });
        recomputeNums();
        totalSafe = 0; tilesLeft = 0;
        for (let y = 0; y < ROWS; y++)
          for (let x = 0; x < COLS; x++) {
            if (!grid[y][x].mine) { totalSafe++; if (!grid[y][x].rev) tilesLeft++; }
          }
        run.regenList = [];
        run.regenNext = now + 18000;
        fx('toast', 'THE MINES REGROW');
      }
    } else {
      // the arena collapses ring by ring (telegraphed 3s ahead)
      const maxShrink = (Math.min(COLS, ROWS) >> 1) - 1;
      if (run.shrinkLevel < maxShrink && now >= run.shrinkNext) {
        run.shrinkLevel++;
        run.shrinkNext = now + shrinkTimes(run.cfg)[1];
        for (let y = 0; y < ROWS; y++)
          for (let x = 0; x < COLS; x++) {
            if (edgeOf(x, y) !== run.shrinkLevel - 1) continue;
            const t = grid[y][x];
            t.loot = null; t.marked = false;
            if (t.mine) { t.mine = false; t.mega = false; }
          }
        eggs.slice().forEach(e => { if (edgeOf(e.x, e.y) < run.shrinkLevel) killEgg(e, null); });
        recomputeNums();
        shake.i = Math.max(shake.i, 12);
        fx('toast', 'THE ARENA COLLAPSES');
      }
      if (run.shrinkLevel > 0) {
        livePlayers().forEach(pl => {
          if (edgeOf(pl.x, pl.y) < run.shrinkLevel) damagePlayer(pl, 1, 'void');
        });
        enemies.forEach(e => {
          if (!e.dead && edgeOf(e.x, e.y) < run.shrinkLevel) killEnemy(e, 'self', null);
        });
        enemies = enemies.filter(e => !e.dead);
      }
    }
    // sudden death: once the board has collapsed to its core (or the round drags
    // on forever) everyone standing slowly bleeds, so a standoff always ends
    {
      const lastRing = (Math.min(COLS, ROWS) >> 1) - 1;
      const core = cfgA.pressure !== 'regen' && run.shrinkLevel >= lastRing;
      if (core && !run.sdAt) run.sdAt = now + 30000;
      if (!run.sdAt && gameTime > 480) run.sdAt = now;
      if (run.sdAt && now >= run.sdAt && now >= (run.sdNext || 0)) {
        if (!run.sdNext) fx('toast', 'SUDDEN DEATH');
        run.sdNext = now + 4000;
        livePlayers().forEach(pl => damagePlayer(pl, 1, 'void'));
      }
    }
    // hunger games: the feast — a big loot drop at the cornucopia
    if (cfgA.hg && cfgA.feast !== false && !run.feastDone && now >= run.feastAt) {
      run.feastDone = true;
      const mx = COLS >> 1, my = ROWS >> 1;
      const fc = [];
      for (let y = Math.max(0, my - 7); y <= Math.min(ROWS - 1, my + 7); y++)
        for (let x = Math.max(0, mx - 7); x <= Math.min(COLS - 1, mx + 7); x++) {
          const t = grid[y][x];
          if (!t.rev || t.loot || t.crater) continue;
          if (cfgA.pressure !== 'regen' && edgeOf(x, y) < run.shrinkLevel) continue;
          fc.push({ x, y });
        }
      for (let k = 0; k < 14 && fc.length; k++) {
        const pick = fc.splice(Math.floor(Math.random() * fc.length), 1)[0];
        if ((cfgA.crates || 'normal') !== 'off' && k >= 3 && k < 7) {
          grid[pick.y][pick.x].loot = 'perk'; grid[pick.y][pick.x].perk = randCratePerk(true);
        } else grid[pick.y][pick.x].loot = k < 3 ? 'heart' : 'bullet';
        fx('burst', pick.x, pick.y, k < 3 ? '#ff6b6b' : '#ffd700');
      }
      fx('toast', 'THE FEAST BEGINS AT THE CORNUCOPIA');
    }
    // anti-stalemate: very late in a round, ammo starts raining onto
    // revealed ground — race for it or watch your opponent arm up
    if (gameTime > ARENA_DROP_AT && now >= (run.dropNext || 0)) {
      run.dropNext = now + ARENA_DROP_EVERY;
      if (!run.dropsOn) { run.dropsOn = true; fx('toast', 'SUPPLY DROPS INBOUND'); }
      const alive2 = players.filter(p => !p.left && !p.downed);
      const dcand = [];
      for (let y = 0; y < ROWS; y++)
        for (let x = 0; x < COLS; x++) {
          const t = grid[y][x];
          if (!t.rev || t.loot) continue;
          if (cfgA.pressure !== 'regen' && edgeOf(x, y) < run.shrinkLevel) continue;
          if (players.some(p => !p.left && !p.downed && p.x === x && p.y === y)) continue;
          dcand.push({ x, y });
        }
      for (let k = 0; k < Math.max(1, Math.ceil(alive2.length / 2)) && dcand.length; k++) {
        const pick = dcand.splice(Math.floor(Math.random() * dcand.length), 1)[0];
        grid[pick.y][pick.x].loot = 'bullet';
        fx('burst', pick.x, pick.y, '#ffd700');
      }
    }

    const alive = players.filter(p => !p.left && !p.downed);
    if (teamsOn() ? new Set(alive.map(p => p.team)).size <= 1 : alive.length <= 1)
      arenaEnd(alive.length ? alive[0].idx : -1);
  }
}

// ---- COSMETIC UPDATE (frame-rate, wall-clock; never touches sim state) ----
function updateFx(dt, wall) {
  if (gameState === 'title' || gameState === 'lobby') return;
  camUpdate(dt);
  players.forEach(pl => {
    const lp = 1 - Math.exp(-15 * dt);
    pl.fx += (pl.x - pl.fx) * lp;
    pl.fy += (pl.y - pl.fy) * lp;
    if (Math.abs(pl.x - pl.fx) < 0.01) pl.fx = pl.x;
    if (Math.abs(pl.y - pl.fy) < 0.01) pl.fy = pl.y;
  });
  const lp = 1 - Math.exp(-15 * dt);
  enemies.forEach(e => {
    e.fx += (e.x - e.fx) * lp;
    e.fy += (e.y - e.fy) * lp;
    if (Math.abs(e.x - e.fx) < 0.01) e.fx = e.x;
    if (Math.abs(e.y - e.fy) < 0.01) e.fy = e.y;
    // locally-generated ambience (host and guest alike): dig rumble, dash trail
    if (grid && e.type === 'burrower' && ib(e.x, e.y) && !grid[e.y][e.x].rev && Math.random() < dt * 10) {
      const dpx = (e.x + 0.5) * TILE, dpy = (e.y + 0.5) * TILE + HUD_H;
      particles.push({ x: dpx + (Math.random() - 0.5) * 14, y: dpy + (Math.random() - 0.5) * 14,
        vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 30,
        life: 0.35, ml: 0.35, clr: Math.random() > 0.5 ? '#5a4630' : '#2d333b',
        sz: 2 + Math.random() * 2 });
    }
    if (e.type === 'charger' && e.chargeState === 'charging' && Math.random() < dt * 30) {
      particles.push({ x: (e.fx + 0.5) * TILE, y: (e.fy + 0.5) * TILE + HUD_H,
        vx: 0, vy: 0, life: 0.2, ml: 0.2, clr: '#aa44ff60', sz: 8, flash: true });
    }
  });
  particles.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94; p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 1500) particles.splice(0, particles.length - 1500);
  if (shake.i > 0.5) {
    shake.x = (Math.random() - 0.5) * shake.i * 2;
    shake.y = (Math.random() - 0.5) * shake.i * 2;
    shake.i *= Math.exp(-8 * dt);
  } else { shake.i = 0; shake.x = 0; shake.y = 0; }
  toasts = toasts.filter(t => wall - t.t < (t.life || 3000));
}

// ---- PERK CRATE DRAWING / RIVAL INFO ----
function drawCrate(x, y, now, t) {
  const p = perkById(t.perk);
  if (!p) return;
  const cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2 + HUD_H;
  // "close only" mode: from afar every crate is an anonymous '?'
  const hidden = !!(run && run.cfg && run.cfg.crateMode === 'near' &&
    Math.hypot(x + 0.5 - camTx, y + 0.5 - camTy) > 3.5);
  const rare = !hidden && CRATE_RARE.has(p.id);
  const clr = hidden ? '#d9c27a' : p.clr;
  const pulse = 0.75 + Math.sin(now / 260 + x * 1.3 + y) * 0.25;
  ctx.save();
  ctx.translate(cx, cy);
  if (rare) { ctx.shadowBlur = 8 + 8 * pulse; ctx.shadowColor = clr; }
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(-10, -10, 20, 20);
  ctx.strokeStyle = clr;
  ctx.lineWidth = rare ? 2.5 : 1.5;
  ctx.strokeRect(-10, -10, 20, 20);
  if (rare) { ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 1; ctx.strokeRect(-7, -7, 14, 14); }
  ctx.shadowBlur = 0;
  ctx.fillStyle = clr;
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(hidden ? '?' : p.tag, 0, 1);
  ctx.restore();
}
function drawFloaters(wall) {
  floaters = floaters.filter(f => wall - f.t < 1300);
  if (!floaters.length) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 12px Courier New';
  floaters.forEach(f => {
    const a = (wall - f.t) / 1300;
    ctx.globalAlpha = Math.max(0, 1 - a * a);
    ctx.fillStyle = f.clr;
    ctx.fillText(f.text, f.x, f.y - 8 - a * 26);
  });
  ctx.restore();
}
// the nearest rival's loadout, spelled out (pips on the board show it at a glance)
function drawRivalPanel(now) {
  if (!run || !run.arena || gameState !== 'playing' || !grid) return;
  let best = null, bd = 9;
  players.forEach(p => {
    if (p.left || p.downed || p === player) return;
    const d = Math.hypot(p.fx + 0.5 - camTx, p.fy + 0.5 - camTy);
    if (d < bd) { bd = d; best = p; }
  });
  if (!best) return;
  const lines = Object.keys(best.perks).slice(0, 6).map(id => {
    const pk = perkById(id);
    return { c: pk ? pk.clr : '#aaa', t: (pk ? pk.tag + ' ' + pk.name : id) + (best.perks[id] > 1 ? ' ×' + best.perks[id] : '') };
  });
  if (!lines.length) lines.push({ c: '#586069', t: 'NO UPGRADES' });
  const wpx = 200, hpx = 24 + lines.length * 12, x0 = 8, y0 = H - hpx - 8;
  ctx.save();
  ctx.fillStyle = '#0d1117d8'; ctx.fillRect(x0, y0, wpx, hpx);
  ctx.strokeStyle = best.color; ctx.lineWidth = 1; ctx.strokeRect(x0 + 0.5, y0 + 0.5, wpx - 1, hpx - 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 11px Courier New';
  ctx.fillStyle = best.color; ctx.fillText((best.bot ? '⚙' : '') + best.name.toUpperCase(), x0 + 8, y0 + 11);
  ctx.fillStyle = '#ff6b6b'; ctx.fillText('♥' + Math.ceil(best.hp) + '/' + best.maxHp, x0 + 118, y0 + 11);
  ctx.fillStyle = '#ffd700'; ctx.fillText('◆' + best.bullets, x0 + 164, y0 + 11);
  ctx.font = '10px Courier New';
  lines.forEach((l, i) => { ctx.fillStyle = l.c; ctx.fillText(l.t, x0 + 8, y0 + 27 + i * 12); });
  ctx.restore();
}

// ---- CAMERA ----
// who you can watch once you're out: teammates first, then other humans, then bots
function spectateList() {
  const rank = p => (teamsOn() && player && p.team === player.team) ? 0 : p.bot ? 2 : 1;
  return players.filter(p => !p.left && !p.downed && p !== player)
    .sort((a, b) => (rank(a) - rank(b)) || (a.idx - b.idx));
}
function specStep(dir) {
  const list = spectateList();
  if (!list.length) return;
  camFree = null;
  const i = list.findIndex(p => p.idx === camSpec);
  camSpec = list[(i + dir + list.length) % list.length].idx;
}
function camTarget() {
  if (player && !player.downed && !player.left) { camFree = null; return player; }
  if (camFree) return camFree;
  const alive = spectateList();
  if (!alive.length) return player || { fx: COLS / 2, fy: ROWS / 2 };
  let cur = alive.find(p => p.idx === camSpec);
  if (!cur) {
    // default: the best-ranked group (teammates, else humans, else bots), nearest first
    const rank = p => (teamsOn() && player && p.team === player.team) ? 0 : p.bot ? 2 : 1;
    const r0 = rank(alive[0]);
    let bd = 1e9;
    alive.filter(p => rank(p) === r0).forEach(p => {
      const d = Math.hypot(p.fx - camTx, p.fy - camTy);
      if (d < bd) { bd = d; cur = p; }
    });
    camSpec = cur.idx;
  }
  return cur;
}
function camUpdate(dt) {
  if (!grid) return;
  if (camFree && player && player.downed) {          // free camera: WASD / arrows pan
    const sp = 16 * dt;
    if (keys.has('w') || keys.has('arrowup')) camFree.fy -= sp;
    if (keys.has('s') || keys.has('arrowdown')) camFree.fy += sp;
    if (keys.has('a') || keys.has('arrowleft')) camFree.fx -= sp;
    if (keys.has('d') || keys.has('arrowright')) camFree.fx += sp;
    camFree.fx = Math.max(0, Math.min(COLS - 1, camFree.fx));
    camFree.fy = Math.max(0, Math.min(ROWS - 1, camFree.fy));
  }
  const t = camTarget();
  camTx = t.fx + 0.5; camTy = t.fy + 0.5;
  const wantX = Math.max(0, Math.min(COLS * TILE - W, camTx * TILE - W / 2));
  const viewH = H - HUD_H;
  const wantY = Math.max(0, Math.min(ROWS * TILE - viewH, camTy * TILE - viewH / 2));
  if (camSnap) { camX = wantX; camY = wantY; camSnap = false; return; }
  const lp = 1 - Math.exp(-12 * dt);
  camX += (wantX - camX) * lp; camY += (wantY - camY) * lp;
}
function setCam(m) {
  camMode = m;
  try { localStorage.setItem('mcrogue-cam', camMode); } catch (e) {}
  if (run && grid && (gameState === 'playing' || gameState === 'draft'))
    setBoardSize(COLS, ROWS, 'cam');
}
function cycleCam() {
  const order = ['auto', 'full', 'follow', 'close'];
  setCam(order[(order.indexOf(camMode) + 1) % order.length]);
  toasts.push({ text: 'CAMERA: ' + camMode.toUpperCase() + (camMode === 'auto' ? ' (follows on big boards)' : ''),
    t: performance.now() });
}
// explosions across a big map shouldn't rattle your screen: full strength
// within 6 tiles of the player you're watching, fading to nothing by ~22
function shakeAt(tx, ty, amt) {
  const d = Math.hypot(tx + 0.5 - camTx, ty + 0.5 - camTy);
  const f = d <= 6 ? 1 : Math.max(0, 1 - (d - 6) / 16);
  shake.i = Math.max(shake.i, amt * f * f);
}
function shakeAtPx(px, py, amt) { shakeAt(px / TILE - 0.5, (py - HUD_H) / TILE - 0.5, amt); }

function drawCamOverlay(now) {
  if (!grid || !(VC < COLS || VR < ROWS)) return;
  if (gameState === 'title' || gameState === 'lobby') return;
  const cx = W / 2, cy = HUD_H + (H - HUD_H) / 2;
  // off-screen arrows: nearest rivals (their color) and monsters (red)
  const items = [];
  players.forEach(p => {
    if (p.left || p.downed || p === player) return;
    const al = teamsOn() && player && p.team === player.team;     // teammates: white, and always findable
    items.push({ x: p.fx, y: p.fy, c: al ? '#ffffff' : p.color, k: al ? 2 : 1 });
  });
  enemies.forEach(e => items.push({ x: e.fx, y: e.fy, c: '#ff2d55', k: 0 }));
  const cand = [];
  for (const it of items) {
    const sx = (it.x + 0.5) * TILE - camX, sy = (it.y + 0.5) * TILE + HUD_H - camY;
    if (sx >= 0 && sx <= W && sy >= HUD_H && sy <= H) continue;
    const d = Math.hypot(it.x + 0.5 - camTx, it.y + 0.5 - camTy);
    if (d > (it.k === 2 ? 90 : it.k ? 24 : 12)) continue;
    cand.push({ it, sx, sy, d });
  }
  cand.sort((a, b) => ((b.it.k === 2) - (a.it.k === 2)) || (a.d - b.d));
  ctx.save();
  cand.slice(0, 10).forEach(({ it, sx, sy }) => {
    const dx = sx - cx, dy = sy - cy;
    const s = Math.min((W / 2 - 14) / Math.max(1, Math.abs(dx)), ((H - HUD_H) / 2 - 14) / Math.max(1, Math.abs(dy)));
    const ax = cx + dx * s, ay = cy + dy * s, a = Math.atan2(dy, dx), r = it.k === 2 ? 10 : it.k ? 8 : 6;
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = it.c;
    ctx.beginPath();
    ctx.moveTo(ax + Math.cos(a) * r, ay + Math.sin(a) * r);
    ctx.lineTo(ax + Math.cos(a + 2.5) * r, ay + Math.sin(a + 2.5) * r);
    ctx.lineTo(ax + Math.cos(a - 2.5) * r, ay + Math.sin(a - 2.5) * r);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();
  // minimap
  const mp = Math.max(1, Math.floor(132 / Math.max(COLS, ROWS)));
  const mw = COLS * mp, mh = ROWS * mp, x0 = W - mw - 8, y0 = H - mh - 8;
  ctx.save();
  ctx.fillStyle = '#0d1117d0';
  ctx.fillRect(x0 - 3, y0 - 3, mw + 6, mh + 6);
  const wallNow = performance.now();
  if (!mmCache || mmCache.width !== mw || mmCache.height !== mh) {
    mmCache = document.createElement('canvas'); mmCache.width = mw; mmCache.height = mh; mmStamp = 0;
  }
  if (wallNow - mmStamp > 200) {          // repaint ~5x/s instead of every frame
    mmStamp = wallNow;
    const mc2 = mmCache.getContext('2d');
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++) {
        const t = grid[y][x];
        mc2.fillStyle = t.rev && t.loot === 'perk' ? '#ffd700'
          : isVoid(x, y) ? '#5a0f1a' : t.crater && !t.stale ? '#07090c' : t.rev ? '#3b4654' : '#1a2028';
        mc2.fillRect(x * mp, y * mp, mp, mp);
      }
  }
  ctx.drawImage(mmCache, x0, y0);
  ctx.fillStyle = '#ff2d55';
  enemies.forEach(e => ctx.fillRect(x0 + Math.round(e.fx) * mp, y0 + Math.round(e.fy) * mp, mp, mp));
  const ds = Math.max(3, mp + 1);
  players.forEach(p => {
    if (p.left || p.downed) return;
    ctx.fillStyle = p.color;
    ctx.fillRect(x0 + p.fx * mp + mp / 2 - ds / 2, y0 + p.fy * mp + mp / 2 - ds / 2, ds, ds);
    if (p === player || (teamsOn() && player && p.team === player.team)) {
      ctx.strokeStyle = p === player ? '#ffffff' : '#ffffffaa'; ctx.lineWidth = 1;
      ctx.strokeRect(x0 + p.fx * mp + mp / 2 - ds / 2 - 1, y0 + p.fy * mp + mp / 2 - ds / 2 - 1, ds + 2, ds + 2);
    }
  });
  ctx.strokeStyle = '#ffffff90'; ctx.lineWidth = 1;
  ctx.strokeRect(x0 + (camX / TILE) * mp, y0 + (camY / TILE) * mp, VC * mp, VR * mp);
  ctx.restore();
}

// ---- RENDER ----
// `now` is smoothed sim time (host: simNow+acc; guest: snapshot-anchored
// clock); `wall` is the rAF clock, used only for pure-UI animation.
function render(now, wall) {
  ctx.save();
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  if (gameState === 'title') { drawTitle(wall); ctx.restore(); return; }
  if (gameState === 'lobby') { drawLobby(wall); ctx.restore(); return; }
  if (!grid) {
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SYNCING…', W / 2, H / 2);
    ctx.restore();
    return;
  }

  ctx.translate(shake.x, shake.y);
  ctx.save();
  ctx.translate(-camX, -camY);
  // only draw what the camera can see (huge boards would otherwise cost a frame per tile)
  const vx0 = Math.max(0, Math.floor(camX / TILE) - 2), vx1 = Math.min(COLS - 1, Math.ceil((camX + W) / TILE) + 2);
  const vy0 = Math.max(0, Math.floor(camY / TILE) - 2), vy1 = Math.min(ROWS - 1, Math.ceil((camY + H - HUD_H) / TILE) + 2);

  for (let y = vy0; y <= vy1; y++)
    for (let x = vx0; x <= vx1; x++)
      drawTile(x, y, now);

  if (gameState === 'playing' && player && !player.downed) {
    const tx = player.x + player.dir.x, ty = player.y + player.dir.y;
    if (ib(tx, ty) && !grid[ty][tx].rev && !grid[ty][tx].crater) {
      const tt = grid[ty][tx];
      let rc = '#00ff8850';
      if (player.perks.sixth && tt.mine) rc = Math.sin(now / 130) > 0 ? '#ff2d55cc' : '#ff2d5560';
      else if (tt.mine && player.sapperLeft > 0 && tt.marked) rc = '#4a9eff80';
      ctx.strokeStyle = rc;
      ctx.lineWidth = 2;
      ctx.strokeRect(tx * TILE + 2, ty * TILE + HUD_H + 2, TILE - 4, TILE - 4);
    }
  }

  for (let y = vy0; y <= vy1; y++)
    for (let x = vx0; x <= vx1; x++) {
      const t = grid[y][x];
      if (t.rev && t.loot === 'bullet') drawLoot(x, y, now);
      else if (t.rev && t.loot === 'heart') drawHeart(x, y, now);
      else if (t.rev && t.loot === 'perk') drawCrate(x, y, now, t);
    }

  traps.forEach(t => drawTrap(t, now));
  eggs.forEach(e => drawEgg(e, now));
  enemies.forEach(e => drawEnemy(e, now));
  players.forEach(pl => { if (!pl.left) drawPlayer(pl, now, pl === player); });
  projectiles.forEach(p => drawProj(p));
  enemyBullets.forEach(b => drawEnemyBullet(b));
  particles.forEach(p => drawParticle(p));
  drawFloaters(wall);
  ctx.restore();
  drawHUD(now);
  drawCamOverlay(now);
  drawRivalPanel(now);
  drawToasts(wall);
  if (player && player.downed && gameState === 'playing') {
    const tgt = camFree ? null : players[camSpec];
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 12px Courier New';
    const label = camFree ? 'FREE CAMERA' : tgt ? (tgt.bot ? '⚙' : '') + tgt.name.toUpperCase() : '';
    const ally = tgt && teamsOn() && player && tgt.team === player.team;
    const full = '◂  ' + label + (ally ? ' · TEAMMATE' : '') + '  ▸';
    const tw = ctx.measureText(full).width;
    ctx.fillStyle = '#0d1117c8'; ctx.fillRect(W / 2 - tw / 2 - 10, H - 40, tw + 20, 32);
    ctx.fillStyle = camFree ? '#c9d1d9' : tgt ? tgt.color : '#c9d1d9';
    ctx.fillText(full, W / 2, H - 31);
    ctx.fillStyle = '#8b949e'; ctx.font = '10px Courier New';
    ctx.fillText((camFree ? 'WASD pan · F follow' : '←/→ switch · F free cam') +
      (specMode ? ' · X speed ' + (specFast ? '×4' : '×1') : ''), W / 2, H - 16);
    ctx.restore();
  }

  if (gameState === 'lost') {
    ctx.fillStyle = '#0d111799';
    ctx.fillRect(0, 0, W, H);
  } else if (gameState === 'won') {
    ctx.fillStyle = '#0d111730';
    ctx.fillRect(0, 0, W, H);
  } else if (gameState === 'draft') {
    ctx.fillStyle = '#0d111760';
    ctx.fillRect(0, 0, W, H);
  }

  // guest: snapshot stream stalled → host tabbed away / froze / hiccup
  if (net.mode === 'guest' && (gameState === 'playing' || gameState === 'draft') &&
      performance.now() - net.lastSnapWall > 700) {
    ctx.fillStyle = '#0d1117cc';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.save();
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#ffd700';
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 26px Courier New';
    ctx.fillText('HOST PAUSED', W / 2, H * 0.44);
    ctx.restore();
    ctx.fillStyle = '#8b949e';
    ctx.font = '12px Courier New';
    ctx.fillText('no signal from the host — did they tab away?', W / 2, H * 0.44 + 30);
    if (Math.sin(wall / 500) > 0) {
      ctx.fillStyle = '#00ff88';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('the run resumes automatically', W / 2, H * 0.44 + 54);
    }
  }

  ctx.restore();
}

function drawTile(x, y, now) {
  const t = grid[y][x], px = x * TILE, py = y * TILE + HUD_H;
  if (run && run.arena && run.cfg && run.cfg.pressure !== 'regen' && run.shrinkLevel > 0 &&
      edgeOf(x, y) < run.shrinkLevel) {
    // collapsed ring: standing here burns 1 heart per second
    ctx.fillStyle = '#160409';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = Math.sin(now / 300 + x * 1.7 + y * 2.3) > 0.6 ? '#5a0f1a' : '#2a070d';
    ctx.fillRect(px + 6 + ((x * 7 + y * 13) % 12), py + 6 + ((x * 11 + y * 5) % 14), 4, 4);
    return;
  }
  if (t.crater) {
    ctx.fillStyle = '#070a0e';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = '#ff3a0018';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
    ctx.fillStyle = '#0a0d12';
    ctx.beginPath();
    ctx.arc(px + TILE / 2, py + TILE / 2, TILE * 0.35, 0, Math.PI * 2);
    ctx.fill();
    if (t.stale) {
      // the numbers have reset, so this crater no longer counts toward them:
      // let it sink back into the floor so it can't be mistaken for fresh damage
      const k = Math.min(1, Math.max(0, (now - (t.staleT || 0)) / 900));
      ctx.fillStyle = 'rgba(22,27,34,' + (0.9 * k).toFixed(3) + ')';
      ctx.fillRect(px, py, TILE, TILE);
    }
  } else if (t.rev) {
    ctx.fillStyle = '#161b22';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = '#1e2329';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
    const age = now - (t.rt || 0);
    if (age < 350 && age >= 0) {
      const g = 1 - age / 350;
      ctx.fillStyle = `rgba(0,255,136,${g * 0.35})`;
      ctx.fillRect(px, py, TILE, TILE);
    }
    let showNum = t.num > 0;
    if (showNum && conf.dark) {
      // DARK floors: numbers only legible within 3 tiles of a live player
      showNum = players.some(p => !p.left && !p.downed &&
        Math.max(Math.abs(p.x - x), Math.abs(p.y - y)) <= 3);
    }
    if (showNum) {
      const nc = t.nearMega ? '#ffd700' : NUM_CLR[t.num];
      ctx.save();
      ctx.shadowBlur = t.nearMega ? 10 : 6;
      ctx.shadowColor = nc;
      ctx.fillStyle = nc;
      ctx.font = 'bold 15px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.num, px + TILE / 2, py + TILE / 2 + 1);
      ctx.restore();
    }
  } else {
    ctx.fillStyle = '#21262d';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#2d333b';
    ctx.fillRect(px, py, TILE, 2);
    ctx.fillRect(px, py, 2, TILE);
    ctx.fillStyle = '#171b21';
    ctx.fillRect(px, py + TILE - 2, TILE, 2);
    ctx.fillRect(px + TILE - 2, py, 2, TILE);

    if (t.loot === 'heart') {
      // faint pulse marking a buried heart — a destination worth digging to
      let show = true;
      if (conf.dark)
        show = players.some(p => !p.left && !p.downed &&
          Math.max(Math.abs(p.x - x), Math.abs(p.y - y)) <= 3);
      if (show) {
        const hp2 = 0.3 + Math.sin(now / 400) * 0.18;
        ctx.save();
        ctx.globalAlpha = hp2;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#ff6b6b';
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(px + TILE / 2, py + TILE / 2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    if (t.marked) {
      const pulse = 0.5 + Math.sin(now / 400) * 0.25;
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#4affff';
      ctx.beginPath();
      ctx.moveTo(px + TILE / 2, py + 8);
      ctx.lineTo(px + TILE / 2 + 7, py + 13);
      ctx.lineTo(px + TILE / 2, py + 18);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(px + TILE / 2 - 1, py + 8, 2, 16);
      ctx.restore();
    }

    if (borderCrack && borderCrack.x === x && borderCrack.y === y) {
      const prog = Math.min(Math.max((now - borderCrack.t) / 2000, 0), 1);
      const wobble = prog > 0.7 ? Math.round((Math.random() - 0.5) * 2) : 0;
      ctx.save();
      ctx.translate(wobble, wobble);
      ctx.fillStyle = `rgba(255,107,53,${0.3 + prog * 0.5})`;
      const s = Math.floor(prog * 3);
      const cx = px + TILE / 2, cy = py + TILE / 2;
      ctx.fillRect(cx - 1, cy - 2 - s * 2, 2, 4 + s * 4);
      if (s >= 1) {
        ctx.fillRect(cx - 4, cy - 1, 3, 2);
        ctx.fillRect(cx + 2, cy + 1, 3, 2);
      }
      if (s >= 2) {
        ctx.fillRect(cx - 2, cy - 6, 2, 3);
        ctx.fillRect(cx + 1, cy + 4, 2, 3);
        ctx.fillRect(cx - 5, cy + 2, 2, 2);
      }
      ctx.restore();
    }
  }

  // arena pressure telegraphs
  if (run && run.arena && run.cfg) {
    if (run.cfg.pressure !== 'regen') {
      if (edgeOf(x, y) === run.shrinkLevel && run.shrinkNext &&
          now > run.shrinkNext - 3000 && Math.sin(now / 120) > 0) {
        ctx.strokeStyle = '#ff2d55aa';
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 2, py + 2, TILE - 4, TILE - 4);
      }
    } else if (run.regenList && run.regenList.some(c2 => c2.x === x && c2.y === y) &&
               Math.sin(now / 150) > 0) {
      ctx.fillStyle = '#ff8a4a30';
      ctx.fillRect(px, py, TILE, TILE);
    }
  }
}

function drawLoot(x, y, now) {
  const cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2 + HUD_H;
  const pulse = 0.8 + Math.sin(now / 300) * 0.2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.PI / 4);
  ctx.globalAlpha = pulse;
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#ffd700';
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(-4, -4, 8, 8);
  ctx.restore();
}

function drawHeart(x, y, now) {
  const cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2 + HUD_H;
  const pulse = 0.8 + Math.sin(now / 250) * 0.2;
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#ff6b6b';
  ctx.fillStyle = '#ff6b6b';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('♥', cx, cy + 1);
  ctx.restore();
}

function drawTrap(tr, now) {
  const cx = tr.x * TILE + TILE / 2, cy = tr.y * TILE + TILE / 2 + HUD_H;
  const pulse = 0.6 + Math.sin(now / 250) * 0.3;
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = '#7dff9a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#7dff9a';
  ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);
  ctx.restore();
}

function drawEgg(egg, now) {
  const cx = egg.x * TILE + TILE / 2, cy = egg.y * TILE + TILE / 2 + HUD_H;
  const prog = Math.min(Math.max((now - egg.t) / conf.hatch, 0), 1);
  const wobble = Math.sin(now / (200 - prog * 150)) * prog * 5;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(wobble * Math.PI / 180);
  ctx.fillStyle = `hsl(${18 + prog * 25},90%,${52 + prog * 12}%)`;
  ctx.beginPath();
  ctx.ellipse(0, 0, 6, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  if (prog > 0.5) {
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-3, -4); ctx.lineTo(0, -1); ctx.lineTo(2, -3);
    ctx.stroke();
    if (prog > 0.75) {
      ctx.beginPath();
      ctx.moveTo(-1, 1); ctx.lineTo(1, 4);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawEnemy(e, now) {
  const ec = ENEMY_COLORS[e.type] || ENEMY_COLORS.normal;
  let cx = e.fx * TILE + TILE / 2, cy = e.fy * TILE + TILE / 2 + HUD_H;

  // Burrower underground: just a rumbling mound of dirt
  if (e.type === 'burrower' && ib(e.x, e.y) && !grid[e.y][e.x].rev && !grid[e.y][e.x].crater) {
    const wob = Math.sin(now / 60) * 1.5;
    ctx.save();
    ctx.translate(wob, 0);
    ctx.fillStyle = '#171b21';
    ctx.beginPath();
    ctx.arc(cx, cy + 4, 9, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#5a4630';
    ctx.beginPath();
    ctx.arc(cx, cy + 4, 6, Math.PI, 0);
    ctx.fill();
    ctx.restore();
    return;
  }

  const isWinding = e.type === 'charger' && e.chargeState === 'winding';
  const isCharging = e.type === 'charger' && e.chargeState === 'charging';
  const isStunned = e.type === 'charger' && e.chargeState === 'stunned';
  const isAiming = e.type === 'shooter' && e.shootState === 'charging';
  const isIgniting = e.type === 'pyro' && e.pyroState === 'igniting';
  const pSpeed = e.type === 'fast' ? 100 : isWinding || isStunned ? 40 : isAiming || isIgniting ? 50 : 180;
  const sSpeed = isCharging ? 80 : e.type === 'fast' ? 300 : e.type === 'pyro' ? 250 : 600;
  const pAmp = isWinding || isAiming || isStunned || isIgniting ? 0.25 : 0.12;
  const pulse = 1 + Math.sin(now / pSpeed) * pAmp;

  if (isWinding || isIgniting) {
    cx += (Math.random() - 0.5) * 3;
    cy += (Math.random() - 0.5) * 3;
  }

  const SPIKES = { shooter: 6, magpie: 4, bloater: 10, brood: 12 };
  const R1 = { bloater: 12, brood: 14, magpie: 9 };
  const R2 = { bloater: 9, brood: 10, magpie: 5 };

  if (isIgniting && e.igniteTarget) {
    const prog = Math.min(Math.max((now - e.igniteStart) / 800, 0), 1);
    const tx2 = e.igniteTarget.x * TILE + TILE / 2, ty2 = e.igniteTarget.y * TILE + TILE / 2 + HUD_H;
    ctx.save();
    ctx.globalAlpha = 0.25 + prog * 0.5;
    ctx.strokeStyle = '#ff7a00';
    ctx.lineWidth = 2 + prog * 3;
    ctx.shadowBlur = 12 * prog;
    ctx.shadowColor = '#ff7a00';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx2, ty2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.fillStyle = ec.glow;
  ctx.beginPath();
  ctx.arc(cx, cy, (isCharging || isIgniting ? 20 : 16) * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = ec.body;
  ctx.beginPath();
  const spikes = SPIKES[e.type] || 8;
  for (let i = 0; i < spikes; i++) {
    const a = (Math.PI * 2 / spikes) * i + now / sSpeed;
    const r = (i % 2 === 0 ? (R1[e.type] || 11) : (R2[e.type] || 7)) * pulse;
    const sx = cx + Math.cos(a) * r, sy = cy + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
  }
  ctx.closePath(); ctx.fill();

  if (e.type === 'brood' && (e.hp || 1) > 1) {
    ctx.strokeStyle = '#ffcf8880';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, 15 * pulse, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (e.type === 'charger' && e.chargeState && e.chargeDir) {
    const da = Math.atan2(e.chargeDir.y, e.chargeDir.x);
    ctx.fillStyle = isCharging ? '#dd88ff' : '#aa44ff88';
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(da) * 14 * pulse, cy + Math.sin(da) * 14 * pulse);
    ctx.lineTo(cx + Math.cos(da + 2.5) * 5, cy + Math.sin(da + 2.5) * 5);
    ctx.lineTo(cx + Math.cos(da - 2.5) * 5, cy + Math.sin(da - 2.5) * 5);
    ctx.closePath(); ctx.fill();
  }

  if (isAiming && e.shootDir) {
    const prog = Math.min(Math.max((now - e.shootStart) / 500, 0), 1);
    const da = Math.atan2(e.shootDir.y, e.shootDir.x);
    ctx.save();
    ctx.globalAlpha = 0.3 + prog * 0.5;
    ctx.strokeStyle = '#66aaff';
    ctx.lineWidth = 2 + prog * 2;
    ctx.shadowBlur = 10 * prog;
    ctx.shadowColor = '#66aaff';
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(da) * 10, cy + Math.sin(da) * 10);
    ctx.lineTo(cx + Math.cos(da) * (14 + prog * 10), cy + Math.sin(da) * (14 + prog * 10));
    ctx.stroke();
    ctx.restore();
  }

  ctx.fillStyle = ec.eye;
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();

  // arena: loyalty ring in the owner's color
  if (run && run.arena && e.owner >= 0 && players[e.owner]) {
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = players[e.owner].color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawPlayer(pl, now, isMe) {
  const cx = pl.fx * TILE + TILE / 2, cy = pl.fy * TILE + TILE / 2 + HUD_H;
  if (pl.downed) {
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = pl.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy - 5); ctx.lineTo(cx + 5, cy + 5);
    ctx.moveTo(cx + 5, cy - 5); ctx.lineTo(cx - 5, cy + 5);
    ctx.stroke();
    ctx.restore();
    return;
  }
  const blinking = now < pl.iframeUntil && Math.floor(now / 100) % 2 === 0;
  const pulse = 1 + Math.sin(now / 500) * 0.04;
  ctx.save();
  if (blinking) ctx.globalAlpha = 0.35;
  if (teamsOn()) {
    // allies (you included) wear a white ring; every other team has its own hue
    const ally = player && pl.team === player.team;
    ctx.save();
    ctx.strokeStyle = ally ? '#ffffff' : teamHex(pl.team);
    ctx.lineWidth = ally ? 2.5 : 1.8;
    ctx.globalAlpha *= ally ? 0.9 : 0.7;
    ctx.beginPath(); ctx.arc(cx, cy, 15.5, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = pl.color + '12';
  ctx.beginPath();
  ctx.arc(cx, cy, 18 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = pl.color;
  ctx.beginPath();
  ctx.arc(cx, cy, 10 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#00000030';
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fill();
  const a = Math.atan2(pl.dir.y, pl.dir.x);
  ctx.fillStyle = pl.color;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(a) * 15, cy + Math.sin(a) * 15);
  ctx.lineTo(cx + Math.cos(a + 2.6) * 7, cy + Math.sin(a + 2.6) * 7);
  ctx.lineTo(cx + Math.cos(a - 2.6) * 7, cy + Math.sin(a - 2.6) * 7);
  ctx.closePath(); ctx.fill();
  if (!isMe) {
    for (let i = 0; i < pl.maxHp; i++) {
      const frac = Math.max(0, Math.min(1, pl.hp - i));
      const bx = cx - pl.maxHp * 3 + i * 6;
      ctx.fillStyle = '#2a2f36';
      ctx.fillRect(bx, cy - 20, 4, 4);
      if (frac > 0) {
        ctx.fillStyle = '#ff4a6a';
        ctx.fillRect(bx, cy - 20, 4 * frac, 4);
      }
    }
    if (pl.name) {
      ctx.fillStyle = pl.color;
      ctx.font = 'bold 9px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const label = (pl.bot ? '⚙' : '') + pl.name.toUpperCase();
      ctx.fillText(label, cx, cy - 28);
      // shooting-changing perks flag a rival as dangerous
      if (pl.perks.demo || pl.perks.pierce || pl.perks.ricochet) {
        const nw = ctx.measureText(label).width;
        ctx.fillStyle = '#ff3355'; ctx.textAlign = 'left';
        ctx.fillText('!', cx + nw / 2 + 3, cy - 28);
        ctx.textAlign = 'center';
      }
    }
    // one colored pip per perk (a digit beside stacked ones)
    const ids = Object.keys(pl.perks);
    if (ids.length) {
      let tw = 0;
      const items = ids.map(id => { const n = pl.perks[id], w = 7 + (n > 1 ? 6 : 0); tw += w; return { id, n, w }; });
      let px = cx - tw / 2;
      items.forEach(it => {
        const pk = perkById(it.id);
        ctx.fillStyle = pk ? pk.clr : '#aaaaaa';
        ctx.fillRect(px, cy + 15, 5, 5);
        if (it.n > 1) {
          ctx.fillStyle = '#ffffff'; ctx.font = 'bold 7px Courier New'; ctx.textAlign = 'left';
          ctx.fillText(String(it.n), px + 6, cy + 18);
        }
        px += it.w;
      });
      ctx.textAlign = 'center';
    }
  }
  ctx.restore();
}

function drawProj(p) {
  const ex = p.x + p.dx * BULLET_SPEED * (acc / 1000);
  const ey = p.y + p.dy * BULLET_SPEED * (acc / 1000);
  const px = ex * TILE, py = ey * TILE + HUD_H;
  ctx.strokeStyle = '#ffd70050';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px - p.dx * TILE * 0.6, py - p.dy * TILE * 0.6);
  ctx.stroke();
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(px, py, 3.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawEnemyBullet(b) {
  const ex = b.x + b.dx * 12 * (acc / 1000);
  const ey = b.y + b.dy * 12 * (acc / 1000);
  const px = ex * TILE, py = ey * TILE + HUD_H;
  ctx.strokeStyle = '#66aaff40';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px - b.dx * TILE * 0.8, py - b.dy * TILE * 0.8);
  ctx.stroke();
  ctx.save();
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#66aaff';
  ctx.fillStyle = '#66aaff';
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticle(p) {
  const alpha = Math.max(0, p.life / p.ml);
  ctx.globalAlpha = alpha * (p.flash ? 0.6 : 1);
  ctx.fillStyle = p.clr;
  if (p.text) {
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.text, p.x, p.y);
  } else if (p.flash) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.sz * alpha, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
}

// partial heart: dark glyph with the left fraction clipped in bright red,
// so a quarter heart actually reads as a quarter
function drawHeartGlyph(x, y, frac, size) {
  ctx.font = 'bold ' + size + 'px Courier New';
  ctx.fillStyle = '#2a2f36';
  ctx.fillText('♥', x, y);
  if (frac <= 0) return;
  const w = ctx.measureText('♥').width;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - 1, y - size, w * Math.min(1, frac) + 1, size * 2);
  ctx.clip();
  ctx.fillStyle = '#ff4a6a';
  ctx.fillText('♥', x, y);
  ctx.restore();
}

function drawHUD(now) {
  ctx.fillStyle = '#0f1318';
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = '#1e2329';
  ctx.fillRect(0, HUD_H - 1, W, 1);
  if (!player) return;

  ctx.textBaseline = 'middle';
  const y1 = 18, y2 = 45;

  ctx.textAlign = 'left';
  let hx = 14;
  for (let i = 0; i < player.maxHp; i++) {
    drawHeartGlyph(hx, y1, player.hp - i, 15);
    hx += 16;
  }
  ctx.font = 'bold 13px Courier New';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('◆ ' + player.bullets, hx + 10, y1);

  const dispTime = gameState === 'playing' || gameState === 'draft' ? gameTime : finalTime;
  ctx.fillStyle = '#c9d1d9';
  ctx.textAlign = 'right';
  ctx.fillText(fmtTime(dispTime), W - 14, y1);

  ctx.textAlign = 'center';
  ctx.font = 'bold 14px Courier New';
  if (run.arena) {
    const alive = players.filter(p => !p.left && !p.downed).length;
    const nxt = run.cfg && run.cfg.pressure === 'regen' ? run.regenNext : run.shrinkNext;
    const rem = Math.max(0, (nxt - now) / 1000);
    ctx.fillStyle = '#ff2d55';
    ctx.fillText('⚔ ' + (teamsOn() ? new Set(players.filter(p => !p.left && !p.downed).map(p => p.team)).size + ' TEAMS · ' + alive : alive) + ' ALIVE · ' +
      (run.cfg && run.cfg.pressure === 'regen' ? 'REGROW ' : 'COLLAPSE ') + fmtTime(rem), W / 2, y1);
  } else if (run.depth > MAX_DEPTH) {
    ctx.fillStyle = '#c77dff';
    ctx.fillText('ABYSS ' + run.depth + (conf.mod ? ' · ' + conf.mod : ''), W / 2, y1);
  } else if (conf.gladiator) {
    ctx.fillStyle = '#ff8a4a';
    ctx.fillText('⚔ DEPTH ' + run.depth + ' / ' + MAX_DEPTH + ' — GLADIATOR', W / 2, y1);
  } else {
    ctx.fillStyle = '#ffd700';
    ctx.fillText('DEPTH ' + run.depth + ' / ' + MAX_DEPTH, W / 2, y1);
  }

  ctx.font = 'bold 12px Courier New';
  const rev = totalSafe - tilesLeft;
  ctx.fillStyle = '#7a828a';
  ctx.textAlign = 'left';
  ctx.fillText('TILES ' + rev + '/' + totalSafe, 14, y2);

  // perk badges (truncated with +n if they'd run into the right-side counters)
  let px = 118;
  ctx.font = 'bold 11px Courier New';
  let hidden = 0;
  for (const p of PERKS) {
    const n = player.perks[p.id];
    if (!n) continue;
    let label = p.tag + (p.stack && n > 1 ? '×' + n : '');
    if (p.id === 'sapper') label = p.tag + ':' + player.sapperLeft;
    const lw = ctx.measureText(label).width;
    if (px + lw > W - 105) { hidden++; continue; }
    ctx.fillStyle = p.clr;
    ctx.fillText(label, px, y2);
    px += lw + 10;
  }
  if (hidden) { ctx.fillStyle = '#586069'; ctx.fillText('+' + hidden, px, y2); }

  ctx.textAlign = 'right';
  let rx = W - 14;
  if (eggs.length > 0) {
    ctx.fillStyle = '#ff8a4a';
    ctx.fillText('○ ' + eggs.length, rx, y2);
    rx -= 46;
  }
  if (enemies.length > 0) {
    ctx.fillStyle = '#ff2d55';
    ctx.fillText('▲ ' + enemies.length, rx, y2);
  }

  // party status board: one row per teammate (name · hearts · ammo · build)
  const bigTable = players.filter(p => !p.left).length > 5;
  if (bigTable) { drawRosterStrip(); if (!teamsOn()) return; }
  let row = 0;
  const myTeam = players[myIdx] ? players[myIdx].team : 0;
  players.forEach(pl => {
    if (pl.idx === myIdx || pl.left) return;
    if (teamsOn() && pl.team !== myTeam) return;          // team mode: rows are for teammates
    const y = 72 + (bigTable ? 20 : 0) + row * 16;
    row++;
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px Courier New';
    ctx.fillStyle = pl.downed ? '#586069' : pl.color;
    ctx.fillText((pl.name || 'P' + (pl.idx + 1)).toUpperCase().slice(0, 8), 14, y);
    const hx2 = 92;
    if (pl.downed) {
      ctx.fillStyle = '#ff2d55';
      ctx.fillText('DOWN', hx2, y);
    } else {
      let hx3 = hx2;
      for (let i = 0; i < pl.maxHp; i++) {
        drawHeartGlyph(hx3, y, pl.hp - i, 11);
        hx3 += 11;
      }
      ctx.font = 'bold 11px Courier New';
    }
    const ax = hx2 + Math.max(4, pl.maxHp) * 11 + 8;
    ctx.fillStyle = '#ffd700';
    ctx.fillText('◆' + pl.bullets, ax, y);
    let px3 = ax + 42;
    let hid = 0;
    for (const p of PERKS) {
      const n = pl.perks ? pl.perks[p.id] : 0;
      if (!n) continue;
      const label = p.tag + (p.stack && n > 1 ? '×' + n : '');
      const lw2 = ctx.measureText(label).width;
      if (px3 + lw2 > W - 26) { hid++; continue; }
      ctx.fillStyle = p.clr;
      ctx.fillText(label, px3, y);
      px3 += lw2 + 8;
    }
    if (hid) { ctx.fillStyle = '#586069'; ctx.fillText('+' + hid, px3, y); }
  });
}

function drawRosterStrip() {
  const list = players.filter(p => !p.left);
  const n = list.length;
  const sz = Math.max(3, Math.min(14, Math.floor((W - 28 - 70) / n) - 2));
  let x = 14;
  const y = 66;
  list.forEach(p => {
    ctx.fillStyle = p.downed ? '#2a2f36' : p.color;
    ctx.fillRect(x, y, sz, sz);
    if (p.idx === myIdx || (teamsOn() && players[myIdx] && p.team === players[myIdx].team)) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.strokeRect(x - 1, y - 1, sz + 2, sz + 2);
    }
    if (p.downed) {
      ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + sz, y + sz); ctx.moveTo(x + sz, y); ctx.lineTo(x, y + sz); ctx.stroke();
    }
    x += sz + 2;

function drawToasts(wall) {
  const fade = (t) => {
    const age = wall - t.t, life = t.life || 3000;
    return Math.max(0, age < 250 ? age / 250 : age > life - 600 ? (life - age) / 600 : 1);
  };
  ctx.save();
  ctx.textBaseline = 'middle';
  // announcements: compact banner at the top, at most two, no heavy glow
  toasts.filter(t => !t.parts).slice(-2).forEach((t, i) => {
    ctx.globalAlpha = fade(t) * 0.92;
    ctx.font = 'bold 12px Courier New';
    const tw = ctx.measureText(t.text).width;
    ctx.fillStyle = '#0d1117b8';
    ctx.fillRect(W / 2 - tw / 2 - 8, HUD_H + 6 + i * 20, tw + 16, 18);
    ctx.fillStyle = '#ffd700';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, W / 2, HUD_H + 15 + i * 20);
  });
  // kill feed: small log tucked in the top-right corner, out of the action
  toasts.filter(t => t.parts).slice(-4).forEach((t, i) => {
    ctx.globalAlpha = fade(t) * 0.95;
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'left';
    let tw = 0;
    t.parts.forEach(q => { tw += ctx.measureText(q[0]).width; });
    let tx = W - 8 - tw;
    const ty = HUD_H + 12 + i * 15;
    ctx.fillStyle = '#0d1117a0';
    ctx.fillRect(tx - 4, ty - 7, tw + 8, 14);
    t.parts.forEach(q => {
      ctx.fillStyle = q[1];
      ctx.fillText(q[0], tx, ty);
      tx += ctx.measureText(q[0]).width;
    });
  });
  ctx.restore();
}
