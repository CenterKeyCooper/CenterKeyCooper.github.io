}

function buildFloor() {
  floorCv = document.createElement('canvas');
  floorCv.width = WORLD_W; floorCv.height = WORLD_H;
  const f = floorCv.getContext('2d');
  const mk = curMode().key;
  if (mk === 'survivor') drawIsland(f);
  else if (mk === 'bb') drawBBHouse(f);
  else drawLodge(f);
}

// Movement: steer toward a desired velocity rather than teleporting —
// you lean into a run, glide to a stop, and arrive gently at a click.
function updateSelf(dt) {
  const p = POS[me.pid];
  if (!p) return;
  p.vx = p.vx || 0; p.vy = p.vy || 0;
  let ix = 0, iy = 0;
  if (keys.w || keys.ArrowUp) iy -= 1;
  if (keys.s || keys.ArrowDown) iy += 1;
  if (keys.a || keys.ArrowLeft) ix -= 1;
  if (keys.d || keys.ArrowRight) ix += 1;
  let dvx = 0, dvy = 0;
  if (ix || iy) {
    moveTarget = null;
    const m = Math.hypot(ix, iy);
    dvx = (ix / m) * MAXV; dvy = (iy / m) * MAXV;
  } else if (moveTarget) {
    const dx = moveTarget.x - p.x, dy = moveTarget.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 7 && Math.hypot(p.vx, p.vy) < 30) moveTarget = null;
    else {
      const arrive = Math.min(1, d / 110); // ease in as you get close
      dvx = (dx / d) * MAXV * arrive; dvy = (dy / d) * MAXV * arrive;
    }
  }
  const k = Math.min(1, dt * STEER);
  p.vx += (dvx - p.vx) * k;
  p.vy += (dvy - p.vy) * k;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (p.x < 20 || p.x > WORLD_W - 20) { p.x = clamp(p.x, 20, WORLD_W - 20); p.vx = 0; }
  if (p.y < 20 || p.y > WORLD_H - 20) { p.y = clamp(p.y, 20, WORLD_H - 20); p.vy = 0; }
  // the map pushes back: BB walls are solid; the island's coast holds
  // the living, while ghosts drift out over the water
  const mk = curMode().key;
  if (mk === 'bb') collideWalls(p, getWalls(), 14);
  else if (mk === 'survivor') {
    const mp = CV.players[me.pid];
    if (!mp || !mp.ghost) islandConstrain(p);
  }
  p.dx = p.x; p.dy = p.y;
  const t = now();
  if (!me.isHost && t - lastPosSend > 1000 / POS_HZ) {
    lastPosSend = t;
    toHost({ t: 'pos', x: Math.round(p.x), y: Math.round(p.y) });
  }
}

// Camera: trails you softly, looking a touch ahead of your momentum.
const cam = { x: 0, y: 0, init: false };
function updateCam(dt) {
  const p = POS[me.pid];
  if (!p) return;
  const tx = clamp((p.dx + (p.vx || 0) * .25) - VIEW_W / 2, 0, WORLD_W - VIEW_W);
  const ty = clamp((p.dy + (p.vy || 0) * .25) - VIEW_H / 2, 0, WORLD_H - VIEW_H);
  if (!cam.init) { cam.x = tx; cam.y = ty; cam.init = true; return; }
  const k = 1 - Math.exp(-dt * 4.5);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
}

function hostPump() {
  const t = now();
  if (t - lastPosBcast > 1000 / POS_HZ) {
    lastPosBcast = t;
    const snap = positionsSnapshot();
    for (const [pid, c] of net.conns) if (c.open) { try { c.send({ t: 'posAll', p: snap }); } catch (e) {} }
  }
  if (G.challenge && G.challenge.active && t - lastProgBcast > 1000 / PROG_HZ) {
    lastProgBcast = t;
    hostBroadcast({ t: 'chProg', p: G.challenge.progress });
  }
}

function drawDot(pid, p, q, t) {
  const gh = p.ghost;
  // ghosts hover on a slow swell; the living get the faintest footstep sway
  const bob = gh ? Math.sin(t / 520 + q.dx * .01) * 2
                 : Math.sin(t / 110 + q.dx * .05) * Math.min(.9, (q.mv || 0) / 300);
  const dx = q.dx, dy = q.dy + bob;
  lctx.globalAlpha = gh ? .45 : 1;
  // top-down drop shadow, cast away from the nearest light; ghosts
  // float higher, so theirs sits smaller and farther out
  const so = shadowOffset(dx, q.dy);
  if (gh) {
    lctx.fillStyle = 'rgba(0,0,0,.16)';
    lctx.beginPath(); lctx.ellipse(dx + so.x * 1.7, q.dy + so.y * 1.7 + 7, 9, 6, 0, 0, 7); lctx.fill();
  } else {
    lctx.fillStyle = 'rgba(0,0,0,.36)';
    lctx.beginPath(); lctx.ellipse(dx + so.x, q.dy + so.y + 2, 14, 11, 0, 0, 7); lctx.fill();
  }
  // rings
  if ((p.tags || []).includes('nom')) {
    lctx.strokeStyle = '#e2603a'; lctx.lineWidth = 2;
    lctx.beginPath(); lctx.arc(dx, dy, 21, 0, 7); lctx.stroke();
    for (const a of [0, 1.5708, 3.1416, 4.7124]) {
      lctx.beginPath();
      lctx.moveTo(dx + Math.cos(a) * 17, dy + Math.sin(a) * 17);
      lctx.lineTo(dx + Math.cos(a) * 25, dy + Math.sin(a) * 25);
      lctx.stroke();
    }
  }
  if ((p.tags || []).includes('immune')) {
    lctx.strokeStyle = 'rgba(224,179,76,.85)'; lctx.lineWidth = 2;
    lctx.shadowColor = 'rgba(224,179,76,.6)'; lctx.shadowBlur = 12;
    lctx.beginPath(); lctx.arc(dx, dy, 19, 0, 7); lctx.stroke();
    lctx.shadowBlur = 0;
  }
  if (p.tribe === 0 || p.tribe === 1) {
    lctx.strokeStyle = TRIBES[p.tribe].color; lctx.lineWidth = 1.6;
    lctx.globalAlpha = (gh ? .45 : 1) * .75;
    lctx.beginPath(); lctx.arc(dx, dy, 16.5, 0, 7); lctx.stroke();
    lctx.globalAlpha = gh ? .45 : 1;
  }
  // the dot itself: one flat color, no glare
  lctx.fillStyle = p.color;
  lctx.beginPath(); lctx.arc(dx, dy, 13, 0, 7); lctx.fill();
  lctx.strokeStyle = 'rgba(0,0,0,.4)'; lctx.lineWidth = 1;
  lctx.beginPath(); lctx.arc(dx, dy, 13, 0, 7); lctx.stroke();
  if (gh) {
    lctx.strokeStyle = '#8fa3b8';
    if (lctx.setLineDash) lctx.setLineDash([3, 4]);
    lctx.lineWidth = 1.5;
    lctx.beginPath(); lctx.arc(dx, dy, 13, 0, 7); lctx.stroke();
    if (lctx.setLineDash) lctx.setLineDash([]);
  }
  // name
  lctx.font = '12.5px Georgia, serif';
  lctx.textAlign = 'center';
  lctx.fillStyle = 'rgba(0,0,0,.6)';
  lctx.fillText(p.name, dx, dy + 32);
  lctx.fillStyle = gh ? '#8fa3b8' : '#e8dcc3';
  lctx.fillText(p.name, dx, dy + 31);
  if (pid === me.pid) {
    lctx.strokeStyle = 'rgba(224,179,76,.55)'; lctx.lineWidth = 1;
    const nw = lctx.measureText(p.name).width;
    lctx.beginPath(); lctx.moveTo(dx - nw / 2, dy + 35.5); lctx.lineTo(dx + nw / 2, dy + 35.5); lctx.stroke();
  }
  // power glyphs above the head
  const badges = (p.tags || []).filter(tg => TAGDEF[tg]);
  if (gh) badges.push('__wisp');
  if (badges.length) {
    const bw = 16;
    let bx = dx - (badges.length - 1) * bw / 2;
    for (const tg of badges) {
      if (tg === '__wisp') symDraw(lctx, 'wisp', bx, dy - 26, 13, '#8fa3b8', .8);
      else symDraw(lctx, TAGDEF[tg].sym, bx, dy - 26, 13, TAGDEF[tg].color);
      bx += bw;
    }
  }
  // talking indicator (text)
  if (talks[pid] && t < talks[pid]) {
    const pulse = .45 + .35 * Math.sin(t / 130);
    symDraw(lctx, 'speech', dx + 22, dy - 16, 13, gh ? '#8fa3b8' : '#e8dcc3', pulse);
  }
  // speaking ring (voice) — the living can't see a ghost's lips move
  const meGh = (CV.players[me.pid] || {}).ghost;
  const lv = speakLevel(pid);
  if (lv > .045 && !(gh && !meGh)) {
    lctx.strokeStyle = p.mega ? 'rgba(224,179,76,.9)' : 'rgba(143,191,111,.85)';
    lctx.lineWidth = 2;
    lctx.globalAlpha = Math.min(.9, lv * 7);
    lctx.beginPath(); lctx.arc(dx, dy, 17 + Math.min(4, lv * 26), 0, 7); lctx.stroke();
  }
  lctx.globalAlpha = 1;
}

function drawLobby(t) {
  const W = WORLD_W, H = WORLD_H;
  if (!floorCv) buildFloor();
  lctx.fillStyle = '#17120c';
  lctx.fillRect(0, 0, VIEW_W, VIEW_H);
  lctx.save();
  lctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  if (floorCv) lctx.drawImage(floorCv, 0, 0);
  // click-to-move marker: a ring settling into the floor
  if (moveTarget) {
    const ph = (t % 900) / 900;
    lctx.strokeStyle = 'rgba(224,179,76,' + (.35 * (1 - ph)) + ')';
    lctx.lineWidth = 1.5;
    lctx.beginPath(); lctx.arc(moveTarget.x, moveTarget.y, 6 + ph * 14, 0, 7); lctx.stroke();
  }
  const meP = CV.players[me.pid];
  // hearing circle around self
  if (POS[me.pid]) {
    const col = meP && meP.ghost ? '143,163,184' : '224,179,76';
    lctx.strokeStyle = 'rgba(' + col + ',.13)';
    lctx.lineWidth = 1.5;
    lctx.shadowColor = 'rgba(' + col + ',.25)'; lctx.shadowBlur = 10;
    lctx.beginPath(); lctx.arc(POS[me.pid].dx, POS[me.pid].dy, CHAT_R, 0, 7); lctx.stroke();
    lctx.shadowBlur = 0;
  }
  // dots: living first, ghosts drift above
  const entries = Object.entries(CV.players).filter(([pid, p]) => p.connected && POS[pid]);
  for (const [pid, p] of entries) {
    const q = POS[pid];
    if (pid !== me.pid) {
      if (q.dx == null) { q.dx = q.x; q.dy = q.y; }
      const k = 1 - Math.exp(-.016 * 11); // smooth chase of the last known spot
      q.dx += (q.x - q.dx) * k;
      q.dy += (q.y - q.dy) * k;
    }
    // smoothed movement estimate → footstep bob amplitude
    const spd = pid === me.pid ? Math.hypot(q.vx || 0, q.vy || 0) : Math.hypot(q.x - q.dx, q.y - q.dy) * 9;
    q.mv = (q.mv || 0) + (spd - (q.mv || 0)) * .12;
  }
  for (const [pid, p] of entries) if (!p.ghost) drawDot(pid, p, POS[pid], t);
  for (const [pid, p] of entries) if (p.ghost) drawDot(pid, p, POS[pid], t);
  // speech bubbles (recipient-only: we only ever received what we could hear)
  lctx.textAlign = 'center';
  for (const b of bubbles) {
    if (t > b.until || !POS[b.pid]) continue;
    const q = POS[b.pid];
    const txt = b.text.length > 44 ? b.text.slice(0, 43) + '…' : b.text;
    lctx.font = '13px Georgia, serif';
    const tw = lctx.measureText(txt).width;
    const w = Math.min(380, Math.max(46, tw)) + 20;
    const bx = clamp(q.dx, w / 2 + 6, W - w / 2 - 6), by = clamp(q.dy - 64, 28, H);
    lctx.globalAlpha = clamp((b.until - t) / 800, 0, 1);
    lctx.fillStyle = b.ghost ? '#1a1f26' : '#241d15';
    lctx.strokeStyle = b.ghost ? 'rgba(143,163,184,.5)' : '#4a3826';
    lctx.lineWidth = 1;
    lctx.beginPath();
    if (lctx.roundRect) lctx.roundRect(bx - w / 2, by - 15, w, 25, 5);
    else lctx.rect(bx - w / 2, by - 15, w, 25);
    lctx.fill(); lctx.stroke();
    // tail
    lctx.beginPath();
    lctx.moveTo(bx - 4, by + 10); lctx.lineTo(bx, by + 17); lctx.lineTo(bx + 5, by + 10);
    lctx.fill();
    lctx.fillStyle = b.ghost ? '#8fa3b8' : '#e8dcc3';
    lctx.fillText(txt, bx, by + 3);
    lctx.globalAlpha = 1;
  }
  lctx.restore();
  if (bannerUntil && t > bannerUntil) { el.banner.classList.add('hidden'); bannerUntil = 0; }
}

// ---------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------
let lastFrame = 0;
function frame() {
  const t = now();
  const dt = clamp((t - lastFrame) / 1000, 0, 0.1);
  lastFrame = t;
  if (net.mode) {
    updateSelf(dt);
    updateCam(dt);
    updateVoice();
    if (me.isHost && G) hostPump();
    drawLobby(t);
    if (CH && !CH.spectate && CH.state !== 'results') {
      if (CH.state === 'countdown' && t >= CH.startAt) CH.state = 'play';
      if (CH.state === 'play' || CH.state === 'done') {
        if (CH.inst.tick) CH.inst.tick(dt, t);
      }
      if (CH.state === 'countdown') {
        cctx.fillStyle = '#18130d'; cctx.fillRect(0, 0, 520, 560);
        cctx.textAlign = 'center';
        cctx.fillStyle = '#e0b34c';
        cctx.shadowColor = 'rgba(224,179,76,.55)'; cctx.shadowBlur = 34;
        cctx.font = '88px Georgia, serif';
        cctx.fillText(String(Math.ceil((CH.startAt - t) / 1000)), 260, 305);
        cctx.shadowBlur = 0;
        cctx.font = '13px Georgia, serif';
        cctx.fillStyle = '#a8977a';
        cctx.fillText('STEADY…', 260, 350);
      } else if (CH.inst.draw) {
        CH.inst.draw(cctx, 520, 560, t);
      }
      if (!CH._sideAt || t - CH._sideAt > 400) { CH._sideAt = t; renderChSide(); }
    }
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------
// Input wiring
// ---------------------------------------------------------------------
function canvasXY(cv, ev) {
  const r = cv.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left) * (cv.width / (r.width || cv.width)),
    y: (ev.clientY - r.top) * (cv.height / (r.height || cv.height)),
  };
}
document.addEventListener('keydown', e => {
  const typing = document.activeElement && (document.activeElement.tagName === 'INPUT');
  if (typing) {
    if (e.key === 'Enter' && document.activeElement === el.chatIn) {
      sendChat(el.chatIn.value); el.chatIn.value = '';
    }
    return;
  }
  if (CH && !CH.spectate && (CH.state === 'play')) {
    if (CH.inst.key) CH.inst.key(e);
    if (e.key === ' ') e.preventDefault();
    return;
  }
  if (e.key === 'Enter') { el.chatIn.focus(); e.preventDefault(); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;
});
document.addEventListener('keyup', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
});
el.lobbyCanvas.addEventListener('mousedown', ev => {
  const { x, y } = canvasXY(el.lobbyCanvas, ev);
  moveTarget = { x: clamp(x + cam.x, 20, WORLD_W - 20), y: clamp(y + cam.y, 20, WORLD_H - 20) };
});
el.chCanvas.addEventListener('mousedown', ev => {
  if (!CH || CH.spectate || CH.state !== 'play') return;
  const { x, y } = canvasXY(el.chCanvas, ev);
  if (CH.inst.click) CH.inst.click(x, y);
});
el.chatBtn.addEventListener('click', () => { sendChat(el.chatIn.value); el.chatIn.value = ''; });
el.voiceBtn.addEventListener('click', () => { VOICE.on ? leaveVoice() : joinVoice(); });
el.muteBtn.addEventListener('click', toggleMute);
el.megaBtn.addEventListener('click', () => {
  if (me.isHost && G && G.players[me.pid]) hostSetMega(!G.players[me.pid].mega);
});

// ----- title screen -----
function renderModeCards() {
  el.modeCards.innerHTML = Object.values(MODES).map(m =>
    '<div class="mcard' + (m.key === hostModeSel ? ' sel' : '') + '" data-mode="' + m.key + '">' +
    '<div class="ms">' + symSvg(m.sym, 26) + '</div>' +
    '<div class="mn">' + esc(m.name) + '</div>' +
    '<div class="mb">' + esc(m.blurb) + '</div></div>'
  ).join('');
  for (const c of el.modeCards.querySelectorAll ? el.modeCards.querySelectorAll('[data-mode]') : []) {
    c.onclick = () => { hostModeSel = c.getAttribute('data-mode'); renderModeCards(); };
  }
}
renderModeCards();
el.nameIn.value = lsGet('blindside-name') || '';
el.hostBtn.addEventListener('click', () => {
  me.name = (el.nameIn.value || 'HOST').trim().slice(0, 14) || 'HOST';
  lsSet('blindside-name', me.name);
  hostLobby(hostModeSel);
});
el.joinBtn.addEventListener('click', () => {
  me.name = (el.nameIn.value || 'PLAYER').trim().slice(0, 14) || 'PLAYER';
  lsSet('blindside-name', me.name);
  const code = (el.codeIn.value || '').trim().toUpperCase();
  if (code.length !== 5) { el.titleMsg.textContent = 'THE CODE IS FIVE LETTERS'; return; }
  joinLobby(code);
});

// ----- host console -----
el.clearTagsBtn.addEventListener('click', () => { if (me.isHost) hostClearTags(); });
el.drawTribesBtn.addEventListener('click', () => { if (me.isHost) hostDrawTribes(); });
el.mergeBtn.addEventListener('click', () => { if (me.isHost) hostMergeTribes(); });
for (const [k, d] of Object.entries(CHALLENGES)) {
  const o = document.createElement('option');
  o.value = k; o.textContent = d.name;
  el.chSelect.appendChild(o);
}
el.chStartBtn.addEventListener('click', () => { if (me.isHost) hostStartChallenge(el.chSelect.value); });
el.voteSetupBtn.addEventListener('click', () => { if (me.isHost) hostOpenVoteSetup(); });
el.annBtn.addEventListener('click', () => {
  if (!me.isHost) return;
  const t = (el.annIn.value || '').trim().slice(0, 120);
  if (!t) return;
  el.annIn.value = '';
  hostBroadcast({ t: 'ann', text: t });
});

// url ?code=XXXXX prefill
try {
  const u = new URLSearchParams(location.search);
  if (u.get('code')) el.codeIn.value = u.get('code').toUpperCase();
} catch (e) {}

requestAnimationFrame(frame);

// Debug/test hook
window.__bls = {
  me, net, POS, CHALLENGES, MODES, TRIBES, TAGDEF,
  get G() { return G; }, get CV() { return CV; }, get CH() { return CH; },
  hostLobby, joinLobby, sendChat, castVote, backToTitle,
  hostStartChallenge, hostEndChallenge, hostCloseChallenge,
  hostToggleTag, hostSetGhost, hostClearTags, hostKick,
  hostSetTribe, hostDrawTribes, hostMergeTribes, hostGrantTribeImmunity,
  hostStartVote, hostRevealNext, hostEndVote, hostClearVote,
  VOICE, joinVoice, leaveVoice, toggleMute, hostSetMega, reconcileVoice,
  onHostMsg, onNetMsg, setName(n) { me.name = n; },
};
</script>
